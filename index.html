om 1 to 10. While the number is outside that range, print `out of range, try again` and ask again. Once it's good, print `you picked 4` (with their number).","starter":"number = int(input(\"pick a number from 1 to 10: \"))\n","tests":[{"inputs":["0","15","4"],"expect":["out of range, try again","you picked 4"]},{"inputs":["7"],"expect":["you picked 7"],"reject":["out of range"]},{"inputs":["11","10"],"expect":["you picked 10"]},{"inputs":["-3","1"],"expect":["you picked 1"]}],"require":["while"],"hints":["\"Outside 1 to 10\" means smaller than 1, or bigger than 10. That's two conditions joined with `or`.","`while number < 1 or number > 10:` Inside: print the message, then ask again with the same `int(input(...))` line.","After the loop, with no indent: `print(\"you picked\", number)`. The program only gets there once the number is good."],"solution":"number = int(input(\"pick a number from 1 to 10: \"))\nwhile number < 1 or number > 10:\n    print(\"out of range, try again\")\n    number = int(input(\"pick a number from 1 to 10: \"))\nprint(\"you picked\", number)"},{"t":"code","id":"d4-x-until-done","task":"Keep asking for whole numbers until the user types `done`. Then print the total of all the numbers once, like `total: 18`.\n\nExample: `5`, `10`, `3`, `done` prints `total: 18`. If they type `done` straight away, it prints `total: 0`.","starter":"total = 0\n","tests":[{"inputs":["5","10","3","done"],"expect":["total: 18"],"reject":["total: 5\n","total: 15"]},{"inputs":["done"],"expect":["total: 0"]},{"inputs":["100","1","done"],"expect":["total: 101"]}],"require":["while"],"hints":["This is the keep-asking shape. Ask once before the loop and keep the text in `answer`. Don't put int() around it: \"done\" isn't a number.","`while answer != \"done\":` Inside: add `int(answer)` to the total, then ask again.","After the loop, with no indent: `print(\"total:\", total)`."],"solution":"total = 0\nanswer = input(\"enter a number, or done: \")\nwhile answer != \"done\":\n    total = total + int(answer)\n    answer = input(\"enter a number, or done: \")\nprint(\"total:\", total)"},{"t":"code","id":"d4-x-savings","task":"You put $100 in a bank, and every year it grows by 10% (that's times 1.1). Ask for a goal amount, then use a while loop to find how many years it takes to reach the goal. Print it like `it takes 8 years`.\n\nExample: a goal of `200` prints `it takes 8 years`.","starter":"goal = float(input(\"your goal: \"))\nmoney = 100\nyears = 0\n","tests":[{"inputs":["200"],"expect":["it takes 8 years"],"reject":["it takes 7 years"]},{"inputs":["150"],"expect":["it takes 5 years"]},{"inputs":["100"],"expect":["it takes 0 years"]}],"require":["while"],"hints":["You don't know how many years in advance, so while fits. Keep going while the money is still less than the goal.","`while money < goal:` Inside, two changes: the money grows, `money = money * 1.1`, and one more year passes, `years = years + 1`.","After the loop, with no indent: `print(\"it takes\", years, \"years\")`."],"solution":"goal = float(input(\"your goal: \"))\nmoney = 100\nyears = 0\nwhile money < goal:\n    money = money * 1.1\n    years = years + 1\nprint(\"it takes\", years, \"years\")"},{"t":"code","id":"d4-x-menu","task":"Build a tiny menu with the same shape as the project menu. Show these 3 lines again and again:\n\n- `1. add a point`\n- `2. show the score`\n- `3. quit`\n\nChoice `1` adds 1 to the score (it starts at 0). Choice `2` prints the score, like `score: 2`. Choice `3` prints `bye!` and ends the loop. Anything else prints `not a choice`.","starter":"score = 0\n","tests":[{"inputs":["1","1","2","3"],"expect":["score: 2","bye!"]},{"inputs":["2","1","2","3"],"expect":["score: 0","score: 1","bye!"]},{"inputs":["7","3"],"expect":["not a choice","bye!"]},{"inputs":["3"],"expect":["bye!"],"reject":["not a choice","score:"]}],"require":["while"],"hints":["`while True:` repeats until a `break` stops it. Inside: print the 3 menu lines, then ask for the choice.","Use if / elif / else on the choice. input() gives text, so compare with `\"1\"` in quotes, not 1.","In the `\"3\"` branch: `print(\"bye!\")` and then `break` on the next line, with the same indent. Without break, the menu never stops."],"solution":"score = 0\nwhile True:\n    print(\"1. add a point\")\n    print(\"2. show the score\")\n    print(\"3. quit\")\n    choice = input(\"pick 1, 2 or 3: \")\n    if choice == \"1\":\n        score = score + 1\n    elif choice == \"2\":\n        print(\"score:\", score)\n    elif choice == \"3\":\n        print(\"bye!\")\n        break\n    else:\n        print(\"not a choice\")"},{"t":"explain","q":"Explain when you'd use a for loop and when you'd use a while loop. Give one example of each.","points":["for: when you know what to loop over, like the numbers 1 to 10 or each letter of a word","while: when you don't know how many passes you'll need, like asking until the user types done","a for loop stops by itself at the end","a while loop stops when its condition becomes False, or at a break"],"model":"I use a for loop when I know what to go through, like the numbers 1 to 10 with range(1, 11), or every letter in a word. It stops by itself at the end. I use a while loop when I don't know how many times it will run, like asking for numbers until the user types done. A while loop keeps going as long as its condition is True, so something inside it has to change, or I use break."}]}]},{"day":5,"title":"Lists and tuples","goal":"By the end of today you can store many values in a list or a tuple, change a list with its methods, and loop through a list to count and add things up.","lessons":[{"id":"d5-lists","title":"Lists: many values in one variable","minutes":25,"blocks":[{"t":"text","md":"So far, each variable has held one value: one name, one age, one price. But a meal has many ingredients and a class has many students. Writing `food1`, `food2`, `food3` gets messy fast.\n\nA **list** keeps many values in one variable, in the order you wrote them. You make one with square brackets `[ ]` and put commas between the values:\n\n- `fruits = [\"apple\", \"banana\", \"cherry\"]`\n- `scores = [7, 9, 10]`\n- `empty = []` (a list with nothing in it yet)\n\nEach value in a list is called an **item**. One list can even mix text, numbers and `True`/`False`."},{"t":"example","title":"Making and printing lists","code":"fruits = [\"apple\", \"banana\", \"cherry\"]\nscores = [7, 9, 10]\nmixed = [1, \"apple\", True, 3.14]\nempty = []\nprint(fruits)\nprint(scores)\nprint(mixed)\nprint(empty)\nprint(len(fruits))","output":"['apple', 'banana', 'cherry']\n[7, 9, 10]\n[1, 'apple', True, 3.14]\n[]\n3","notes":["line 1: square brackets make a list; commas separate the items","line 3: one list can mix types, just like the example on your slides","line 4: an empty list; you will fill lists like this later with append","line 5: printing a whole list shows the brackets, and the text items in single quotes (that's just how Python shows text)","line 9: len() counts the items in the list (3), not the letters"]},{"t":"text","md":"Every item has a position number called its **index**. Python starts counting at **0**, not 1:\n\n- `fruits[0]` is `\"apple\"` (the first item)\n- `fruits[1]` is `\"banana\"` (the second item)\n- `fruits[2]` is `\"cherry\"` (the third item)\n\nTo get one item, write the list's name and then the index in square brackets. A handy rule: index = position minus one. That also means the last index is always `len(fruits) - 1`: three items have the indexes 0, 1 and 2."},{"t":"example","title":"Reading items by index","code":"fruits = [\"apple\", \"banana\", \"cherry\"]\nprint(fruits[0])\nprint(fruits[2])\nlast = len(fruits) - 1\nprint(\"the last index is\", last)\nprint(fruits[last])","output":"apple\ncherry\nthe last index is 2\ncherry","notes":["line 2: index 0 is the first item, apple","line 3: index 2 is the third item, cherry","line 4: len(fruits) is 3, so the last index is 3 - 1 = 2","line 6: the index can be a variable; fruits[last] is the same as fruits[2]"]},{"t":"mc","kind":"predict","q":"What does this print?","code":"snacks = [\"chips\", \"nuts\", \"popcorn\", \"fruit\"]\nprint(snacks[2])","options":["`nuts`","`popcorn`","`fruit`","An `IndexError`"],"answer":1,"why":"Counting from 0: chips is 0, nuts is 1, popcorn is 2. `nuts` is what you get if you count from 1 by mistake."},{"t":"text","md":"Two more things about indexes.\n\n**Asking for a missing position crashes.** If you ask for an index that doesn't exist, Python stops with an **IndexError** (an error that means \"there is no item at that position\"). With three fruits, `fruits[3]` crashes, because the indexes only go 0, 1, 2.\n\n**You can change an item.** Lists are **changeable** (your slides say **mutable**). Put the list and the index on the left of `=`, and the new value on the right: `fruits[1] = \"kiwi\"` throws away what was at index 1 and puts `\"kiwi\"` there. The other items don't move."},{"t":"example","title":"Changing an item, then going too far","code":"fruits = [\"apple\", \"banana\", \"cherry\"]\nfruits[1] = \"kiwi\"\nprint(fruits)\nprint(fruits[3])","error":true,"notes":["line 2: replaces the item at index 1 (banana) with kiwi","line 3: prints ['apple', 'kiwi', 'cherry']; the list still has 3 items","line 4: crashes with IndexError: list index out of range, because 3 items only have the indexes 0, 1 and 2"]},{"t":"tip","md":"**Watch out:** the second item is `[1]`, not `[2]`. And the last item is at `len(my_list) - 1`, never at `len(my_list)`. These off-by-one mistakes are the most common list bug, and a favorite test question."},{"t":"mc","kind":"predict","q":"What does this print?","code":"drinks = [\"tea\", \"juice\", \"water\"]\ndrinks[0] = \"milk\"\nprint(drinks)","options":["`['milk', 'tea', 'juice', 'water']`","`['tea', 'milk', 'water']`","An error, because lists can't change","`['milk', 'juice', 'water']`"],"answer":3,"why":"`drinks[0] = \"milk\"` replaces the item at index 0, so tea is gone and milk takes its place. It does not squeeze milk in front (that's what `insert` does), and lists can change, so there is no error."},{"t":"mc","kind":"bug","q":"This should print the last topping. What actually happens?","code":"toppings = [\"cheese\", \"ham\", \"mushroom\"]\nprint(toppings[len(toppings)])","options":["It prints `mushroom`","An `IndexError`, because `len` is 3 but the last index is 2","It prints `3`","It prints `ham`"],"answer":1,"why":"`len(toppings)` is 3, so this asks for `toppings[3]`. The indexes are 0, 1 and 2, so index 3 doesn't exist. The fix is `toppings[len(toppings) - 1]`."},{"t":"mc","kind":"vocab","q":"What is an **index**?","options":["How many items a list has","The value stored in the first item","The position number of an item, counting from 0","The name you give a list"],"answer":2,"why":"An index is a position number, and Python counts from 0. How many items a list has is its length, which `len()` gives you."},{"t":"code","id":"d5-c-lunch","task":"Ask the user for three foods, one at a time, and store them in a list called `lunch`. Then ask which one they want: `1`, `2` or `3`. People count from 1, but Python counts from 0, so print the food at the right index.\n\nExample: typing `rice`, `beans`, `salad` and then `2` prints `beans`.","starter":"# ask for three foods and put them in a list called lunch\n\n# ask which one they want (1, 2 or 3) and turn it into a number\n\n# print the food at that place (python counts from 0!)\n","tests":[{"inputs":["rice","beans","salad","2"],"expect":["beans"],"reject":["rice","salad"]},{"inputs":["pizza","soup","cake","3"],"expect":["cake"],"reject":["pizza","soup"]},{"inputs":["eggs","toast","fruit","1"],"expect":["eggs"],"reject":["toast","fruit"]}],"require":["lunch["],"hints":["Store each answer in its own variable, then make the list from them: `lunch = [food1, food2, food3]`.","The choice comes from `input()`, so it is text. Use `int()` to turn it into a number.","If the user types 2, they mean index 1. So use `lunch[choice - 1]`."],"solution":"food1 = input(\"enter a food: \")\nfood2 = input(\"enter a food: \")\nfood3 = input(\"enter a food: \")\nlunch = [food1, food2, food3]\nchoice = int(input(\"which one do you want? (1, 2 or 3): \"))\nprint(lunch[choice - 1])"},{"t":"explain","q":"Explain to your teacher what an index is, and why `fruits[3]` crashes when the list has three fruits.","points":["An index is the position number of an item in a list","Python counts from 0, so the first item is fruits[0]","Three items have the indexes 0, 1 and 2","There is no index 3, so Python stops with an IndexError","The last item is at len(fruits) - 1"],"model":"A list keeps its items in order, and each item has a position number called an index. Python starts counting at 0, so the first fruit is fruits[0], the second is fruits[1] and the third is fruits[2]. With three fruits the indexes only go up to 2. When I ask for fruits[3], there is no item there, so Python stops with an IndexError: list index out of range. If I want the last item, I use fruits[2], or fruits[len(fruits) - 1], which works for a list of any length."}]},{"id":"d5-list-methods","title":"List methods: add, remove, sort","minutes":30,"blocks":[{"t":"text","md":"A **method** is a tool that belongs to a value. You call it with a dot after the variable's name: `fruits.append(\"kiwi\")`. Lists have methods for adding, removing, finding and ordering items.\n\nFirst, three ways to **add**:\n\n- `append(x)` adds one item to the end.\n- `extend(other_list)` adds every item of another list to the end, one by one.\n- `insert(index, x)` puts an item at that index and pushes the others one place to the right."},{"t":"example","title":"Adding items","code":"groceries = [\"milk\", \"eggs\"]\ngroceries.append(\"bread\")\nprint(groceries)\ngroceries.extend([\"apples\", \"rice\"])\nprint(groceries)\ngroceries.insert(0, \"coffee\")\nprint(groceries)","output":"['milk', 'eggs', 'bread']\n['milk', 'eggs', 'bread', 'apples', 'rice']\n['coffee', 'milk', 'eggs', 'bread', 'apples', 'rice']","notes":["line 2: append puts bread at the end","line 4: extend takes the two items out of the other list and adds them one by one","line 6: insert(0, ...) puts coffee at index 0, so everything else moves one place right","none of these lines has `groceries =` in front: the method changes the list itself"]},{"t":"text","md":"**append or extend?** This is a classic test question. `append` adds whatever you give it as **one** item, even if that thing is a whole list. `extend` opens the other list and adds its items one at a time. Watch what happens to the length:"},{"t":"example","title":"append versus extend","code":"a = [\"tea\"]\na.append([\"cake\", \"jam\"])\nprint(a)\nprint(len(a))\n\nb = [\"tea\"]\nb.extend([\"cake\", \"jam\"])\nprint(b)\nprint(len(b))","output":"['tea', ['cake', 'jam']]\n2\n['tea', 'cake', 'jam']\n3","notes":["line 2: append adds the whole list ['cake', 'jam'] as ONE item, so a now holds a list inside a list","line 4: so a has only 2 items","line 7: extend adds cake and jam as two separate items","line 9: so b has 3 items"]},{"t":"mc","kind":"what","q":"You want to add `\"date\"` and `\"fig\"` to `fruits` as two separate items, in one line. Which line does it?","options":["`fruits.append([\"date\", \"fig\"])`","`fruits.insert(\"date\", \"fig\")`","`fruits.extend([\"date\", \"fig\"])`","`fruits = [\"date\", \"fig\"]`"],"answer":2,"why":"`extend` adds each item of the other list separately. `append` would add the pair as one item (a list inside the list), and `fruits = [...]` throws the old fruits away."},{"t":"text","md":"Now **removing and finding**:\n\n- `remove(x)` deletes the first item equal to `x`. If `x` isn't in the list, you get a ValueError.\n- `pop()` removes the last item **and gives it back**, so you can keep it in a variable. `pop(0)` removes the item at index 0 instead.\n- `index(x)` gives the position of `x`.\n- `count(x)` gives how many times `x` appears.\n\nAnd **ordering**:\n\n- `sort()` puts the items in order: small to big, or A to Z.\n- `reverse()` flips the order, so the last item becomes the first."},{"t":"example","title":"Removing, finding and ordering","code":"scores = [8, 5, 10, 5, 7]\nprint(scores.count(5))\nprint(scores.index(10))\nscores.remove(5)\nprint(scores)\nlast = scores.pop()\nprint(\"popped:\", last)\nprint(scores)\nscores.sort()\nprint(scores)\nscores.reverse()\nprint(scores)","output":"2\n2\n[8, 10, 5, 7]\npopped: 7\n[8, 10, 5]\n[5, 8, 10]\n[10, 8, 5]","notes":["line 2: 5 appears twice, so count gives 2","line 3: 10 is at index 2","line 4: remove deletes only the FIRST 5; the second 5 stays","line 6: pop takes the last item (7) out and gives it back, so we can store it in last","line 9: sort orders the numbers from small to big","line 11: reverse flips the order, so now it goes big to small"]},{"t":"text","md":"**Methods that change the list give back nothing.** `append`, `extend`, `insert`, `remove`, `sort` and `reverse` change the list itself. What they give back is `None`, Python's value for \"nothing\". So never store their result:\n\n- wrong: `fruits = fruits.append(\"kiwi\")` (now `fruits` is `None` and your list is lost)\n- right: `fruits.append(\"kiwi\")` on its own line\n\n`pop`, `index` and `count` are different: they give back something useful (the removed item, a position, a number), so `last = scores.pop()` is fine."},{"t":"mc","kind":"bug","q":"What does this print?","code":"names = [\"zoe\", \"ana\", \"max\"]\nnames = names.sort()\nprint(names)","options":["`['ana', 'max', 'zoe']`","`['zoe', 'max', 'ana']`","An error, because `sort` can't be used with `=`","`None`"],"answer":3,"why":"`sort()` sorts the list and gives back `None`. Line 2 stores that `None` in `names`, so the sorted list is lost. Writing just `names.sort()` would print `['ana', 'max', 'zoe']`."},{"t":"mc","kind":"predict","q":"What does this print?","code":"line = [\"ana\", \"ben\", \"carl\"]\nline.insert(1, \"dan\")\nprint(line)","options":["`['dan', 'ana', 'ben', 'carl']`","`['ana', 'dan', 'ben', 'carl']`","`['ana', 'dan', 'carl']`","`['ana', 'ben', 'carl', 'dan']`"],"answer":1,"why":"`insert(1, \"dan\")` puts dan at index 1 and pushes ben and carl one place to the right. Nothing is replaced, so the list grows to 4 items."},{"t":"mc","kind":"predict","q":"What does this print?","code":"plates = [\"red\", \"blue\", \"green\"]\ntop = plates.pop()\nprint(top, len(plates))","options":["`green 2`","`red 2`","`green 3`","`None 2`"],"answer":0,"why":"`pop()` with no index removes the LAST item and gives it back, so `top` is green and the list now has 2 items. Unlike `append` or `sort`, `pop` gives back a real value, not `None`."},{"t":"mc","kind":"vocab","q":"What is a **method**?","options":["Another word for a variable","A comment that explains a line","A tool that belongs to a value, called with a dot, like `fruits.sort()`","Any line that uses `print`"],"answer":2,"why":"A method belongs to a value and you call it with a dot: `fruits.sort()`, `fruits.append(\"kiwi\")`. A variable is just a name for a value; it doesn't do anything by itself."},{"t":"tip","md":"**Watch out:** `remove` takes the **value** you want gone: `fruits.remove(\"kiwi\")`. `pop` takes the **index**: `fruits.pop(0)`. Mixing them up gives an error. Also, `remove` only deletes the first match, and it crashes with a ValueError if the value isn't in the list at all."},{"t":"code","id":"d5-c-cart","task":"Start with `cart = [\"bread\", \"milk\"]`. Ask the user for one item to add, and add it to the end of the cart. Then ask for one item to remove, and remove it. Finally print the cart and how many items it holds.\n\nExample: typing `eggs` and then `milk` prints `['bread', 'eggs']` and `2`.","starter":"cart = [\"bread\", \"milk\"]\n\n# ask for an item and add it to the end\n\n# ask for an item and remove it\n\n# print the cart and its length\n","tests":[{"inputs":["eggs","milk"],"expect":["['bread', 'eggs']","2"],"reject":["'milk'"]},{"inputs":["jam","bread"],"expect":["['milk', 'jam']","2"],"reject":["'bread'"]},{"inputs":["apples","apples"],"expect":["['bread', 'milk']","2"],"reject":["'apples'"]}],"require":["append","remove"],"hints":["`input()` gives you the item as text. Store it in a variable, like `new_item`.","`cart.append(new_item)` adds to the end; `cart.remove(old_item)` takes it out. Don't put `cart =` in front of either.","At the end: `print(cart)` and `print(len(cart))`."],"solution":"cart = [\"bread\", \"milk\"]\nnew_item = input(\"what do you want to add? \")\ncart.append(new_item)\nold_item = input(\"what do you want to take out? \")\ncart.remove(old_item)\nprint(cart)\nprint(len(cart))"},{"t":"explain","q":"Explain the difference between `append` and `extend`, and why `x = fruits.append(\"kiwi\")` is a mistake.","points":["append adds one item to the end, even a whole list as one single item","extend adds each item of another list, one by one","Both change the list itself","They give back None, so x would be None"],"model":"Both methods add to the end of a list, and both change the list itself. append adds exactly one item, so if I give it a list like [\"cake\", \"jam\"], that whole list becomes one item inside my list. extend opens the other list and adds each item separately, so the list grows by two. Because these methods change the list directly, they give back None. So x = fruits.append(\"kiwi\") does add kiwi to fruits, but x just holds None. I should call fruits.append(\"kiwi\") on its own line."}]},{"id":"d5-loop-lists","title":"Looping through a list","minutes":25,"blocks":[{"t":"text","md":"Lists and `for` loops go together. `for fruit in fruits:` runs the indented lines once for every item in the list. Each run is called a **pass**. On every pass, the loop variable (`fruit`) holds the next item: first the item at index 0, then index 1, and so on, until the list ends. You don't need indexes or `range()` at all.\n\nYou choose the loop variable's name. A good habit: plural for the list (`fruits`), singular for one item (`fruit`)."},{"t":"example","title":"One pass per item","code":"fruits = [\"apple\", \"banana\", \"cherry\"]\nfor fruit in fruits:\n    print(\"i like\", fruit)\nprint(\"done\")","output":"i like apple\ni like banana\ni like cherry\ndone","notes":["line 2: the loop runs 3 times, because the list has 3 items","line 3: on pass 1 fruit is apple, on pass 2 banana, on pass 3 cherry","line 4: not indented, so it runs once, after the loop has finished"]},{"t":"text","md":"**Totals and counts.** A very common pattern: make a variable **before** the loop, change it **inside** the loop, and use it **after** the loop.\n\n- A **total** starts at 0 and adds each item: `total = total + price`\n- A **counter** starts at 0 and adds 1 only when something is true: `count = count + 1`\n\nWhen the loop ends, the variable holds the answer. Then you can print it, or use it, for example to work out an average."},{"t":"example","title":"Total, count and average","code":"prices = [2.5, 4.0, 1.5, 6.0]\ntotal = 0\ncheap = 0\nfor price in prices:\n    total = total + price\n    if price < 3:\n        cheap = cheap + 1\nprint(\"total:\", total)\nprint(\"cheap items:\", cheap)\nprint(\"average:\", total / len(prices))","output":"total: 14.0\ncheap items: 2\naverage: 3.5","notes":["lines 2-3: both start at 0, BEFORE the loop","line 5: each pass adds one price to the total","lines 6-7: the counter only goes up when the price is under 3 (2.5 and 1.5)","line 10: average = total divided by how many prices there are"]},{"t":"tip","md":"**Watch out:** put `total = 0` **before** the loop. If it is inside the loop, it goes back to 0 on every pass, and at the end you only have the last item. (You may see `total += price` in other code. It means the same as `total = total + price`; in this course we write the long form.)"},{"t":"mc","kind":"bug","q":"This should add up the numbers. What does it print?","code":"numbers = [4, 6, 10]\nfor n in numbers:\n    total = 0\n    total = total + n\nprint(total)","options":["`20`","`0`","`10`","An error, because `total` is made inside the loop"],"answer":2,"why":"`total = 0` is inside the loop, so it resets on every pass. On the last pass it becomes 0 + 10, so the program prints 10. Moving `total = 0` above the `for` line gives 20."},{"t":"mc","kind":"predict","q":"What does this print?","code":"words = [\"hi\", \"hello\", \"hey\", \"yo\"]\ncount = 0\nfor w in words:\n    if len(w) > 2:\n        count = count + 1\nprint(count)","options":["`4`","`3`","`1`","`2`"],"answer":3,"why":"`len(w) > 2` is only True for `hello` (5 letters) and `hey` (3 letters). `hi` and `yo` have exactly 2 letters, and 2 is not greater than 2, so the count is 2."},{"t":"text","md":"**Is it in the list?** To check whether a value is in a list, use `in`. It gives `True` or `False`, so it fits right into an `if`: `if \"milk\" in fridge:`. Use `not in` for the opposite. The match must be exact: `\"Milk\"` with a capital M is not the same as `\"milk\"`.\n\nNotice that `in` has two jobs. In `for x in fruits:` it means \"go through each item\". In `if x in fruits:` it means \"is x inside the list?\""},{"t":"example","title":"Checking with in","code":"fridge = [\"milk\", \"eggs\", \"cheese\"]\nprint(\"eggs\" in fridge)\nprint(\"ham\" in fridge)\nfood = \"cheese\"\nif food in fridge:\n    print(\"yes, we have\", food)\nelse:\n    print(\"no\", food, \"today\")\nif \"ham\" not in fridge:\n    print(\"add ham to the shopping list\")","output":"True\nFalse\nyes, we have cheese\nadd ham to the shopping list","notes":["lines 2-3: in gives True or False","line 5: in inside an if checks the whole list for you, no loop needed","line 9: not in is True when the value is missing"]},{"t":"mc","kind":"predict","q":"What does this print?","code":"pets = [\"cat\", \"dog\"]\nprint(\"Cat\" in pets)","options":["`True`","`False`","`cat`","An error, because `Cat` is not in the list"],"answer":1,"why":"`in` needs an exact match, and capital letters count. `\"Cat\"` is not the same text as `\"cat\"`, so it prints `False`. It doesn't crash; `in` just answers False."},{"t":"mc","kind":"what","q":"In `for fruit in fruits:`, what is `fruit` on the second pass?","options":["The whole list","The number 2","The item at index 2","The item at index 1"],"answer":3,"why":"The loop starts at index 0, so the second pass gives the item at index 1. `fruit` always holds one item, never the whole list or a counter."},{"t":"code","id":"d5-c-scores","task":"Ask the user for 4 test scores (whole numbers), one at a time, and add each one to a list. Then loop through the list to find the total, and count how many scores are a pass (5 or more). Print the total and the number of passes.\n\nExample: typing `6`, `4`, `9`, `5` prints `24` and `3`.","starter":"scores = []\n\n# ask for 4 scores and append each one (a for loop with range(4) helps)\n\n# start a total and a counter at 0, then loop through scores\n\n# print the total and the number of passes\n","tests":[{"inputs":["6","4","9","5"],"expect":["24","3"]},{"inputs":["2","3","10","7"],"expect":["22","2"]},{"inputs":["7","8","9","6"],"expect":["30","4"]}],"require":["for ","append"],"hints":["First loop: `for i in range(4):`, then `score = int(input(...))` and `scores.append(score)`.","Second loop, NOT inside the first one: `for score in scores:`. Before it, set `total = 0` and `passes = 0`.","Inside the second loop: `total = total + score`, and `if score >= 5:` then `passes = passes + 1`."],"solution":"scores = []\nfor i in range(4):\n    score = int(input(\"enter a score: \"))\n    scores.append(score)\n\ntotal = 0\npasses = 0\nfor score in scores:\n    total = total + score\n    if score >= 5:\n        passes = passes + 1\n\nprint(\"total:\", total)\nprint(\"passes:\", passes)"},{"t":"code","id":"d5-c-allergy","task":"A recipe's ingredients are in a list (see the starter). Ask the user what they are allergic to. If it is in the list, print `warning`; if not, print `safe`.\n\nExample: typing `milk` prints `warning`; typing `nuts` prints `safe`.","starter":"ingredients = [\"flour\", \"milk\", \"eggs\", \"sugar\"]\n\n# ask what the user is allergic to\n\n# use in to check the list, then print warning or safe\n","tests":[{"inputs":["milk"],"expect":["warning"],"reject":["safe"]},{"inputs":["nuts"],"expect":["safe"],"reject":["warning"]},{"inputs":["eggs"],"expect":["warning"],"reject":["safe"]}],"require":["in ingredients"],"hints":["Store the answer: `food = input(\"what are you allergic to? \")`.","`food in ingredients` is True or False, so you can use it right in an `if`.","`if food in ingredients:` then `print(\"warning\")`, `else:` then `print(\"safe\")`."],"solution":"ingredients = [\"flour\", \"milk\", \"eggs\", \"sugar\"]\nfood = input(\"what are you allergic to? \")\nif food in ingredients:\n    print(\"warning\")\nelse:\n    print(\"safe\")"},{"t":"explain","q":"Walk me through how a loop adds up all the prices in a list.","points":["total starts at 0 before the loop","The for loop takes the items one by one; each run is a pass","Each pass adds the item: total = total + price","After the loop, total holds the sum and can be printed","If total = 0 were inside the loop, it would reset on every pass"],"model":"First I make a variable called total and set it to 0, before the loop. Then for price in prices: goes through the list one item at a time, and on each pass price holds the next item. Inside the loop I write total = total + price, so the total grows by one price every pass. When the loop has gone through every item, total holds the sum, and I print it after the loop. The total = 0 line must be outside the loop; otherwise it would reset on every pass and I'd only get the last price."}]},{"id":"d5-tuples","title":"Tuples: lists that can't change","minutes":20,"blocks":[{"t":"text","md":"A **tuple** is like a list that is locked: once you make it, you can't add, remove or swap items. Your slides call this **immutable** (it can't be changed; the opposite of mutable). You make a tuple with round brackets `( )`:\n\n`days = (\"mon\", \"tue\", \"wed\")`\n\nEverything that only READS works the same as on a list. Tuples keep their order and allow duplicates, and you read items by index with square brackets, so `days[0]` is `\"mon\"`. `len()`, `count()`, `index()` and `for` loops all work too."},{"t":"example","title":"Reading a tuple","code":"days = (\"mon\", \"tue\", \"wed\", \"tue\")\nprint(days[0])\nprint(len(days))\nprint(days.count(\"tue\"))\nprint(days.index(\"wed\"))\nfor day in days:\n    print(\"today is\", day)","output":"mon\n4\n2\n2\ntoday is mon\ntoday is tue\ntoday is wed\ntoday is tue","notes":["line 1: round brackets make a tuple; tue appears twice, which is allowed","line 2: read by index with SQUARE brackets, same as a list","lines 4-5: count and index only look, they don't change anything, so tuples have them","line 6: a for loop goes through a tuple just like a list"]},{"t":"text","md":"**Trying to change a tuple fails.** `days[0] = \"sun\"` stops with a **TypeError** (an error meaning \"this kind of value can't do that\"). And tuples don't have `append`, `remove` or `sort` at all, so `days.append(\"thu\")` stops with an **AttributeError** (an error meaning \"this value has no method with that name\").\n\nSo why use a tuple? Because sometimes \"can't change\" is exactly what you want."},{"t":"example","title":"A tuple can't be changed","code":"point = (3, 4)\nprint(point)\npoint[0] = 10\nprint(point)","error":true,"notes":["line 2: prints (3, 4); the round brackets show it is a tuple","line 3: crashes with TypeError: 'tuple' object does not support item assignment","line 4: never runs, because the program already stopped"]},{"t":"mc","kind":"bug","q":"What happens when this runs?","code":"week = (\"mon\", \"tue\", \"wed\")\nweek[1] = \"fri\"\nprint(week)","options":["`('mon', 'fri', 'wed')`","A `TypeError`, because a tuple's items can't be changed","`('mon', 'tue', 'wed', 'fri')`","`('fri', 'tue', 'wed')`"],"answer":1,"why":"Tuples are immutable, so assigning to `week[1]` is not allowed and Python stops with a TypeError. The same line on a list would work and print `['mon', 'fri', 'wed']`."},{"t":"text","md":"**Unpacking.** Unpacking means taking the items out of a tuple and putting each one in its own variable, all in one line:\n\n`x, y = point`\n\nThe first item goes into the first name, the second into the second, and so on. The number of names on the left must match the number of items, or you get a ValueError. It does the same as writing `x = point[0]` and `y = point[1]`, just shorter."},{"t":"example","title":"Unpacking a tuple","code":"point = (3, 4)\nx, y = point\nprint(\"x is\", x)\nprint(\"y is\", y)\n\nmeal = (\"pancakes\", \"breakfast\", 350)\nname, category, calories = meal\nprint(f\"{name} ({category}): {calories} calories\")","output":"x is 3\ny is 4\npancakes (breakfast): 350 calories","notes":["line 2: x gets 3 (the first item) and y gets 4 (the second item)","line 6: a tuple can mix text and numbers","line 7: three names for three items; with only two names Python would stop with a ValueError","line 8: an f-string puts the three variables into one sentence"]},{"t":"mc","kind":"predict","q":"What does this print?","code":"birthday = (14, 7, 2005)\nday, month, year = birthday\nprint(month)","options":["`14`","`2005`","`(14, 7, 2005)`","`7`"],"answer":3,"why":"Unpacking goes in order: day gets 14, month gets 7, year gets 2005. So `month` is 7. The whole tuple would only print if you printed `birthday`."},{"t":"mc","kind":"vocab","q":"What does **immutable** mean?","options":["It can't be changed after it is made","It has no order","It can't hold duplicates","It can only hold numbers"],"answer":0,"why":"Immutable means \"can't be changed\": tuples are immutable, lists are mutable. Having no order and no duplicates describes a set, not a tuple."},{"t":"mc","kind":"why","q":"Why might you store the days of the week in a tuple instead of a list?","options":["Only tuples can be used in a `for` loop","Lists can't hold text","The days are a fixed group that never changes, and a tuple protects them","Tuples are always sorted A to Z"],"answer":2,"why":"The seven days never change, so a tuple fits: it keeps the order and stops anyone from changing it by accident. `for` loops work on lists too, and tuples aren't sorted for you."},{"t":"tip","md":"**On the test:** know the difference by heart.\n\n- **List** `[ ]`: ordered, changeable, duplicates allowed.\n- **Tuple** `( )`: ordered, NOT changeable, duplicates allowed.\n\nChoose a tuple for values that belong together and stay fixed: a point (x, y), a date, the days of the week. Choose a list for things that grow or shrink, like a shopping cart or the meals in your tracker.\n\n**Watch out:** you make a tuple with round brackets, but you still read from it with square ones: `point[0]`, not `point(0)`."},{"t":"code","id":"d5-c-rectangle","task":"Ask the user for the width and then the height of a rectangle (whole numbers). Store the two numbers in a tuple called `size`. Then unpack `size` into `width` and `height`, and print the area (width times height).\n\nExample: typing `3` and `4` prints `12`.","starter":"# ask for the width and the height (whole numbers)\n\n# store them together in a tuple called size\n\n# unpack size into width and height, then print the area\n","tests":[{"inputs":["3","4"],"expect":["12"]},{"inputs":["5","6"],"expect":["30"]},{"inputs":["10","7"],"expect":["70"]}],"require":["= size"],"hints":["Use `int(input(...))` twice and store the answers in two variables, for example `w` and `h`.","Make the tuple with round brackets: `size = (w, h)`.","Unpack in one line: `width, height = size`, then `print(\"area:\", width * height)`."],"solution":"w = int(input(\"enter the width: \"))\nh = int(input(\"enter the height: \"))\nsize = (w, h)\nwidth, height = size\nprint(\"area:\", width * height)"},{"t":"explain","q":"Explain what a tuple is, how it is different from a list, and when you would choose one.","points":["A tuple is made with round brackets","Like a list, it is ordered and you read items by index","Unlike a list, it can't be changed (immutable): no append, remove or item assignment","Choose it for a fixed group of values that belong together, like a point (x, y)","Unpacking (x, y = point) puts each item into its own variable"],"model":"A tuple is a collection made with round brackets, like point = (3, 4). Like a list, it keeps its items in order, so I can read them by index, like point[0], and use len() or a for loop. The big difference is that a tuple is immutable: once it's made I can't add, remove or change items, so there's no append, and point[0] = 10 gives a TypeError. I choose a tuple when the values belong together and shouldn't change, like coordinates or a date. I can unpack it with x, y = point, which puts the first item in x and the second in y."}]}]},{"day":6,"title":"Sets and dictionaries","goal":"By the end of today you can remove duplicates with a set, store and look up labelled data in a dictionary, and build the list of meal records your project needs.","lessons":[{"id":"d6-sets","title":"Sets: only unique items","minutes":20,"blocks":[{"t":"text","md":"A **set** is a collection where every item can appear only **once**. If you add a duplicate, the set simply ignores it. You write a set with curly brackets: `{1, 2, 3}`.\n\nSets have two more differences from lists:\n\n- **Unordered:** the items have no fixed position, so Python may print them in a different order than you typed.\n- **Unindexed:** because there are no positions, `my_set[0]` doesn't work.\n\nSets are still changeable: you can add and remove items."},{"t":"example","title":"Duplicates disappear","code":"my_set = {1, 2, 3, 3, 4}\nprint(my_set)\nprint(len(my_set))","output":"{1, 2, 3, 4}\n4","notes":["line 1: this is the example from your slides; 3 is typed twice","line 2: the set keeps only one 3","line 3: len counts 4 items, not 5"]},{"t":"text","md":"**The big trick: removing duplicates.** `set(some_list)` makes a new set from a list, and every duplicate is dropped on the way. That's the easiest way to answer \"how many DIFFERENT things are there?\"\n\nOne thing to know: a set of words can come out in a different order each time you run the program. So don't rely on the order of a set; use `len()`, `in` or a loop instead."},{"t":"example","title":"From a list to a set","code":"votes = [\"pizza\", \"tacos\", \"pizza\", \"sushi\", \"tacos\", \"pizza\"]\noptions = set(votes)\nprint(len(votes), \"votes\")\nprint(len(options), \"different foods\")\nprint(\"tacos\" in options)\nfor food in options:\n    print(\"someone voted for\", food)","notes":["line 2: set(votes) keeps one copy of each food","line 3: the list still has all 6 votes; making a set doesn't change the list","line 4: only 3 different foods","line 5: in works on sets just like on lists","lines 6-7: a for loop goes through a set too, but the order can change each time you run it. Run it twice and compare"]},{"t":"text","md":"**Adding and checking.** `add(x)` puts one item into a set. Sets have no `append`, because there is no \"end\" to add to. If the item is already in the set, `add` does nothing. `in` works as usual: `\"tea\" in drinks` gives `True` or `False`. And `remove(x)` takes an item out."},{"t":"example","title":"add and in","code":"tags = {\"vegan\", \"quick\"}\ntags.add(\"cheap\")\ntags.add(\"quick\")\nprint(len(tags))\nprint(\"vegan\" in tags)\nprint(\"spicy\" in tags)\ntags.remove(\"cheap\")\nprint(len(tags))","output":"3\nTrue\nFalse\n2","notes":["line 2: cheap is new, so it is added","line 3: quick is already there, so nothing changes (and there is no error)","line 4: 3 items: vegan, quick and cheap","line 7: remove takes cheap out again, so 2 are left"]},{"t":"tip","md":"**Watch out:** empty curly brackets `{}` make an empty **dictionary** (next lesson), not a set. For an empty set write `set()`. Also: sets use `add`, not `append`, and you can't use an index like `tags[0]`."},{"t":"mc","kind":"predict","q":"What does this print?","code":"letters = {\"a\", \"b\", \"a\", \"c\", \"b\"}\nprint(len(letters))","options":["`5`","`2`","`3`","An error, because sets can't have duplicates"],"answer":2,"why":"Duplicates are dropped, so the set holds a, b and c: 3 items. Typing duplicates is not an error; the set just keeps one of each."},{"t":"mc","kind":"why","q":"Why does `print(guests[0])` crash when `guests` is a set?","options":["The set must be empty","Sets have no positions (they're unindexed), so there is no item 0","Sets can only be read with `get()`","Index 0 is always reserved in a set"],"answer":1,"why":"A set has no order, so its items have no index numbers, and Python stops with a TypeError. Use `in` or a loop to work with a set's items."},{"t":"mc","kind":"bug","q":"What happens when this runs?","code":"colors = {\"red\", \"blue\"}\ncolors.append(\"green\")\nprint(len(colors))","options":["An `AttributeError`: sets use `add()`, not `append()`","It prints `3`","It prints `2`, because green is ignored","It adds green at index 0"],"answer":0,"why":"Sets have no `append` method, because there is no end to add to, so Python stops with an AttributeError. `colors.add(\"green\")` would work, and the length would then be 3."},{"t":"mc","kind":"what","q":"Your meal tracker should show which categories have been used, each one only once. Which collection fits best?","options":["A list, because it keeps duplicates","A tuple, because it can't change","A single string","A set, because it keeps each category only once"],"answer":3,"why":"A set drops duplicates by itself, so three breakfasts still give one `breakfast`. A list would keep every copy, and a tuple can't grow as meals are added."},{"t":"code","id":"d6-c-repeats","task":"Ask the user for 4 snacks, one at a time, and store them in a list. Then use a set to check for repeats: if any snack was typed more than once, print `repeat`; if all four are different, print `all different`.\n\nThink about it: what happens to the length when you turn a list with repeats into a set?\n\nExample: `chips`, `nuts`, `chips`, `fruit` prints `repeat`.","starter":"snacks = []\n\n# ask for 4 snacks and append each one\n\n# make a set from the list and compare the lengths\n","tests":[{"inputs":["chips","nuts","chips","fruit"],"expect":["repeat"],"reject":["all different"]},{"inputs":["chips","nuts","fruit","cake"],"expect":["all different"],"reject":["repeat"]},{"inputs":["gum","gum","gum","gum"],"expect":["repeat"],"reject":["all different"]}],"require":["set("],"hints":["Fill the list with a loop: `for i in range(4):`, then `input()` and `snacks.append(...)`.","`set(snacks)` throws the repeats away. If there was a repeat, the set has fewer items than the list.","`if len(set(snacks)) < len(snacks):` print `repeat`, `else:` print `all different`."],"solution":"snacks = []\nfor i in range(4):\n    snack = input(\"enter a snack: \")\n    snacks.append(snack)\n\nunique_snacks = set(snacks)\nif len(unique_snacks) < len(snacks):\n    print(\"repeat\")\nelse:\n    print(\"all different\")"},{"t":"explain","q":"Explain what a set is, and how you would use one to find out how many different items a list has.","points":["A set keeps each item only once (no duplicates)","A set has no order and no indexes","set(my_list) makes a set from the list, dropping the duplicates","len() of that set gives the number of different items","add() puts in an item; in checks whether it is there"],"model":"A set is a collection where each item appears only once, written with curly brackets. It has no order, so I can't use an index like my_set[0]. If I have a list with repeats, set(my_list) makes a set from it and drops the duplicates, and the list itself stays the same. Then len() of the set tells me how many different items there are. I can put new items in with add(), and check for an item with in."}]},{"id":"d6-dicts","title":"Dictionaries: values with labels","minutes":30,"blocks":[{"t":"text","md":"A list finds things by **position**: you must remember that the title is at index 0 and the category at index 1. A **dictionary** finds things by a **label** instead. Each label is called a **key**, and each key **maps to** (points to) a **value**, like a word and its meaning in a real dictionary.\n\nYou write a dictionary with curly brackets and `key: value` pairs, separated by commas:\n\n`meal = {\"title\": \"pancakes\", \"category\": \"breakfast\", \"calories\": 350}`\n\nKeys are usually text in quotes. Values can be anything: text, numbers, even a whole list."},{"t":"example","title":"Reading by key","code":"meal = {\"title\": \"pancakes\", \"category\": \"breakfast\", \"calories\": 350}\nprint(meal)\nprint(meal[\"title\"])\nprint(meal[\"calories\"] + 50)\nprint(len(meal))","output":"{'title': 'pancakes', 'category': 'breakfast', 'calories': 350}\npancakes\n400\n3","notes":["line 1: three key: value pairs inside curly brackets","line 3: square brackets with a KEY (not an index) give that key's value","line 4: the value 350 is a number, so you can do math with it","line 5: len counts the pairs: 3"]},{"t":"text","md":"**Adding and changing.** Dictionaries are changeable, and one kind of line does both jobs:\n\n- `meal[\"minutes\"] = 20` **adds** a new pair, because the key `\"minutes\"` doesn't exist yet. It goes at the end.\n- `meal[\"calories\"] = 400` **changes** the value, because `\"calories\"` already exists.\n\nThat works because keys are **unique**: one dictionary can never have the same key twice. Values can repeat, though. The `update()` method from your slides adds or changes several pairs at once."},{"t":"example","title":"Adding and changing pairs","code":"meal = {\"title\": \"pancakes\", \"calories\": 350}\nmeal[\"calories\"] = 400\nmeal[\"minutes\"] = 20\nprint(meal)\nmeal.update({\"category\": \"breakfast\"})\nprint(meal)","output":"{'title': 'pancakes', 'calories': 400, 'minutes': 20}\n{'title': 'pancakes', 'calories': 400, 'minutes': 20, 'category': 'breakfast'}","notes":["line 2: calories already exists, so 350 is replaced by 400; the key stays in its place","line 3: minutes is new, so a new pair is added at the end","line 5: update adds (or changes) the pairs from another dictionary"]},{"t":"mc","kind":"predict","q":"What does this print?","code":"prices = {\"tea\": 2, \"cake\": 4}\nprices[\"tea\"] = 3\nprices[\"juice\"] = 5\nprint(prices)","options":["`{'tea': 2, 'cake': 4, 'juice': 5}`","`{'tea': 3, 'cake': 4, 'juice': 5}`","`{'tea': 2, 'cake': 4, 'tea': 3, 'juice': 5}`","A `KeyError`, because `juice` is not a key yet"],"answer":1,"why":"`tea` already exists, so its value changes from 2 to 3 (a key can't appear twice). `juice` is new, so it is added at the end. Storing with `=` never gives a KeyError."},{"t":"text","md":"**Missing keys.** Reading a key that doesn't exist crashes with a **KeyError** (an error meaning \"there is no such key\"). Keys must match exactly, capital letters included.\n\nTo read safely, use **`get(key, default)`**. If the key exists, you get its value. If not, you get the default you chose, and nothing crashes. Without a default, you get `None`.\n\nTwo more tools:\n\n- `\"title\" in meal` checks whether a **key** exists (True or False).\n- `meal.pop(\"calories\")` removes that pair and gives back its value."},{"t":"example","title":"Reading safely with get","code":"stock = {\"apples\": 5, \"bananas\": 0}\nprint(stock.get(\"apples\", 0))\nprint(stock.get(\"kiwis\", 0))\nprint(stock.get(\"kiwis\"))\nprint(\"kiwis\" in stock)\nsold_out = stock.pop(\"bananas\")\nprint(\"removed bananas, the count was\", sold_out)\nprint(stock)","output":"5\n0\nNone\nFalse\nremoved bananas, the count was 0\n{'apples': 5}","notes":["line 2: apples exists, so get gives its value, 5","line 3: kiwis doesn't exist, so get gives the default, 0, instead of crashing","line 4: no default given, so get gives None","line 5: in checks the keys","line 6: pop removes the bananas pair and gives back its value","writing stock[\"kiwis\"] instead would crash with KeyError: 'kiwis'"]},{"t":"tip","md":"**Watch out:** a dictionary is read by **key**, never by position. `meal[0]` doesn't give the first pair; it looks for a key called `0` and crashes with a KeyError.\n\n**On the test:** \"Can a dictionary have duplicate keys?\" No, keys are unique. \"Duplicate values?\" Yes, two keys can have the same value."},{"t":"mc","kind":"bug","q":"What happens when this runs?","code":"meal = {\"title\": \"soup\", \"category\": \"lunch\"}\nprint(meal[\"calories\"])","options":["It prints `None`","It prints `0`","It prints an empty line","A `KeyError`, because there is no `calories` key"],"answer":3,"why":"Square brackets need the key to exist. `calories` isn't there, so Python stops with `KeyError: 'calories'`. You only get `None` (or a default) when you use `meal.get(\"calories\")`."},{"t":"mc","kind":"predict","q":"What does this print?","code":"ages = {\"ana\": 19, \"luis\": 21}\nprint(ages.get(\"maria\", \"unknown\"))\nprint(ages.get(\"ana\", \"unknown\"))","options":["`None`, then `19`","A `KeyError` for maria","`unknown`, then `19`","`maria`, then `ana`"],"answer":2,"why":"`maria` is not a key, so `get` gives the default, `unknown`. `ana` is a key, so `get` gives its value, 19, and the default is ignored. `get` never raises a KeyError."},{"t":"mc","kind":"vocab","q":"In `{\"title\": \"soup\"}`, what is `\"title\"`?","options":["The key","The value","The index","The method"],"answer":0,"why":"The part before the colon is the key (the label); the part after it is the value. So `\"title\"` is the key and `\"soup\"` is its value."},{"t":"code","id":"d6-c-menu","task":"A cafe menu is stored in a dictionary (see the starter). Ask the user what they want. Use `get()` to print the price, or `not on the menu` if the item isn't a key.\n\nExample: typing `cake` prints `3.5`; typing `pizza` prints `not on the menu`.","starter":"menu = {\"coffee\": 2.5, \"tea\": 2.0, \"cake\": 3.5}\n\n# ask what the user wants\n\n# print the price, or \"not on the menu\", using get()\n","tests":[{"inputs":["cake"],"expect":["3.5"],"reject":["not on the menu"]},{"inputs":["tea"],"expect":["2.0"],"reject":["not on the menu"]},{"inputs":["pizza"],"expect":["not on the menu"]}],"require":["get("],"hints":["Store the answer: `item = input(\"what would you like? \")`.","`menu.get(item, default)` gives the price if `item` is a key, and the default if not.","One line is enough: `print(menu.get(item, \"not on the menu\"))`."],"solution":"menu = {\"coffee\": 2.5, \"tea\": 2.0, \"cake\": 3.5}\nitem = input(\"what would you like? \")\nprint(menu.get(item, \"not on the menu\"))"},{"t":"code","id":"d6-c-stock","task":"A shop keeps its stock in a dictionary: `stock = {\"apples\": 3, \"pears\": 5}`. Ask the user for a fruit and how many just arrived (a whole number). If the fruit is already a key, add the new amount to the old one. If it isn't, add it as a new key. Print the dictionary.\n\nExample: `apples` and `4` prints `{'apples': 7, 'pears': 5}`; `kiwis` and `2` adds `'kiwis': 2` at the end.","starter":"stock = {\"apples\": 3, \"pears\": 5}\n\n# ask for the fruit and the amount (a whole number)\n\n# add the amount to the fruit's old count (0 if it's new)\n\nprint(stock)\n","tests":[{"inputs":["apples","4"],"expect":["'apples': 7","'pears': 5"]},{"inputs":["kiwis","2"],"expect":["'apples': 3","'kiwis': 2"]},{"inputs":["pears","1"],"expect":["'pears': 6"]}],"require":["stock["],"hints":["The amount comes from `input()`, so wrap it in `int()`.","`stock.get(fruit, 0)` gives the old count, or 0 if the fruit is new.","`stock[fruit] = stock.get(fruit, 0) + amount` handles both cases in one line. (An `if fruit in stock:` with an `else` works too.)"],"solution":"stock = {\"apples\": 3, \"pears\": 5}\nfruit = input(\"which fruit arrived? \")\namount = int(input(\"how many? \"))\nstock[fruit] = stock.get(fruit, 0) + amount\nprint(stock)"},{"t":"explain","q":"Explain how you read, add and change values in a dictionary, and what happens when a key is missing.","points":["d[key] reads the value stored under that key","d[key] = value adds a new pair, or replaces the value if the key already exists","Keys are unique, but values can repeat","Reading a missing key with square brackets gives a KeyError","get(key, default) reads safely and gives the default instead"],"model":"A dictionary stores key: value pairs, so I find a value by its key instead of by its position. To read, I write meal[\"title\"] and get the value for that key. To add or change, I write meal[\"calories\"] = 400: if the key is new, Python adds the pair, and if it already exists, the old value is replaced, because keys are unique. If I read a key that isn't there with square brackets, the program stops with a KeyError. To avoid that, I use meal.get(\"calories\", 0), which gives the value if the key exists and 0 if it doesn't."}]},{"id":"d6-dict-loops","title":"Looping through a dictionary","minutes":25,"blocks":[{"t":"text","md":"Often you need every pair in a dictionary, not just one. Dictionaries give you three methods for that:\n\n- `keys()` gives all the keys\n- `values()` gives all the values\n- `items()` gives every pair as a tuple: `(key, value)`\n\nYou can loop over any of them with `for`. A plain `for food in calories:` (no method) goes through the **keys**."},{"t":"example","title":"keys, values and items","code":"calories = {\"apple\": 95, \"bread\": 80, \"cheese\": 110}\nprint(calories.keys())\nprint(calories.values())\nprint(calories.items())\nfor food in calories:\n    print(food)","output":"dict_keys(['apple', 'bread', 'cheese'])\ndict_values([95, 80, 110])\ndict_items([('apple', 95), ('bread', 80), ('cheese', 110)])\napple\nbread\ncheese","notes":["lines 2-4: dict_keys([...]) is just how Python shows these; you can loop over them like a list","line 4: items gives tuples: each one is a (key, value) pair","lines 5-6: looping over the dictionary itself gives only the keys"]},{"t":"text","md":"**The most useful loop: `items()` with unpacking.** Each thing that `items()` gives is a tuple `(key, value)`. Put two names after `for`, and Python unpacks each pair for you, just like `x, y = point`:\n\n`for food, cal in calories.items():`\n\nOn each pass, `food` holds a key and `cal` holds its value. Name them after what they hold, so the code reads like a sentence."},{"t":"example","title":"Looping through pairs","code":"calories = {\"apple\": 95, \"bread\": 80, \"cheese\": 110}\nfor food, cal in calories.items():\n    print(f\"{food}: {cal} calories\")","output":"apple: 95 calories\nbread: 80 calories\ncheese: 110 calories","notes":["line 2: pass 1 unpacks ('apple', 95) into food and cal, pass 2 ('bread', 80), and so on","line 3: an f-string puts the key and the value into one readable line"]},{"t":"mc","kind":"what","q":"In `for name, score in scores.items():`, what do `name` and `score` hold on each pass?","options":["`name` holds all the keys and `score` all the values","`name` holds one key and `score` holds that key's value","`name` holds the index and `score` holds the key","Both hold the whole dictionary"],"answer":1,"why":"`items()` gives one (key, value) pair per pass, and the two names unpack it. So `name` is one key and `score` is its value, one pair at a time, not all at once."},{"t":"text","md":"**Totals over values.** To add up the values, loop over `values()` and keep a running total, just like with a list. Or let `sum()` do it in one go: `sum(calories.values())`.\n\nWant only some of the pairs? Loop over `items()` and put an `if` inside. Then you can print, count or add up only the pairs that pass the check."},{"t":"example","title":"Totals and filters","code":"calories = {\"apple\": 95, \"bread\": 80, \"cheese\": 110}\ntotal = 0\nfor cal in calories.values():\n    total = total + cal\nprint(\"total:\", total)\nprint(\"using sum:\", sum(calories.values()))\nfor food, cal in calories.items():\n    if cal > 90:\n        print(food, \"has more than 90\")","output":"total: 285\nusing sum: 285\napple has more than 90\ncheese has more than 90","notes":["line 2: the total starts at 0 before the loop, as always","line 3: values() gives just the numbers","line 6: sum() adds up all the values in one step","lines 7-9: items() plus an if prints only the foods over 90 calories"]},{"t":"tip","md":"**Watch out:** `for food in calories:` gives only the **keys**. If you write `for food, cal in calories:` without `.items()`, Python tries to split each key word into two names and crashes with a ValueError. When you want both the key and the value, always add `.items()`."},{"t":"mc","kind":"predict","q":"What does this print?","code":"scores = {\"ana\": 7, \"ben\": 9, \"cy\": 4}\ncount = 0\nfor name, score in scores.items():\n    if score >= 7:\n        count = count + 1\nprint(count)","options":["`3`","`1`","`2`","`16`"],"answer":2,"why":"Only ana (7) and ben (9) are 7 or more; `>=` includes 7 itself. `16` would be the total of those two scores, but the loop adds 1 each time, not the score."},{"t":"mc","kind":"predict","q":"What does this print?","code":"pets = {\"rex\": \"dog\", \"tom\": \"cat\"}\nfor x in pets:\n    print(x)","options":["`rex` and `tom`","`dog` and `cat`","`('rex', 'dog')` and `('tom', 'cat')`","An error: you need `.items()`"],"answer":0,"why":"Looping over a dictionary itself gives its keys, so it prints rex and tom. You'd get the values with `.values()` and the pairs with `.items()`."},{"t":"mc","kind":"bug","q":"This should add up the prices. What happens?","code":"prices = {\"tea\": 2, \"cake\": 4}\ntotal = 0\nfor price in prices:\n    total = total + price\nprint(total)","options":["It prints `6`","It prints `teacake`","It prints `0`","A `TypeError`: the loop gives the keys (text), and text can't be added to a number"],"answer":3,"why":"Looping over the dictionary gives the keys, `\"tea\"` and `\"cake\"`, so the first pass tries `0 + \"tea\"`, which is a TypeError. Use `for price in prices.values():` to get the numbers."},{"t":"code","id":"d6-c-cart-total","task":"A cart is stored as a dictionary of item: price (see the starter). Ask the user for one more item and its price (a decimal number) and add it to the cart. Then use a loop with `.items()` to print every item and its price, and finally print the total.\n\nExample: typing `eggs` and `3.0` prints the three items with their prices, and the total `7.0`.","starter":"cart = {\"bread\": 2.5, \"milk\": 1.5}\n\n# ask for a new item and its price, and add it to the cart\n\n# loop through cart.items() and print each item and price\n\n# print the total\n","tests":[{"inputs":["eggs","3.0"],"expect":["bread","milk","eggs","7.0"]},{"inputs":["cheese","4.5"],"expect":["cheese","8.5"]},{"inputs":["jam","2"],"expect":["jam","6.0"]}],"require":[".items()"],"hints":["The price is a decimal number: `price = float(input(...))`. Then add the pair: `cart[item] = price`.","`for name, cost in cart.items():` then print `name` and `cost` on each pass.","For the total, set `total = 0` before the loop and add each cost inside it, or use `sum(cart.values())` after it."],"solution":"cart = {\"bread\": 2.5, \"milk\": 1.5}\nitem = input(\"enter an item: \")\nprice = float(input(\"enter its price: \"))\ncart[item] = price\n\ntotal = 0\nfor name, cost in cart.items():\n    print(name, cost)\n    total = total + cost\nprint(\"total:\", total)"},{"t":"explain","q":"Explain the difference between `keys()`, `values()` and `items()`, and how you would print every pair in a dictionary.","points":["keys() gives all the keys","values() gives all the values, handy with sum()","items() gives each pair as a (key, value) tuple","for key, value in d.items(): unpacks each pair into two variables","Looping over the dictionary itself gives only the keys"],"model":"keys() gives me all the keys of a dictionary, values() gives all the values, and items() gives every pair as a tuple of a key and its value. To print every pair, I write for food, cal in calories.items(): and on each pass Python unpacks one pair, so food is the key and cal is its value. Then I print them inside the loop. If I just loop over the dictionary itself, I only get the keys. And to add up all the values I can use sum(calories.values())."}]},{"id":"d6-list-of-dicts","title":"A list of records: your meal tracker","minutes":35,"blocks":[{"t":"text","md":"Your Module 1 project, the Healthy Meal Tracker, stores many meals. Each meal has several details: a title, a category, a list of ingredients, and instructions.\n\n- **One meal** has labelled details, so it is a **dictionary**.\n- **All the meals** together must grow when the user adds one, so they go in a **list**.\n\nSo the tracker is a **list of dictionaries**. Each dictionary is one **record**: one complete entry, like one row in a table. In this lesson you build every piece the project needs: make records, add one, show them all, find one by its title, and remove it."},{"t":"example","title":"Making records and adding one","code":"meal1 = {\"title\": \"pancakes\", \"category\": \"breakfast\",\n         \"ingredients\": [\"flour\", \"milk\", \"eggs\"], \"instructions\": \"mix and fry\"}\nmeal2 = {\"title\": \"salad\", \"category\": \"lunch\",\n         \"ingredients\": [\"lettuce\", \"tomato\"], \"instructions\": \"chop and mix\"}\nmeals = [meal1, meal2]\nprint(len(meals))\nprint(meals[0][\"title\"])\n\nnew_meal = {\"title\": \"soup\", \"category\": \"dinner\",\n            \"ingredients\": [\"carrots\", \"water\", \"salt\"], \"instructions\": \"boil for 20 minutes\"}\nmeals.append(new_meal)\nprint(len(meals))\nprint(meals[2][\"ingredients\"])\nprint(meals[2][\"ingredients\"][0])","output":"2\npancakes\n3\n['carrots', 'water', 'salt']\ncarrots","notes":["lines 1-4: each meal is a dictionary; a dictionary can be split over two lines inside its curly brackets","line 5: the list holds the two dictionaries","line 7: read it left to right: meals[0] is the first dictionary, then [\"title\"] reads its title","line 11: append adds the new dictionary to the end of the list, so now there are 3 meals","line 14: meals[2] is the soup, [\"ingredients\"] is its list, and [0] is the first ingredient"]},{"t":"mc","kind":"predict","q":"What does this print?","code":"meal1 = {\"title\": \"soup\", \"ingredients\": [\"carrots\", \"water\"]}\nmeal2 = {\"title\": \"toast\", \"ingredients\": [\"bread\", \"butter\", \"jam\"]}\nmeals = [meal1, meal2]\nprint(meals[1][\"ingredients\"][2])","options":["`butter`","`toast`","An `IndexError`","`jam`"],"answer":3,"why":"Step by step: `meals[1]` is the second meal (toast), `[\"ingredients\"]` is its list, and `[2]` is the third item in that list, jam. `butter` is at index 1."},{"t":"text","md":"**Showing every meal.** Printing the whole list shows brackets and quotes everywhere, which is hard to read. Instead, loop through the list: on each pass, `meal` is one dictionary, and you print its details one by one.\n\nThe ingredients are a list INSIDE each meal. To print them one per line you need a loop over them too. A loop inside another loop is hard to follow, so put that inner loop in a small function and call it from the main loop. That's exactly what `print_ingredients` does in your project."},{"t":"example","title":"Printing every record","code":"def print_ingredients(ingredients):\n    for ingredient in ingredients:\n        print(\"   -\", ingredient)\n\nmeal1 = {\"title\": \"pancakes\", \"category\": \"breakfast\",\n         \"ingredients\": [\"flour\", \"milk\", \"eggs\"], \"instructions\": \"mix and fry\"}\nmeal2 = {\"title\": \"salad\", \"category\": \"lunch\",\n         \"ingredients\": [\"lettuce\", \"tomato\"], \"instructions\": \"chop and mix\"}\nmeals = [meal1, meal2]\n\nfor meal in meals:\n    print(\"--------------------\")\n    print(\"title:\", meal[\"title\"])\n    print(\"category:\", meal[\"category\"])\n    print(\"ingredients:\")\n    print_ingredients(meal[\"ingredients\"])\n    print(\"instructions:\", meal[\"instructions\"])\nprint(\"--------------------\")","output":"--------------------\ntitle: pancakes\ncategory: breakfast\ningredients:\n   - flour\n   - milk\n   - eggs\ninstructions: mix and fry\n--------------------\ntitle: salad\ncategory: lunch\ningredients:\n   - lettuce\n   - tomato\ninstructions: chop and mix\n--------------------","notes":["lines 1-3: a function that prints one list of ingredients, one per line","line 11: on each pass, meal is one whole dictionary","lines 13-14: read each detail by its key","line 16: call the function with this meal's ingredient list; the inner loop lives inside the function","line 18: not indented, so the closing line prints once, after the last meal"]},{"t":"mc","kind":"why","q":"Why is each meal a dictionary, while all the meals together are a list?","options":["Lists keep meals sorted by title automatically","Each meal's details need labels, and the list can grow as the user adds meals","A dictionary can only hold one meal's title, nothing else","Dictionaries can't be stored in tuples"],"answer":1,"why":"A dictionary gives each detail a label (title, category...), so `meal[\"title\"]` is easy to read. The list holds many of those records and grows with `append`. Lists don't sort anything by themselves."},{"t":"text","md":"**Finding and removing a meal by its title.** You can't write `meals.remove(\"salad\")`, because the list holds dictionaries, not titles. So you search:\n\n- Make a **found flag**: a variable that starts as `False`.\n- Loop through the meals and compare each `meal[\"title\"]` with the title you're looking for.\n- On a match: remove **that dictionary** with `meals.remove(meal)`, set the flag to `True`, and `break`. Changing a list while a loop is still walking through it can make the loop skip items, so stop the loop right away.\n- After the loop, the flag tells you which message to print."},{"t":"example","title":"Find and remove by title","code":"meal1 = {\"title\": \"pancakes\", \"category\": \"breakfast\",\n         \"ingredients\": [\"flour\", \"milk\", \"eggs\"], \"instructions\": \"mix and fry\"}\nmeal2 = {\"title\": \"salad\", \"category\": \"lunch\",\n         \"ingredients\": [\"lettuce\", \"tomato\"], \"instructions\": \"chop and mix\"}\nmeals = [meal1, meal2]\n\ntitle = input(\"enter the title of the entry to remove: \")\nfound = False\nfor meal in meals:\n    if meal[\"title\"] == title:\n        meals.remove(meal)\n        found = True\n        break\n\nif found == True:\n    print(\"entry removed!\")\nelse:\n    print(\"sorry, no meal has that title.\")\nprint(\"meals left:\", len(meals))","inputs":["salad"],"notes":["line 8: the flag starts as False: nothing found yet","line 10: compare this meal's title with what the user typed","lines 11-13: remove this dictionary, remember that we found it, and stop the loop","line 15: after the loop, the flag decides the message (`if found:` works too)","run it again and type soup: the loop finds nothing, found stays False, and you get the sorry message"]},{"t":"mc","kind":"bug","q":"This should print `True`, because salad is in the list. What does it print, and why?","code":"meal1 = {\"title\": \"salad\"}\nmeal2 = {\"title\": \"pancakes\"}\nmeals = [meal1, meal2]\nfound = False\nfor meal in meals:\n    if meal[\"title\"] == \"salad\":\n        found = True\n    else:\n        found = False\nprint(found)","options":["`True`, because salad was found","`True` and then `False`","An error, because `found` is changed inside the loop","`False`, because the `else` sets the flag back to False on the next meal"],"answer":3,"why":"Pass 1 finds salad and sets the flag to True, but pass 2 (pancakes) runs the `else` and sets it back to False. Inside the loop a found flag should only ever be set to True: drop the `else` and `break` on a match."},{"t":"mc","kind":"bug","q":"A student tries to delete the salad in one line. What happens?","code":"meal1 = {\"title\": \"pancakes\"}\nmeal2 = {\"title\": \"salad\"}\nmeals = [meal1, meal2]\nmeals.remove(\"salad\")\nprint(len(meals))","options":["A `ValueError`: the list holds dictionaries, not the text `\"salad\"`","It removes the salad meal","It removes the `title` key from every meal","Nothing happens, and there is no error"],"answer":0,"why":"`remove` looks for an item equal to `\"salad\"`, but the items are dictionaries like `{'title': 'salad'}`, so nothing matches and Python stops with a ValueError. Find the dictionary in a loop first, then call `meals.remove(meal)`."},{"t":"mc","kind":"vocab","q":"In this lesson, what is a **record**?","options":["A saved file","The number of meals in the list","One complete entry, here one meal's dictionary","Anything you print"],"answer":2,"why":"A record is one complete entry with all its details, like one row in a table. In the meal tracker, each meal dictionary is a record, and the list holds all the records."},{"t":"tip","md":"**Project tip:** this is the heart of your meal tracker.\n\n- **add:** build a dictionary from the user's answers, then `meals.append(meal)`\n- **view:** loop over `meals` and print each detail by its key; a small function prints the ingredients\n- **remove:** loop + found flag + `meals.remove(meal)` + `break`, then a message based on the flag\n\nIf you can explain these three in your own words, you can explain your project."},{"t":"code","id":"d6-c-add-meal","task":"The starter has two meals already. Ask the user for a new meal's title and category, then ask for ingredients again and again until they type `done` (keep them in a list). Build a meal dictionary and append it to `meals`. Then loop through `meals` and print each meal's title and how many ingredients it has.\n\nExample: typing `soup`, `dinner`, `carrots`, `water`, `salt`, `leek`, `done` prints something like:\n\n- `pancakes 3`\n- `salad 2`\n- `soup 4`","starter":"meal1 = {\"title\": \"pancakes\", \"category\": \"breakfast\", \"ingredients\": [\"flour\", \"milk\", \"eggs\"]}\nmeal2 = {\"title\": \"salad\", \"category\": \"lunch\", \"ingredients\": [\"lettuce\", \"tomato\"]}\nmeals = [meal1, meal2]\n\n# ask for the title and the category\n\n# ask for ingredients until the user types done (while True + break)\n\n# build the meal dictionary and append it to meals\n\n# print each meal's title and how many ingredients it has\n","tests":[{"inputs":["soup","dinner","carrots","water","salt","leek","done"],"expect":["pancakes","salad","soup","4"]},{"inputs":["toast","breakfast","bread","done"],"expect":["toast","1"]},{"inputs":["wrap","lunch","tortilla","beans","rice","cheese","salsa","done"],"expect":["wrap","5"]}],"require":["append"],"hints":["Ingredients: start `ingredients = []`, then `while True:` ask for one; `if ingredient == \"done\":` then `break`; otherwise `ingredients.append(ingredient)`.","Build the record: `meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients}`, then `meals.append(meal)`.","Last loop: `for meal in meals:` and `print(meal[\"title\"], len(meal[\"ingredients\"]))`."],"solution":"meal1 = {\"title\": \"pancakes\", \"category\": \"breakfast\", \"ingredients\": [\"flour\", \"milk\", \"eggs\"]}\nmeal2 = {\"title\": \"salad\", \"category\": \"lunch\", \"ingredients\": [\"lettuce\", \"tomato\"]}\nmeals = [meal1, meal2]\n\ntitle = input(\"enter the title: \")\ncategory = input(\"enter the category: \")\ningredients = []\nwhile True:\n    ingredient = input(\"enter an ingredient (type done to finish): \")\n    if ingredient == \"done\":\n        break\n    ingredients.append(ingredient)\n\nmeal = {\"title\": title, \"category\": category, \"ingredients\": ingredients}\nmeals.append(meal)\n\nfor meal in meals:\n    print(meal[\"title\"], len(meal[\"ingredients\"]))"},{"t":"code","id":"d6-c-remove-meal","task":"The starter has three meals. Ask the user for a title. Use a loop and a found flag: if a meal has that title, remove it and print `removed`; if no meal matches, print `not found`. At the end, print how many meals are left.\n\nExample: typing `salad` prints `removed` and `2`; typing `pizza` prints `not found` and `3`.","starter":"meal1 = {\"title\": \"pancakes\", \"category\": \"breakfast\"}\nmeal2 = {\"title\": \"salad\", \"category\": \"lunch\"}\nmeal3 = {\"title\": \"soup\", \"category\": \"dinner\"}\nmeals = [meal1, meal2, meal3]\n\n# ask for the title\n\n# found flag + loop: on a match, remove the meal, set the flag to True, break\n\n# after the loop: print removed or not found, then how many meals are left\n","tests":[{"inputs":["salad"],"expect":["removed","2"],"reject":["not found"]},{"inputs":["pizza"],"expect":["not found","3"]},{"inputs":["soup"],"expect":["removed","2"],"reject":["not found"]}],"require":["remove(","break"],"hints":["Before the loop: `found = False`. Then `for meal in meals:`.","Inside: `if meal[\"title\"] == title:` then `meals.remove(meal)`, `found = True` and `break`.","After the loop (not inside it!): `if found == True:` print `removed`, `else:` print `not found`. Then `print(len(meals))`."],"solution":"meal1 = {\"title\": \"pancakes\", \"category\": \"breakfast\"}\nmeal2 = {\"title\": \"salad\", \"category\": \"lunch\"}\nmeal3 = {\"title\": \"soup\", \"category\": \"dinner\"}\nmeals = [meal1, meal2, meal3]\n\ntitle = input(\"enter the title: \")\nfound = False\nfor meal in meals:\n    if meal[\"title\"] == title:\n        meals.remove(meal)\n        found = True\n        break\n\nif found == True:\n    print(\"removed\")\nelse:\n    print(\"not found\")\nprint(\"meals left:\", len(meals))"},{"t":"explain","q":"Explain how your meal tracker stores the meals, and how it removes a meal by its title.","points":["Each meal is a dictionary: title, category, ingredients (a list) and instructions","All meals are kept in one list; append adds a new meal","To remove, a loop compares each meal[\"title\"] with the title the user typed","A found flag starts False and becomes True on a match; then remove(meal) and break","After the loop, the flag decides which message to print"],"model":"Each meal is a dictionary, because its details have labels: title, category, ingredients and instructions, and the ingredients are a list inside it. All the meals are stored in one list, and when the user adds a meal I build a new dictionary and append it. To remove a meal, I ask for the title and set found = False. Then I loop through the list and compare meal[\"title\"] with the title the user typed. When they match, I call meals.remove(meal), set found to True and break, so the loop stops right away. After the loop I check found: if it's True I say the entry was removed, otherwise I say no meal has that title."}]}]},{"day":7,"title":"Functions","goal":"By the end of today you can write functions that take parameters and return values, use them inside loops, and read lambda, filter, map and reduce.","lessons":[{"id":"d7-def","title":"What a function is: def, calling, parameters","minutes":25,"blocks":[{"t":"text","md":"So far your programs run from top to bottom, one line after another. When you need the same job in two places, you copy the lines. That works, but it gets messy fast: if you fix a mistake in one copy, you have to find every other copy too.\n\nA **function** is a job with a name. You write the steps once, give them a name like `greet`, and from then on you run all those steps just by using the name. Your slides put it this way: functions are reusable blocks of code that do one specific task. They break a big program into small parts, so it's easier to read and to fix.\n\nYou already use functions that come with Python: `print()`, `input()`, `len()`. Today you learn to make your own."},{"t":"text","md":"Here's the shape of a function:\n\n- `def` starts it. It's short for define.\n- then the name you choose, then brackets `()`, then a colon `:`.\n- the lines that belong to the function sit underneath, indented by 4 spaces. That indented part is called the **body**.\n\nThe colon and the indent work exactly like they do in `if` and `for`: the colon says \"a block starts here\", and the indent shows which lines are inside it. The first line that is **not** indented is outside the function again."},{"t":"example","title":"Your first function (from the slides)","code":"# define a function\ndef greet():\n    print(\"hello, python!\")\n\n# call the function\ngreet()\ngreet()","output":"hello, python!\nhello, python!","notes":["line 2: `def greet():` creates a function called greet. Nothing is printed yet.","line 3: the indented line is the body: the step greet will do.","line 6: `greet()` calls the function. Python jumps into the body and runs it.","line 7: calling it again runs the body again. Written once, used twice."]},{"t":"text","md":"This is the idea people miss most often: **defining a function does not run it.**\n\nWhen Python reads a `def` block, it only remembers the steps under that name, like writing a recipe on a card. Nothing gets cooked yet. The steps run only when you **call** the function: you write its name followed by brackets, like `greet()`.\n\nSo a program can define ten functions and print nothing at all, if it never calls them. And if you forget the brackets and write just `greet`, you haven't called it either."},{"t":"mc","kind":"predict","q":"What does this program print?","code":"def say_hi():\n    print(\"hi!\")\n\nprint(\"start\")\nprint(\"end\")","options":["start, then end","hi!, then start, then end","start, then hi!, then end","Nothing at all"],"answer":0,"why":"The `def` only stores the steps of say_hi. Nobody writes `say_hi()`, so its body never runs and Python just runs the two prints. \"hi!\" would appear only if the function were called."},{"t":"text","md":"Most jobs need some information. A function that greets someone needs to know who. You give a function information through **parameters**.\n\n- A **parameter** is a name in the brackets of the `def` line, like `name` in `def greet(name):`. Think of it as an empty box with a label.\n- An **argument** is the real value you put in the brackets when you call the function, like `\"ana\"` in `greet(\"ana\")`.\n\nWhen you call `greet(\"ana\")`, Python puts `\"ana\"` into the box called `name`, then runs the body. With two parameters, separate them with a comma. The arguments fill them in the same order: first argument into the first parameter, second into the second."},{"t":"example","title":"Parameters and arguments","code":"def greet(name):\n    print(f\"hello, {name}!\")\n\ndef order(food, drink):\n    print(f\"one {food} and one {drink}, please.\")\n\ngreet(\"ana\")\ngreet(\"luis\")\norder(\"arepa\", \"juice\")\norder(\"juice\", \"arepa\")","output":"hello, ana!\nhello, luis!\none arepa and one juice, please.\none juice and one arepa, please.","notes":["line 1: `name` is the parameter: an empty box the function will fill.","line 4: two parameters, separated by a comma.","line 7: `\"ana\"` is the argument. Python puts it into `name`, then runs line 2.","line 9: `\"arepa\"` goes into `food` and `\"juice\"` into `drink`, in that order.","line 10: swap the arguments and you get a strange order. The position decides which box each value goes into."]},{"t":"example","title":"Forgetting an argument (this one crashes on purpose)","code":"def order(food, drink):\n    print(f\"one {food} and one {drink}, please.\")\n\norder(\"arepa\")","notes":["line 1: order needs two values: food and drink.","line 4: only one argument is given, so drink has no value.","Python stops with `TypeError: order() missing 1 required positional argument: 'drink'`. Read it as: \"you forgot to give drink a value\"."],"error":true},{"t":"tip","md":"**Watch out:** the `def` line must end with a colon, and the body must be indented. Without the indent, Python stops with `IndentationError: expected an indented block`. Without the colon, you get a `SyntaxError`. These are the two most
