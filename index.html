 common mistakes on a first try, and both are quick to fix."},{"t":"mc","kind":"vocab","q":"Look at `def area(length, width):` and the call `area(4, 5)`. Which are the parameters?","options":["`4` and `5`","`length` and `width`","`area`","`def` and `:`"],"answer":1,"why":"Parameters are the names in the `def` line: length and width. The values 4 and 5 in the call are the arguments, which fill those parameters. `area` is the function's name."},{"t":"mc","kind":"why","q":"Why put steps in a function instead of copying the same lines wherever you need them?","options":["Functions make Python run the code faster","Python doesn't allow the same line twice in one file","You write the steps once, reuse them by name, and fix mistakes in one place","A function runs by itself as soon as the program starts"],"answer":2,"why":"Reuse is the point: one definition, many calls, and only one place to fix. Speed isn't the reason, and a function never runs by itself: it runs only when it's called."},{"t":"mc","kind":"bug","q":"Ana wrote this, but nothing appears on the screen. Why?","code":"def welcome(name):\n    print(f\"welcome, {name}!\")\n\nwelcome","options":["The f-string is wrong, so print shows nothing","Functions can't print, they can only return","The function must be defined after the line that uses it","`welcome` has no brackets or argument, so the function is never called"],"answer":3,"why":"Writing just the name `welcome` doesn't call the function. A call needs brackets with the argument: `welcome(\"ana\")`. Python doesn't even complain, it just does nothing, which makes this bug sneaky."},{"t":"code","id":"d7-c-welcome","task":"Write a function `welcome(name, city)` that prints a welcome message using both values. Then ask the user for their name and their city with `input()`, and call your function with the two answers.\n\nExample: if the user types `ana` and `medellin`, it prints something like `welcome ana! enjoy your stay in medellin.`","starter":"# 1. define welcome(name, city) here\n\n\n# 2. ask for the name and the city\n\n\n# 3. call welcome with the two answers\n","tests":[{"inputs":["ana","medellin"],"expect":["ana","medellin"]},{"inputs":["luis","cartagena"],"expect":["luis","cartagena"]}],"require":["def welcome("],"hints":["Start with `def welcome(name, city):` and put an indented `print` under it.","Inside the function, an f-string can use both parameters: `print(f\"welcome {name}! enjoy your stay in {city}.\")`","After the function, not indented: `name = input(\"enter your name: \")`, the same for city, then call `welcome(name, city)`."],"solution":"# a function that welcomes someone to a city\ndef welcome(name, city):\n    print(f\"welcome {name}! enjoy your stay in {city}.\")\n\n# ask the user for the two values\nname = input(\"enter your name: \")\ncity = input(\"enter your city: \")\n\n# call the function and give it the two answers\nwelcome(name, city)"},{"t":"explain","q":"What's the difference between defining a function and calling it? Use `greet` as your example.","points":["`def greet():` defines the function: it gives the steps a name and stores them","Defining alone runs nothing: the body does not run yet","Calling means writing the name with brackets, like `greet()`, and that runs the body","Each call runs the body again, so one definition can be used many times","Arguments in the call, like `greet(\"ana\")`, fill the parameters in the def line"],"model":"Defining a function is like writing a recipe: `def greet():` gives the steps a name and Python remembers them, but nothing happens yet. Calling it is like cooking the recipe: when I write `greet()` with brackets, Python jumps into the body and runs it. I can call it as many times as I want, and each call runs the steps again. If the function has a parameter, like `def greet(name):`, the value I put in the brackets when I call it, like `greet(\"ana\")`, goes into that parameter."}]},{"id":"d7-return","title":"return vs print","minutes":30,"blocks":[{"t":"text","md":"A function can do two very different things with its answer:\n\n- **print** it: show it on the screen for a person to read. After that, the program can't use it any more.\n- **return** it: hand the value back to the line that called the function. Then the program can store it in a variable, do math with it, or pass it on.\n\nThink of asking a friend to add up the bill. Printing is your friend saying the total out loud: you heard it, but you have nothing in your hand. Returning is your friend writing the total on a note and handing it to you: now you can keep it, split it, or add the tip."},{"t":"example","title":"return hands a value back (from the slides)","code":"def square(x):\n    return x * x\n\nresult = square(4)\nprint(\"square:\", result)\nprint(\"double the square:\", result * 2)\nprint(\"square of 3, plus 1:\", square(3) + 1)","output":"square: 16\ndouble the square: 32\nsquare of 3, plus 1: 10","notes":["line 2: `return` sends the value of `x * x` back to whoever called square.","line 4: `square(4)` becomes 16, and 16 is stored in `result`.","line 6: `result` is a normal number now, so you can do math with it.","line 7: you can use a call right inside a calculation: `square(3)` is replaced by 9, then 9 + 1 = 10."]},{"t":"text","md":"Here's the picture to keep in your head. When Python reaches a `return` line, two things happen at once:\n\n- the function **stops** right there, and\n- the call **turns into** the returned value.\n\nSo in `result = square(4)`, Python runs square, gets 16 back, and the line becomes `result = 16`.\n\nThat's also why `return` is usually the last line of a function. Any line after it, in the same block, never runs."},{"t":"example","title":"print vs return, side by side","code":"def add_print(a, b):\n    print(a + b)\n\ndef add_return(a, b):\n    return a + b\n\nx = add_print(2, 3)\ny = add_return(2, 3)\nprint(\"x is\", x)\nprint(\"y is\", y)","output":"5\nx is None\ny is 5","notes":["line 2: add_print shows the sum on the screen, but gives nothing back.","line 5: add_return shows nothing, but hands the sum back.","line 7: calling add_print prints 5 right away. Since it has no return, x gets `None`.","line 8: add_return prints nothing, but y gets 5.","line 9: `None` is Python's word for \"no value\". Every function without a return gives back None."]},{"t":"tip","md":"**On the test:** \"what does this print?\" questions love this trap. Ask two things: does the function **return** something, and is the result **printed**? If it only prints, storing the result gives `None`. If it only returns, nothing appears until you print the result."},{"t":"mc","kind":"predict","q":"What does this print?","code":"def double(n):\n    n * 2\n\nprint(double(5))","options":["10","None","n * 2","Nothing: it crashes"],"answer":1,"why":"The body calculates n * 2 but never returns it, so the 10 is thrown away. A function without return gives back None, and print shows None. To get 10 it needs `return n * 2`."},{"t":"mc","kind":"predict","q":"What does this print?","code":"def check_age(age):\n    return age >= 18\n    print(\"checked!\")\n\nprint(check_age(20))","options":["checked!, then True","True, then checked!","None","True"],"answer":3,"why":"`return` ends the function immediately, so the print line after it never runs. The call becomes True (20 >= 18), and that's what prints."},{"t":"text","md":"Sometimes a parameter almost always gets the same value. You can give it a **default value**: write `=value` after it in the `def` line. If the call gives an argument, Python uses it. If not, Python uses the default.\n\nThe slides show `def greet(name=\"User\"):`. Calling `greet()` uses the default, and `greet(\"Alice\")` uses Alice.\n\nOne rule: parameters with a default go **after** the ones without, like `def make_profile(name, country=\"colombia\"):`. Python fills the boxes from left to right, so the ones you always need come first."},{"t":"example","title":"Default parameter values","code":"def make_profile(name, country=\"colombia\"):\n    return f\"{name} from {country}\"\n\nprint(make_profile(\"lucas\"))\nprint(make_profile(\"sofia\", \"spain\"))\n\nprofile = make_profile(\"mateo\")\nprint(\"saved:\", profile)","output":"lucas from colombia\nsofia from spain\nsaved: mateo from colombia","notes":["line 1: `country=\"colombia\"` is a default: it's used when the call gives no second value.","line 2: the function returns a piece of text (an f-string).","line 4: only one argument, so country is \"colombia\".","line 5: two arguments, so \"spain\" replaces the default.","line 7: because it returns, the text can be stored in a variable and used later."]},{"t":"mc","kind":"what","q":"What does a function give back if it has no `return` line?","options":["0","An empty text, \"\"","`None`","The last thing it printed"],"answer":2,"why":"Without return, a function gives back `None`, Python's \"no value\". It does not give back what it printed: printing only shows text on the screen."},{"t":"mc","kind":"bug","q":"This program prints 12 and 4, then crashes. Why?","code":"def area(length, width):\n    print(length * width)\n\ntotal = area(3, 4) + area(2, 2)\nprint(total)","options":["area prints but doesn't return, so the last line tries None + None","You can't call the same function twice on one line","`length * width` needs brackets around it","12 + 4 is too big to store in total"],"answer":0,"why":"Each call prints its result but returns None. So the line becomes None + None, and Python can't add two \"no values\": TypeError. Changing `print(length * width)` to `return length * width` fixes it, and total becomes 16."},{"t":"mc","kind":"predict","q":"What does this print?","code":"def total_price(price, tip=10):\n    return price + tip\n\nprint(total_price(50))\nprint(total_price(50, 5))","options":["50, then 55","60, then 65","60, then 55","An error: tip is missing"],"answer":2,"why":"The first call gives no tip, so the default 10 is used: 50 + 10 = 60. The second call gives 5, which replaces the default: 50 + 5 = 55. No error: that's what the default is for."},{"t":"code","id":"d7-c-tip","task":"Write a function `total_with_tip(bill, tip_percent=10)` that **returns** the bill plus the tip. The tip is `bill * tip_percent / 100`.\n\nThen ask the user for the bill (it can have decimals) and print two totals: one using the default tip, and one with a 20 percent tip.\n\nExample: for a bill of `50`, it prints `55.0` and `60.0`.","starter":"# define total_with_tip(bill, tip_percent=10) here\n# it should RETURN the total, not print it\n\n\n# ask for the bill\n\n\n# print the total for the default tip, then for 20\n","tests":[{"inputs":["50"],"expect":["55.0","60.0"],"reject":["None"]},{"inputs":["80"],"expect":["88.0","96.0"],"reject":["None"]},{"inputs":["35"],"expect":["38.5","42.0"],"reject":["None"]}],"require":["def total_with_tip(","return"],"hints":["The def line is given in the task: `def total_with_tip(bill, tip_percent=10):`","Inside: `tip = bill * tip_percent / 100` and then `return bill + tip`.","Outside: `bill = float(input(\"enter the bill: \"))`, then `print(\"total:\", total_with_tip(bill))` and `print(\"total:\", total_with_tip(bill, 20))`."],"solution":"# returns the bill plus the tip\n# tip_percent is 10 unless the caller gives another number\ndef total_with_tip(bill, tip_percent=10):\n    tip = bill * tip_percent / 100\n    return bill + tip\n\n# ask for the bill as a number\nbill = float(input(\"enter the bill: \"))\n\n# use the function twice: default tip, then a 20 percent tip\nprint(\"total, 10 percent tip:\", total_with_tip(bill))\nprint(\"total, 20 percent tip:\", total_with_tip(bill, 20))"},{"t":"explain","q":"Explain the difference between `return` and `print` inside a function. What do you get if you store the result of a function that only prints?","points":["print shows a value on the screen, but the program can't use it afterwards","return hands the value back to the line that called the function","a returned value can be stored in a variable or used in math","a function with no return gives back None, so storing its result gives None","return also ends the function: lines after it don't run"],"model":"print just shows something on the screen for the person to read, and then the program can't use it. return hands the value back to the place where the function was called, so the call turns into that value and I can store it in a variable or do more math with it. For example, `result = square(4)` stores 16 because square returns x * x. If a function only prints, it gives back None, so `x = add_print(2, 3)` shows 5 on the screen but x is None. Also, return ends the function, so anything after it in the function never runs."}]},{"id":"d7-together","title":"Functions working together","minutes":30,"blocks":[{"t":"text","md":"Real programs are made of small functions that use each other. Inside a function you can use everything you already know: `if`, loops, lists, and calls to other functions.\n\nOne kind is very common: a function that **answers a yes/no question** by returning `True` or `False`. Names like `is_adult` or `is_prime` read like a question, so the code reads almost like English: `if is_adult(age):`.\n\nA function can have more than one `return`, usually one in each branch of an `if`. Only one of them runs, because the first `return` Python reaches ends the function."},{"t":"example","title":"A function with a conditional return","code":"def is_adult(age):\n    if age >= 18:\n        return True\n    else:\n        return False\n\nprint(is_adult(20))\nprint(is_adult(15))\n\nmy_age = 17\nif is_adult(my_age):\n    print(\"you can vote\")\nelse:\n    print(\"not yet!\")","output":"True\nFalse\nnot yet!","notes":["line 2: the if decides which return runs.","line 3: for 20, this return runs and the function ends here.","line 5: for 15, Python goes to the else and returns False.","line 11: because the function returns True or False, the call fits right into an if. is_adult(17) is False, so the else part runs."]},{"t":"text","md":"Now a bigger one from your Exercise 4. A **prime number** is a whole number bigger than 1 that only divides evenly by 1 and by itself: 2, 3, 5, 7, 11, 13...\n\nThe plan for `is_prime(n)`:\n\n- numbers below 2 are not prime: return False straight away.\n- try every possible divider from 2 up to n - 1 with `for i in range(2, n)`.\n- if `n % i == 0` (remainder 0), i divides n evenly: count it with `divisors = divisors + 1`.\n- after the loop: no divisors at all means prime, so return True. Otherwise return False."},{"t":"example","title":"is_prime, called from a loop (your E4)","code":"def is_prime(n):\n    if n < 2:\n        return False\n    divisors = 0\n    for i in range(2, n):\n        if n % i == 0:\n            divisors = divisors + 1\n    if divisors == 0:\n        return True\n    else:\n        return False\n\nprint(is_prime(7))\nprint(is_prime(9))\n\n# every prime from 2 up to 20\nfor num in range(2, 21):\n    if is_prime(num) == True:\n        print(num)","output":"True\nFalse\n2\n3\n5\n7\n11\n13\n17\n19","notes":["line 2-3: 0 and 1 are not prime, so the function stops here for them.","line 5: try every divider from 2 up to n - 1 (range stops before n).","line 6-7: for 9, i = 3 gives 9 % 3 == 0, so divisors becomes 1.","line 8: this if is NOT inside the loop (look at the indent). It runs once, after every divider was tried.","line 17-18: the main loop goes through 2 to 20 and asks is_prime about each number. The inner loop lives inside the function, so you never write a loop inside a loop."]},{"t":"text","md":"Why not just write one loop inside another? You could, but then two loops are tangled together, with two levels of indents, and it gets hard to follow and to explain. With a function:\n\n- `is_prime` answers **one question** about **one number**. You can test it alone: `print(is_prime(9))`.\n- the main loop just walks through the numbers and asks that question.\n\nWhen the teacher asks \"what does this part do?\", you can answer each part in one sentence. In this course, whenever you feel you need a loop inside a loop, put the inner loop in a function and call it."},{"t":"example","title":"A function that calls another function","code":"def calculate_area(length, width):\n    return length * width\n\ndef paint_cost(length, width, price_per_m2):\n    area = calculate_area(length, width)\n    return area * price_per_m2\n\nprint(calculate_area(4, 3))\nprint(paint_cost(4, 3, 2.5))","output":"12\n30.0","notes":["line 5: paint_cost calls calculate_area and stores the 12 it gets back.","line 6: then it uses that area to work out the cost: 12 * 2.5.","line 9: you only call paint_cost; it calls calculate_area for you. Small functions stack like building blocks."]},{"t":"tip","md":"**Watch out:** `range(2, n)` stops **before** n. In is_prime that's what you want, because n always divides itself. But in the main loop, `range(2, number + 1)` needs the `+ 1`, or the number the user typed would be left out."},{"t":"mc","kind":"predict","q":"What does this print?","code":"def is_even(n):\n    return n % 2 == 0\n\ncount = 0\nfor x in range(1, 7):\n    if is_even(x):\n        count = count + 1\nprint(count)","options":["6","True","3","2"],"answer":2,"why":"range(1, 7) gives 1 to 6. is_even is True for 2, 4 and 6, so count goes up 3 times. The function returns True or False each time, but the last line prints the count."},{"t":"mc","kind":"what","q":"`is_adult` has two `return` lines. How many of them run when you call `is_adult(20)`?","options":["Only `return True`: the function stops there","Both, one after the other","None: return needs a print to work","It depends on how many times you call it"],"answer":0,"why":"The first return Python reaches ends the function. For 20 the if is True, so `return True` runs and the else part is never reached."},{"t":"mc","kind":"why","q":"Why does is_prime return False right away when `n < 2`?","options":["To make the function faster for big numbers","Because `%` crashes for numbers below 2","Because range can't start at 2","1 isn't prime, but range(2, 1) is empty, so 0 divisors would wrongly give True"],"answer":3,"why":"For n = 1 the loop `range(2, 1)` has nothing in it, so divisors stays 0 and the function would say True. 0 and 1 are not prime, so the early return catches them. Speed isn't the reason."},{"t":"mc","kind":"bug","q":"This version says `is_prime(9)` is True. What's wrong?","code":"def is_prime(n):\n    divisors = 0\n    for i in range(2, n):\n        if n % i == 0:\n            divisors = divisors + 1\n        if divisors == 0:\n            return True\n        else:\n            return False\n\nprint(is_prime(9))","options":["range(2, n) should be range(1, n)","The last if/else is indented inside the loop, so it returns after checking only 2","divisors should start at 1","`%` should be `//`"],"answer":1,"why":"Because the final if/else is inside the for loop, it runs on the very first turn: 9 % 2 isn't 0, divisors is still 0, so it returns True and stops. Moving the if/else out of the loop (less indent) makes it check every divider first. range(1, n) would be wrong: every number divides by 1."},{"t":"code","id":"d7-c-adult","task":"Write a function `is_adult(age)` that **returns** `True` if the age is 18 or more and `False` otherwise. Ask the user for their age (a whole number) and print what the function returns.","starter":"# define is_adult(age) here\n\n\n# ask for the age and print is_adult(age)\n","tests":[{"inputs":["20"],"expect":["True"],"reject":["False","None"]},{"inputs":["15"],"expect":["False"],"reject":["True","None"]},{"inputs":["18"],"expect":["True"],"reject":["False","None"]}],"require":["def is_adult(","return"],"hints":["Use an if inside the function: `if age >= 18:` then `return True`.","Add `else:` and `return False`.","Outside the function: `age = int(input(\"enter your age: \"))` and `print(is_adult(age))`."],"solution":"# returns True for 18 or older, False for younger\ndef is_adult(age):\n    if age >= 18:\n        return True\n    else:\n        return False\n\n# ask for the age as a whole number and show the answer\nage = int(input(\"enter your age: \"))\nprint(is_adult(age))"},{"t":"code","id":"d7-c-sum-primes","task":"Make two functions work together.\n\n- `is_prime(n)` returns True or False, like in the example.\n- `sum_primes(limit)` uses a loop and calls is_prime to add up every prime from 2 up to and including limit, and **returns** the total.\n\nAsk the user for a number and print `sum_primes` of it. Example: for `10` the primes are 2, 3, 5 and 7, so it prints `17`.","starter":"# 1. is_prime(n): return True or False\n\n\n# 2. sum_primes(limit): add up the primes from 2 to limit and return the total\n\n\n# 3. ask for a number and print sum_primes of it\n","tests":[{"inputs":["10"],"expect":["17"],"reject":["None"]},{"inputs":["20"],"expect":["77"],"reject":["None"]},{"inputs":["30"],"expect":["129"],"reject":["None"]}],"require":["def is_prime(","def sum_primes(","return"],"hints":["Copy is_prime from the example first, and test it alone with `print(is_prime(7))`.","In sum_primes: start with `total = 0`, loop `for num in range(2, limit + 1):`, and add num to total when `is_prime(num) == True`.","After the loop (not inside it): `return total`. Then `number = int(input(\"enter a number: \"))` and `print(sum_primes(number))`."],"solution":"# returns True if n is prime, False if not\ndef is_prime(n):\n    if n < 2:\n        return False\n    divisors = 0\n    for i in range(2, n):\n        if n % i == 0:\n            divisors = divisors + 1\n    if divisors == 0:\n        return True\n    else:\n        return False\n\n# adds up every prime from 2 up to limit and returns the total\ndef sum_primes(limit):\n    total = 0\n    for num in range(2, limit + 1):\n        if is_prime(num) == True:\n            total = total + num\n    return total\n\n# ask for a number and show the sum\nnumber = int(input(\"enter a number: \"))\nprint(\"sum of the primes:\", sum_primes(number))"},{"t":"explain","q":"Why is it better to put the inner loop in a function, like `is_prime`, instead of writing a loop inside a loop?","points":["is_prime answers one question about one number and returns True or False","the main loop only walks through the numbers and calls is_prime for each one","each part is small, so it's easier to read, to test alone and to explain","it avoids two tangled loops with two levels of indentation","the same function can be reused somewhere else, like in M2"],"model":"is_prime has one job: it takes one number, tries every divider with its own loop, and returns True or False. The main loop just goes through the numbers from 2 to the user's number and asks is_prime about each one. That way I never write a loop inside another loop, so each part is short and I can explain it in one sentence. I can also test is_prime on its own, like print(is_prime(9)), and I reused the same function in M2."}]},{"id":"d7-lambda","title":"lambda, filter, map, reduce (and recursion)","minutes":30,"blocks":[{"t":"text","md":"A **lambda** is a tiny function written on one line, without `def`. The slides call it an anonymous function (a function with no name), for short, one-time jobs.\n\nThese two do exactly the same job:\n\n- `def square(x):` with `return x ** 2` underneath\n- `square_lambda = lambda x: x ** 2`\n\nRead `lambda x: x ** 2` as \"take x, give back x ** 2\". Before the colon: the parameters. After the colon: the one value it gives back. There's no `return` word, because a lambda always returns that one expression. Two parameters? `lambda a, b: a + b`."},{"t":"example","title":"def vs lambda (from the slides)","code":"# regular function\ndef square(x):\n    return x ** 2\n\n# the same job as a lambda\nsquare_lambda = lambda x: x ** 2\nadd = lambda a, b: a + b\n\nprint(square(5))\nprint(square_lambda(5))\nprint(add(3, 4))","output":"25\n25\n7","notes":["line 2-3: a normal function: def, a name, a return.","line 6: the same job in one line. The lambda is stored in a variable so we can call it.","line 7: a lambda can take two parameters, separated by a comma.","line 9-10: both print 25: the same job, written two ways."]},{"t":"text","md":"On their own, lambdas aren't that useful. They shine when you hand them to another function that needs a small rule. Your slides show three:\n\n- **filter(test, items)** keeps only the items where the test gives True. Same items, fewer of them.\n- **map(change, items)** gives every item to the function and keeps what comes back. Same number of items, each one changed.\n- **reduce(combine, items)** combines all the items into **one** value, two at a time: the result so far and the next item. It lives in a toolbox called functools, so first write `from functools import reduce`.\n\nYou already used filter in E03-A1 to add up the even numbers."},{"t":"example","title":"filter, map and reduce","code":"from functools import reduce\n\nnumbers = [1, 2, 3, 4, 5, 6]\n\n# filter: keep the even numbers\nevens = filter(lambda x: x % 2 == 0, numbers)\nprint(\"sum of evens:\", sum(evens))\n\n# map: double every number\ndoubled = map(lambda x: x * 2, numbers)\nfor n in doubled:\n    print(n)\n\n# reduce: multiply them all together\nproduct = reduce(lambda x, y: x * y, numbers)\nprint(\"product:\", product)","output":"sum of evens: 12\n2\n4\n6\n8\n10\n12\nproduct: 720","notes":["line 1: reduce must be imported first. filter and map are always available.","line 6: filter gives each number to the lambda and keeps 2, 4 and 6, where it says True.","line 7: sum() adds the kept numbers: 2 + 4 + 6 = 12.","line 10-12: map doubles every number. You loop over the result to see each one.","line 15: reduce keeps combining the result so far with the next number: 1 * 2 * 3 * 4 * 5 * 6 = 720."]},{"t":"tip","md":"**Watch out:** filter and map don't give you a list. They give an object that hands out its items one at a time, so `print(evens)` shows something like `<filter object at 0x...>`. To use the items, loop over them, wrap them in `sum()`, or do what the slides do: `print(list(evens))`. And you can only go through it **once**: a second `sum(evens)` gives 0, because it's already used up."},{"t":"mc","kind":"predict","q":"What does this print?","code":"foods = [\"apple\", \"banana\", \"kiwi\", \"avocado\"]\nresult = filter(lambda f: f.startswith(\"a\"), foods)\nprint(list(result))","options":["[True, False, False, True]","['banana', 'kiwi']","['apple', 'avocado']","['apple']"],"answer":2,"why":"filter keeps the items where the lambda says True: the foods that start with \"a\". It keeps the items themselves, not the True/False answers (map would give those)."},{"t":"mc","kind":"predict","q":"What does this print?","code":"numbers = [1, 2, 3]\nresult = map(lambda x: x + 10, numbers)\nprint(list(result))","options":["[1, 2, 3, 10]","[11, 12, 13]","36","[10, 20, 30]"],"answer":1,"why":"map gives every number to the lambda and keeps what it returns: 1 + 10, 2 + 10, 3 + 10. Same number of items, each one changed. It doesn't add a new item, and it's + 10, not * 10."},{"t":"mc","kind":"vocab","q":"Which tool turns `[3, 5, 2]` into the single number 30 (3 * 5 * 2)?","options":["filter","map","lambda on its own","reduce"],"answer":3,"why":"reduce combines all the items into one value: 3 * 5 = 15, then 15 * 2 = 30. filter only keeps some items and map changes each item, but both still give you several items back."},{"t":"text","md":"One more word from the slides: **recursion**. A recursive function is a function that **calls itself** inside its own definition to solve a problem. Each call works on a smaller piece, until it reaches a simple case where it stops.\n\nFor the test, you mainly need to know what the word means and to recognise it when you see it. You won't need to write one. Here's a countdown: `countdown(3)` prints 3, then calls `countdown(2)`, which prints 2 and calls `countdown(1)`, and so on, until n is 0."},{"t":"example","title":"Recursion: a function that calls itself","code":"def countdown(n):\n    if n == 0:\n        print(\"liftoff!\")\n    else:\n        print(n)\n        countdown(n - 1)\n\ncountdown(3)","output":"3\n2\n1\nliftoff!","notes":["line 2: the stop case. Without it, the function would call itself forever and Python would crash with a RecursionError.","line 6: the function calls itself with a smaller number. That's what makes it recursive.","line 8: one call starts the chain: countdown(3), then countdown(2), countdown(1) and countdown(0)."]},{"t":"mc","kind":"what","q":"What is recursion? (Know what it means.)","options":["A function that calls itself inside its own definition","A loop inside another loop","A function with no name, written with lambda","Running the whole program again from the start"],"answer":0,"why":"The slides define recursion as a function calling itself in its definition to solve a problem. A function with no name is a lambda, which is something else."},{"t":"code","id":"d7-c-filter-calories","task":"Here's a list of meal calories: `calories = [350, 820, 410, 150, 690, 280]`.\n\nAsk the user for a limit (a whole number). Use **filter** with a **lambda** to keep only the meals **under** the limit, then print their total with `sum()`.\n\nExample: for `400`, the meals under 400 are 350, 150 and 280, so it prints `780`.","starter":"calories = [350, 820, 410, 150, 690, 280]\n\n# ask for the limit\n\n\n# keep the meals under the limit (filter + lambda)\n\n\n# print the total\n","tests":[{"inputs":["400"],"expect":["780"]},{"inputs":["700"],"expect":["1880"]},{"inputs":["300"],"expect":["430"]}],"require":["filter(","lambda"],"hints":["Ask for the limit as a number: `limit = int(input(\"enter the calorie limit: \"))`","The lambda is the test: `lambda c: c < limit`. filter keeps the calories where it's True.","`light_meals = filter(lambda c: c < limit, calories)`, then `print(\"total:\", sum(light_meals))`"],"solution":"calories = [350, 820, 410, 150, 690, 280]\n\n# ask for the limit as a whole number\nlimit = int(input(\"enter the calorie limit: \"))\n\n# filter keeps only the calories below the limit\nlight_meals = filter(lambda c: c < limit, calories)\n\n# sum adds up the meals that were kept\nprint(\"total calories:\", sum(light_meals))"},{"t":"code","id":"d7-c-reduce","task":"Ask the user for a whole number n. Use **reduce** with a **lambda** to multiply all the numbers from 1 to n together, and print the result. (This is called n factorial.)\n\nExample: for `5` it prints `120`, because 1 * 2 * 3 * 4 * 5 = 120. Tip: `range(1, n + 1)` gives the numbers from 1 to n.","starter":"# remember: reduce has to be imported first\n\n\n# ask for n\n\n\n# multiply 1 to n together using reduce and a lambda, then print it\n","tests":[{"inputs":["5"],"expect":["120"]},{"inputs":["6"],"expect":["720"]},{"inputs":["10"],"expect":["3628800"]}],"require":["from functools import reduce","reduce(","lambda"],"hints":["The first line is `from functools import reduce`.","The lambda gets two values, the result so far and the next number: `lambda x, y: x * y`.","`result = reduce(lambda x, y: x * y, range(1, n + 1))`, then print result."],"solution":"from functools import reduce\n\n# ask for n as a whole number\nn = int(input(\"enter a number: \"))\n\n# reduce multiplies the numbers 1 to n, two at a time\nresult = reduce(lambda x, y: x * y, range(1, n + 1))\nprint(\"the result is\", result)"},{"t":"explain","q":"Explain what `filter(lambda x: x % 2 == 0, numbers)` does. How would `map` be different?","points":["`lambda x: x % 2 == 0` is a tiny function with no name that returns True for even numbers","filter gives each item to the lambda and keeps only the items where it returns True","map also gives each item to the function, but keeps whatever it returns, so every item is changed","you use the result by looping over it, with sum() or with list(), and only once","reduce is different again: it combines all the items into one value"],"model":"The lambda x: x % 2 == 0 is a small function without a name: it takes a number and returns True if the remainder after dividing by 2 is 0, so if the number is even. filter gives every number in the list to that lambda and keeps only the ones where it said True, so from 1 to 9 I'd keep 2, 4, 6 and 8. map would also give every number to the lambda, but it keeps whatever comes back, so I'd get True or False for each number instead of the numbers. To see or use the result I loop over it, use sum(), or wrap it in list(), and I can only use it once."}]}]},{"day":8,"title":"Classes and your project","goal":"By the end of today you can explain class, object, __init__ and self, and you have a working, commented Healthy Meal Tracker built from a list of dictionaries and functions.","lessons":[{"id":"d8-oop","title":"Classes and objects","minutes":30,"blocks":[{"t":"text","md":"Your last slides introduce **object-oriented programming** (OOP): a way to organise code around things.\n\n- A **class** is a blueprint: a plan that says what every thing of that kind has and what it can do. `Dog` is a class.\n- An **object** is one real thing built from that blueprint. Your neighbour's dog Buddy is an object. One class can make many objects, and each one has its own data.\n\nThe slides use desks: \"desk\" in general is the class, and the desk your laptop is on right now is an object. Another word for object is **instance**: \"my_dog is an instance of Dog\"."},{"t":"text","md":"Every object has two kinds of parts:\n\n- **attributes**: its data. Each dog has a `name` and a `breed`. The slides say attributes are just variables that belong to the object.\n- **methods**: what it can do. A dog can `bark()`. Methods are just functions that belong to the object.\n\nYou reach both with a dot: `my_dog.name` gets an attribute, and `my_dog.bark()` calls a method. That's **dot notation**, and you've been using it all along: `fruits.append(\"kiwi\")` calls the append method of a list."},{"t":"example","title":"The Dog class (from the slides)","code":"class Dog:\n    def __init__(self, name, breed):\n        self.name = name\n        self.breed = breed\n\n    def bark(self):\n        print(f\"{self.name} barks!\")\n\n# creating two objects from the dog class\nmy_dog = Dog(\"buddy\", \"golden retriever\")\nyour_dog = Dog(\"luna\", \"poodle\")\n\n# accessing attributes and calling methods\nprint(f\"my dog's name is {my_dog.name} and it's a {my_dog.breed}.\")\nmy_dog.bark()\nyour_dog.bark()","output":"my dog's name is buddy and it's a golden retriever.\nbuddy barks!\nluna barks!","notes":["line 1: `class Dog:` starts the blueprint. The class name starts with a capital letter.","line 2: `__init__` runs by itself every time a new dog is made. It gets the new dog as `self`.","line 3: `self.name = name` stores the name inside this dog. That's an attribute.","line 6: `bark` is a method: a function inside the class. It gets `self` too.","line 10: `Dog(\"buddy\", \"golden retriever\")` makes a new object. Python runs __init__ with self = the new dog, name = \"buddy\" and breed = \"golden retriever\".","line 15-16: dot notation calls bark on each dog, and each one uses its own name."]},{"t":"text","md":"Two new words need explaining:\n\n- `__init__` (two underscores on each side) is a special method that runs **automatically** the moment you create an object. Its job is to set up the attributes. You never call it by name: writing `Dog(\"buddy\", \"golden retriever\")` runs it for you.\n- `self` means **\"this object\"**: the one being made, or the one the method is working on. `self.name = name` means \"store this name inside this dog\".\n\nEvery method has `self` as its first parameter, but you don't pass it yourself. In `my_dog.bark()`, Python puts `my_dog` into `self`. The slides call self \"the link between methods and objects\"."},{"t":"tip","md":"**Watch out:** the slides say a class name must start with a capital letter: `Dog`, `Meal`. Python won't crash if you forget, but it's the rule everyone follows and your teacher expects it. Objects and variables stay lowercase: `my_dog`. Also, `__init__` has **two** underscores on each side. With only one, it's a normal method that never runs by itself."},{"t":"example","title":"A tiny Meal class","code":"class Meal:\n    def __init__(self, title, calories):\n        self.title = title\n        self.calories = calories\n\n    def describe(self):\n        print(f\"{self.title}: {self.calories} calories\")\n\n    def is_light(self):\n        return self.calories < 400\n\nbreakfast = Meal(\"oatmeal\", 350)\ndinner = Meal(\"lasagna\", 750)\n\nbreakfast.describe()\ndinner.describe()\nprint(breakfast.is_light())\nprint(dinner.is_light())","output":"oatmeal: 350 calories\nlasagna: 750 calories\nTrue\nFalse","notes":["line 2-4: every meal gets two attributes: a title and a number of calories.","line 6-7: a method that prints. Inside a method, write `self.title`, not just `title`.","line 9-10: a method can return a value, just like a function.","line 12-13: two objects from one class, each with its own data.","line 17: the method uses breakfast's own calories, 350, so it gives True."]},{"t":"text","md":"**Do you need a class for your project?** No. The Module 1 project asks for a **list of dictionaries** and **a function for each menu option**, and that's exactly what you'll build in the next lessons. A class is another way to organise the same thing, and it belongs to Module 2.\n\nFor the test, know what these words mean and be able to read the Dog example: class, object, `__init__`, `self`, attribute, method, dot notation. For the project, keep it simple."},{"t":"mc","kind":"vocab","q":"What's the difference between a class and an object?","options":["They are two names for the same thing","A class is a variable and an object is a function","An object is the blueprint, and classes are made from it","A class is the blueprint, and an object is one thing made from it"],"answer":3,"why":"The class is the plan (Dog), and each object is one real thing built from it (my_dog, your_dog). One class can make many objects, each with its own attribute values."},{"t":"mc","kind":"predict","q":"What does this print?","code":"class Dog:\n    def __init__(self, name):\n        self.name = name\n\n    def bark(self):\n        print(f\"{self.name} barks!\")\n\na = Dog(\"rex\")\nb = Dog(\"max\")\nb.bark()","options":["rex barks!","max barks!","rex barks!, then max barks!","self barks!"],"answer":1,"why":"Only b.bark() is called, and in that call self is b, whose name is \"max\". Creating a prints nothing: __init__ only stores the name."},{"t":"mc","kind":"why","q":"`bark` is written as `def bark(self):`, but you call it as `my_dog.bark()` with nothing in the brackets. Why?","options":["Python fills in self automatically with the object before the dot, my_dog","self is optional, and Python ignores it","You should really write my_dog.bark(self)","self is the class Dog, which Python already knows"],"answer":0,"why":"When you write my_dog.bark(), Python passes my_dog in as self, so inside the method self.name is my_dog's name. self is not ignored, and it's the object, not the class."},{"t":"mc","kind":"what","q":"When does `__init__` run?","options":["Automatically, every time you create an object, like Dog(\"rex\", \"pug\")","Only when you write my_dog.__init__()","Once, when Python first reads the class","Every time you print the object"],"answer":0,"why":"__init__ runs by itself each time an object is made, to set up its attributes. Reading the class only stores the blueprint, just like def does for a function."},{"t":"mc","kind":"bug","q":"This crashes with `AttributeError: 'Meal' object has no attribute 'title'`. Why?","code":"class Meal:\n    def __init__(self, title):\n        title = title\n\nm = Meal(\"soup\")\nprint(m.title)","options":["`m` needs brackets: print(m().title)","The class name should be lowercase","`title = title` doesn't store anything on the object: it needs `self.title = title`","`__init__` never runs, so it must be called by hand"],"answer":2,"why":"Without `self.`, the line just copies the parameter into itself, and the value is lost when __init__ ends. `self.title = title` is what attaches the title to this object, so m.title can find it."},{"t":"code","id":"d8-c-meal-class","task":"Make a class `Meal` that has:\n\n- `__init__(self, title, calories)` that stores both as attributes\n- a method `describe(self)` that prints the title and the calories\n- a method `is_light(self)` that **returns** True when the calories are under 400, otherwise False\n\nThen ask the user for a title and the calories (a whole number), create a Meal object from the answers, call `describe()`, and print what `is_light()` returns.","starter":"# the blueprint for a meal\nclass Meal:\n    # write __init__, describe and is_light here\n    pass\n\n\n# ask for a title and the calories, make a Meal, describe it, print is_light()\n","tests":[{"inputs":["oatmeal","350"],"expect":["oatmeal","350","True"],"reject":["False","None"]},{"inputs":["lasagna","750"],"expect":["lasagna","750","False"],"reject":["True","None"]},{"inputs":["green salad","220"],"expect":["green salad","220","True"],"reject":["False","None"]}],"require":["class Meal","def __init__(self","self.title","def describe(self","def is_light(self","return"],"hints":["Inside the class: `def __init__(self, title, calories):` then `self.title = title` and `self.calories = calories`.","describe prints with an f-string: `print(f\"{self.title}: {self.calories} calories\")`. is_light does `return self.calories < 400`.","Outside the class: ask for title and `calories = int(input(...))`, then `meal = Meal(title, calories)`, `meal.describe()` and `print(meal.is_light())`."],"solution":"# the blueprint for a meal\nclass Meal:\n    # runs when a meal is created: stores its data on self\n    def __init__(self, title, calories):\n        self.title = title\n        self.calories = calories\n\n    # prints the meal's details\n    def describe(self):\n        print(f\"{self.title}: {self.calories} calories\")\n\n    # returns True if the meal has fewer than 400 calories\n    def is_light(self):\n        return self.calories < 400\n\n# ask the user for the details\ntitle = input(\"enter the title: \")\ncalories = int(input(\"enter the calories: \"))\n\n# create the object and use its methods\nmeal = Meal(title, calories)\nmeal.describe()\nprint(\"is it light?\", meal.is_light())"},{"t":"explain","q":"Use the Dog example to explain these words: class, object, `__init__`, `self`, attribute and method.","points":["the class Dog is the blueprint; my_dog = Dog(\"buddy\", \"golden retriever\") is an object made from it","__init__ runs automatically when an object is created and sets up its attributes","self means \"this object\": the one being created or used","attributes like self.name are the object's data; methods like bark() are functions inside the class","dot notation reaches both: my_dog.name, my_dog.bark()"],"model":"Dog is a class, which is a blueprint for dogs. When I write my_dog = Dog(\"buddy\", \"golden retriever\"), I create an object: one real dog made from that blueprint. Creating it makes __init__ run by itself, and it stores the name and breed on the object with self.name = name and self.breed = breed. self means \"this object\", so each dog keeps its own name. name and breed are attributes, the dog's data, and bark is a method, a function that belongs to the class. I use dot notation to reach them, like my_dog.name or my_dog.bark()."}]},{"id":"d8-project-plan","title":"Your project: from brief to plan","minutes":25,"blocks":[{"t":"text","md":"Before you write a line of code, turn the brief into a plan. The project is a **Healthy Meal Tracker**: a program in the terminal where the user can add meals, look at them, and remove them.\n\nHere's what the brief asks for, in plain words:\n\n- show a menu again and again until the user picks quit (requirements 1 and 6)\n- keep all meals in **one list**; each meal is a **dictionary** with a title, a category, a list of ingredients and the instructions (req. 2)\n- add: ask for those four things, build the dictionary, add it to the list (req. 3)\n- view: print every meal with all its details, easy to read (req. 4)\n- remove: ask for a title and remove that meal, or show a friendly message if it isn't there (req. 5)\n- comments that explain what each part does (req. 7)"},{"t":"text","md":"**Part 1 of the plan: the data.** One meal is one dictionary. All the meals live in one list, which is empty when the program starts: `meals = []`.\n\nEach meal dictionary has four keys: `\"title\"`, `\"category\"`, `\"ingredients\"` and `\"instructions\"`. The ingredients are a **list inside the dictionary**, because one meal has many ingredients.\n\nTwo small things in the brief: its example uses the key \"preparation\", while the requirements say instructions. Pick one and use it everywhere. And the category list says \"desert\"; it means dessert, the sweet kind."},{"t":"example","title":"One meal, one list","code":"# the list that will hold every meal\nmeals = []\n\n# one meal is one dictionary\nmeal = {\n    \"title\": \"healthy breakfast smoothie\",\n    \"category\": \"breakfast\",\n    \"ingredients\": [\"banana\", \"oats\", \"almond milk\", \"chia seeds\"],\n    \"instructions\": \"blend everything until smooth.\"\n}\nmeals.append(meal)\n\nprint(len(meals))\nprint(meals[0][\"title\"])\nprint(meals[0][\"ingredients\"][1])","output":"1\nhealthy breakfast smoothie\noats","notes":["line 2: one list for all the meals. It starts empty.","line 5-10: one meal as a dictionary, with the four keys the brief asks for.","line 8: the ingredients are a list inside the dictionary.","line 11: append adds the dictionary to the end of the list.","line 14: `meals[0]` is the first meal (a dictionary), and `[\"title\"]` takes its title.","line 15: read it left to right: the first meal, then its ingredients list, then item 1 of that list: \"oats\"."]},{"t":"text","md":"**Part 2: the shape of the program.** The brief's hint says it directly: dictionaries for the meals, a list for all of them, **a function for each menu option**, and a loop that shows the menu until the user quits. So the plan is:\n\n- `add_entry()`, `view_entries()` and `remove_entry()`: one function per menu option\n- `print_ingredients(ingredients)`: a small helper, so view_entries doesn't need a loop inside a loop\n- at the bottom, a `while True:` loop: print the menu, ask for a choice, and call the matching function. On 4, say goodbye and `break`.\n\nFunctions go at the top and the menu loop at the bottom, because Python has to read a `def` before a line can call it."},{"t":"example","title":"The menu loop, with placeholders","code":"# placeholders: the real functions come in the next lesson\ndef add_entry():\n    print(\"(add will go here)\")\n\ndef view_entries():\n    print(\"(view will go here)\")\n\n# show the menu again and again until the user quits\nwhile True:\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1/2/3/4): \")\n    if choice == \"1\":\n        add_entry()\n    elif choice == \"2\":\n        view_entries()\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"that is not a choice, please try again.\")","inputs":["1","2","9","4"],"notes":["line 2-6: placeholder functions, so you can test the menu before the real work is written.","line 9: `while True:` repeats forever, until a break.","line 14: input gives text, so the choices are compared to \"1\", \"2\"... in quotes.","line 21: `break` is the only way out of the loop. It ends the program when the user picks 4.","line 22-23: anything else (like 9 in this run) gets a friendly message, and the menu shows again. Option 3 isn't hooked up yet, so it lands here too."]},{"t":"tip","md":"**Watch out:** `input()` always gives text. So `choice == 1` is **never** True: `\"1\"` (text) is not `1` (a number). Compare with `\"1\"` in quotes. You could convert with `int()` instead, but then a user who types a letter crashes the program, so comparing text is simpler and safer."},{"t":"tip","md":"**For requirement 7:** put a comment above every function and every important part, in your own words: what it does and why. Good: `# ask for each ingredient and add it to the list`. Not useful: `# loop`. Your comments are also your notes for the 1-on-1: when the teacher points at a part, the comment reminds you what to say."},{"t":"mc","kind":"why","q":"Why is each meal a dictionary, instead of a list like `[\"oatmeal\", \"breakfast\", ...]`?","options":["Keys let you get each part by name, like meal[\"title\"], not by remembering positions","Lists can't hold text","Dictionaries print faster","The brief says lists are not allowed"],"answer":0,"why":"With a dictionary you write meal[\"category\"] and it's clear what you get. With a list you'd have to remember that the category is item 1. The brief does use a list too: one list that holds all the dictionaries."},{"t":"mc","kind":"predict","q":"What does this print?","code":"meals = [\n    {\"title\": \"oatmeal\", \"category\": \"breakfast\", \"ingredients\": [\"oats\", \"milk\"], \"instructions\": \"cook it\"},\n    {\"title\": \"salad\", \"category\": \"lunch\", \"ingredients\": [\"lettuce\", \"tomato\"], \"instructions\": \"mix it\"}\n]\nprint(meals[1][\"ingredients\"][0])","options":["oats","salad","tomato","lettuce"],"answer":3,"why":"meals[1] is the second meal (counting starts at 0), the salad. Its \"ingredients\" list is [\"lettuce\", \"tomato\"], and item 0 of that list is \"lettuce\"."},{"t":"mc","kind":"what","q":"In the menu loop, what does `break` do when the user picks 4?","options":["It restarts the menu from the top","It deletes all the meals","It leaves the while True loop, so the program ends","It only skips the rest of this if, and the loop continues"],"answer":2,"why":"break jumps out of the loop it's in. Since the menu loop is the last part of the program, leaving it ends the program. Jumping to the next turn of the loop would be continue."},{"t":"code","id":"d8-c-one-meal","task":"Practise the data part before the real program. Ask the user for a title, a category and two ingredients. Build a meal dictionary with the keys `title`, `category` and `ingredients` (a list of the two ingredients). Add it to a list called `meals`, then print the title of `meals[0]` and its **second** ingredient, read from the list.","starter":"meals = []\n\n# ask for the title, the category and two ingredients\n\n\n# build the meal dictionary (ingredients is a list)\n\n\n# add it to meals, then print the title and the second ingredient of meals[0]\n","tests":[{"inputs":["oatmeal","breakfast","oats","milk"],"expect":["oatmeal","milk"]},{"inputs":["salad","lunch","lettuce","tomato"],"expect":["salad","tomato"]}],"require":["meals[0]","append("],"hints":["Four inputs: `title = input(\"enter the title: \")`, and the same for category, ingredient1 and ingredient2.","`meal = {\"title\": title, \"category\": category, \"ingredients\": [ingredient1, ingredient2]}`, then `meals.append(meal)`.","`print(meals[0][\"title\"])` and `print(meals[0][\"ingredients\"][1])`: index 1 is the second item."],"solution":"# the list for all meals\nmeals = []\n\n# ask for the parts of one meal\ntitle = input(\"enter the title: \")\ncategory = input(\"enter the category: \")\ningredient1 = input(\"enter the first ingredient: \")\ningredient2 = input(\"enter the second ingredient: \")\n\n# build the dictionary; the ingredients are a list inside it\nmeal = {\"title\": title, \"category\": category, \"ingredients\": [ingredient1, ingredient2]}\nmeals.append(meal)\n\n# read the values back out of the list\nprint(\"title:\", meals[0][\"title\"])\nprint(\"second ingredient:\", meals[0][\"ingredients\"][1])"},{"t":"explain","q":"Before coding, describe your plan for the meal tracker: what data does it keep, and which parts will it have?","points":["a list called meals holds every entry","each entry is a dictionary with title, category, ingredients (a list) and instructions","one function per menu option: add_entry, view_entries, remove_entry","a while True loop shows the menu until the user picks quit, then break","comments explain each part (requirement 7)"],"model":"All the meals are kept in one list called meals, which starts empty. Each meal is a dictionary with four keys: title, category, ingredients and instructions, and the ingredients are a list inside the dictionary. I'll write one function for each menu option, add_entry, view_entries and remove_entry, plus a small helper to print the ingredients. At the bottom, a while True loop shows the menu, reads the choice and calls the right function; when the user picks 4 it prints goodbye and breaks out of the loop. I'll comment every part so I can explain it."}]},{"id":"d8-project-build","title":"Build the tracker, step by step","minutes":60,"blocks":[{"t":"text","md":"Now you build it, one piece at a time. After each step the program runs and gets checked, so you always have something that works. Please don't skip ahead: a small program that works is much easier to grow than a big one that doesn't.\n\n- step 1: the menu loop\n- step 2: add_entry\n- step 3: view_entries, with a helper for the ingredients\n- step 4: remove_entry\n- step 5: everything together in one file\n\n**Step 1** is the loop you saw in the plan. For now, options 1 to 3 just print a placeholder, like `add: coming soon`. The goal is a menu that keeps coming back until the user types 4."},{"t":"code","id":"d8-c-menu","task":"**Step 1: the menu loop.**\n\n- Show the 4 options: add a new entry, view all entries, remove an entry, quit.\n- Ask for the choice.\n- For 1, 2 and 3, print a short placeholder, like `add: coming soon`.\n- For 4, print `goodbye` and end the loop with `break`.\n- For anything else, print a friendly message, and the menu shows again.\n\nUse `while True:`.","starter":"# show the menu again and again until the user chooses 4\n","tests":[{"inputs":["1","2","3","4"],"expect":["goodbye"]},{"inputs":["7","4"],"expect":["goodbye"]},{"inputs":["2","2","2","4"],"expect":["goodbye"]}],"require":["while True","break"],"hints":["Start with `while True:` and put the four menu prints inside it (indented).","Still inside the loop: `choice = input(\"enter your choice (1/2/3/4): \")`, then `if choice == \"1\":`, and an `elif` for each other option.","The quit branch: `elif choice == \"4\":`, then `print(\"goodbye!\")` and `break`. Finish with `else:` and a friendly message."],"solution":"# show the menu again and again until the user chooses 4\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1/2/3/4): \")\n\n    # each option will call a function later; for now, placeholders\n    if choice == \"1\":\n        print(\"add: coming soon\")\n    elif choice == \"2\":\n        print(\"view: coming soon\")\n    elif choice == \"3\":\n        print(\"remove: coming soon\")\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"that is not a choice, please try again.\")"},{"t":"text","md":"**Step 2: add_entry.** This function asks for the four parts of a meal and saves them.\n\nThe tricky part is the ingredients, because a meal can have any number of them. Your project's way: a `while True` loop that keeps asking for one ingredient at a time, and stops with `break` when the user types `done`. Every other answer is appended to a list.\n\nThen build the dictionary from your variables and `append` it to `meals`. The function can use `meals` because the list was made at the top of the file, outside all functions, and `append` changes that same list."},{"t":"example","title":"Asking for a number of ingredients","code":"ingredients = []\nwhile True:\n    ingredient = input(\"enter an ingredient (type done to finish): \")\n    if ingredient == \"done\":\n        break\n    ingredients.append(ingredient)\nprint(ingredients)","inputs":["banana","oats","almond milk","done"],"notes":["line 1: an empty list to collect the answers.","line 2: `while True` keeps asking, because we don't know how many ingredients there will be.","line 4-5: when the user types done, `break` ends the loop. done itself is never added.","line 6: every other answer is added to the end of the list.","line 7: after the loop, the list holds every ingredient that was typed."]},{"t":"tip","md":"**Watch out:** make `meals = []` only **once**, at the top of the file. If you write it inside add_entry, every call makes a brand-new empty list, and the meals you added before are lost."},{"t":"code","id":"d8-c-add","task":"**Step 2: add_entry.** Write `add_entry()`. It asks for the title and the category, then asks for ingredients one at a time until the user types `done`, then asks for the instructions. It builds a dictionary with the keys `title`, `category`, `ingredients` (a list) and `instructions`, appends it to `meals`, and prints a short confirmation.\n\nThe starter calls your function once and then prints the list, so you can see your dictionary inside it.","starter":"# the list that holds every meal (each meal is a dictionary)\nmeals = []\n\n# write add_entry() here\n\n\n# test it: add one meal, then show the list\nadd_entry()\nprint(meals)\n","tests":[{"inputs":["oatmeal","breakfast","oats","milk","done","cook it"],"expect":["oatmeal","['oats', 'milk']","cook it"],"reject":["'done'"]},{"inputs":["green smoothie","snack","banana","spinach","almond milk","done","blend everything"],"expect":["green smoothie","['banana', 'spinach', 'almond milk']","blend everything"],"reject":["'done'"]},{"inputs":["toast","breakfast","bread","done","toast it"],"expect":["'title': 'toast'","['bread']","toast it"],"reject":["'done'"]}],"require":["def add_entry",".append("],"hints":["Inside the function: `title = input(\"enter the title: \")` and the same for category. Then `ingredients = []`.","Collect the ingredients like in the example: `while True:`, ask for one ingredient, `if ingredient == \"done\":` then `break`, otherwise `ingredients.append(ingredient)`. After the loop, ask for the instructions.","`meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}`, then `meals.append(meal)` and `print(\"entry added!\")`."],"solution":"# the list that holds every meal (each meal is a dictionary)\nmeals = []\n\n# asks for the details of a new meal and adds it to the list\ndef add_entry():\n    title = input(\"enter the title: \")\n    category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")\n\n    # keep asking for ingredients until the user types done\n    ingredients = []\n    while True:\n        ingredient = input(\"enter an ingredient (type done to finish): \")\n        if ingredient == \"done\":\n            break\n        ingredients.append(ingredient)\n\n    instructions = input(\"enter the instructions: \")\n\n    # put everything in one dictionary and add it to the list\n    meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}\n    meals.append(meal)\n    print(\"entry added!\")\n\n# test it: add one meal, then show the list\nadd_entry()\nprint(meals)"},{"t":"text","md":"**Step 3: view_entries.** There are two situations:\n\n- the list is empty: say so with a message like `no entries yet`, so the user doesn't just see nothing. Check with `if len(meals) == 0:`.\n- otherwise: loop over the meals and print each part on its own line, with a separator like `----------` between meals, so it's easy to read (req. 4).\n\nEach meal has a list of ingredients, and printing a list nicely needs a loop. A loop inside the meals loop would be a loop inside a loop. Instead, write a helper `print_ingredients(ingredients)` that loops over one list, and call it from view_entries."},{"t":"example","title":"The ingredients helper","code":"# prints each ingredient on its own line\ndef print_ingredients(ingredients):\n    for ingredient in ingredients:\n        print(\"   -\", ingredient)\n\nprint_ingredients([\"banana\", \"oats\", \"almond milk\"])\nprint_ingredients([\"eggs\"])","output":"   - banana\n   - oats\n   - almond milk\n   - eggs","notes":["line 2: the helper takes one list of ingredients as its parameter.","line 3-4: it prints each one with a dash in front, so it looks like a list.","line 6-7: it works for any list, long or short. view_entries will call it once for each meal."]},{"t":"code","id":"d8-c-view","task":"**Step 3: view_entries.** Write `print_ingredients(ingredients)` and `view_entries()`.\n\n- If `meals` is empty, view_entries prints `no entries yet`.\n- Otherwise it prints every meal: title, category, each ingredient (by calling print_ingredients) and instructions, with a separator line between meals.\n\nThe starter already has the list and a working add_entry. Its test views the empty list, adds one meal, then views again.","starter":"meals = []\n\n# asks for the details of a new meal and adds it to the list\ndef add_entry():\n    title = input(\"enter the title: \")\n    category = input(\"enter the category: \")\n    ingredients = []\n    while True:\n        ingredient = input(\"enter an ingredient (type done to finish): \")\n        if ingredient == \"done\":\n            break\n        ingredients.append(ingredient)\n    instructions = input(\"enter the instructions: \")\n    meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}\n    meals.append(meal)\n    print(\"entry added!\")\n\n# write print_ingredients(ingredients) here\n\n\n# write view_entries() here\n\n\n# test: view the empty list, add a meal, view again\nview_entries()\nadd_entry()\nview_entries()\n","tests":[{"inputs":["oatmeal","breakfast","oats","milk","done","cook it"],"expect":["no entries yet","oatmeal","breakfast","oats","milk","cook it"]},{"inputs":["lentil soup","dinner","lentils","carrot","onion","done","simmer for 30 minutes"],"expect":["no entries yet","lentil soup","dinner","lentils","carrot","onion","simmer for 30 minutes"]}],"require":["def print_ingredients(","def view_entries("],"hints":["Start view_entries with `if len(meals) == 0:` and print `no entries yet`. Put the rest under `else:`.","In the else: `for meal in meals:`, then print `meal[\"title\"]`, `meal[\"category\"]` and `meal[\"instructions\"]`, each on its own line.","For the ingredients, don't write a second loop: call `print_ingredients(meal[\"ingredients\"])`. Print a line like `print(\"----------\")` between meals."],"solution":"meals = []\n\n# asks for the details of a new meal and adds it to the list\ndef add_entry():\n    title = input(\"enter the title: \")\n    category = input(\"enter the category: \")\n    ingredients = []\n    while True:\n        ingredient = input(\"enter an ingredient (type done to finish): \")\n        if ingredient == \"done\":\n            break\n        ingredients.append(ingredient)\n    instructions = input(\"enter the instructions: \")\n    meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}\n    meals.append(meal)\n    print(\"entry added!\")\n\n# prints each ingredient of one meal on its own line\ndef print_ingredients(ingredients):\n    for ingredient in ingredients:\n        print(\"   -\", ingredient)\n\n# shows every meal and all its details\ndef view_entries():\n    # friendly message when there is nothing to show\n    if len(meals) == 0:\n        print(\"no entries yet.\")\n    else:\n        for meal in meals:\n            print(\"----------\")\n            print(\"title:\", meal[\"title\"])\n            print(\"category:\", meal[\"category\"])\n            print(\"ingredients:\")\n            # the helper prints the ingredients, so there is no loop inside a loop\n            print_ingredients(meal[\"ingredients\"])\n            print(\"instructions:\", meal[\"instructions\"])\n        print(\"----------\")\n\n# test: view the empty list, add a meal, view again\nview_entries()\nadd_entry()\nview_entries()"},{"t":"text","md":"**Step 4: remove_entry.** Ask for a title, then look through the list for a meal with that title. Use a **found flag**: a variable that starts as `False` and becomes `True` when you find the meal.\n\n- when a meal's title matches: remove it with `meals.remove(meal)`, set `found = True`, and `break`. Stop looking: the list just changed.\n- after the loop, check the flag: if it's still False, print a friendly message, like `sorry, no entry with that title was found.`\n\nWhy the flag? Inside the loop you only see **one** meal at a time. Only after checking all of them do you know the title isn't there."},{"t":"mc","kind":"bug","q":"This remove loop has a bug. What does it print when the title is salad?","code":"meals = []\nmeals.append({\"title\": \"oatmeal\"})\nmeals.append({\"title\": \"salad\"})\nmeals.append({\"title\": \"soup\"})\n\ntitle = \"salad\"\nfor meal in meals:\n    if meal[\"title\"] == title:\n        print(\"removed\")\n    else:\n        print(\"not found\")","options":["Only removed","not found, removed, not found","not found, three times","removed, three times"],"answer":1,"why":"The else runs for every meal that doesn't match, so the user sees not found twice even though salad was there. That's why you use a found flag and print not found only after the loop, once every meal was checked."},{"t":"code","id":"d8-c-remove","task":"**Step 4: remove_entry.** Write `remove_entry()`. It asks for a title. If a meal in `meals` has that title, remove it and print a message with the word `removed`. If no meal has that title, print a friendly message with the word `found`, like `sorry, no entry with that title was found.` Use a found flag.\n\nThe starter has two meals ready, and after your function runs it prints how many meals are left.","starter":"meals = [\n    {\"title\": \"oatmeal\", \"category\": \"breakfast\", \"ingredients\": [\"oats\", \"milk\"], \"instructions\": \"cook it\"},\n    {\"title\": \"green salad\", \"category\": \"lunch\", \"ingredients\": [\"lettuce\", \"cucumber\"], \"instructions\": \"mix it\"}\n]\n\n# write remove_entry() here\n\n\n# test it\nremove_entry()\nprint(\"meals left:\", len(meals))\n","tests":[{"inputs":["oatmeal"],"expect":["removed","left: 1"],"reject":["not found","was found","sorry"]},{"inputs":["pizza"],"expect":["found","left: 2"],"reject":["removed"]},{"inputs":["green salad"],"expect":["removed","left: 1"],"reject":["not found","was found","sorry"]}],"require":["def remove_entry","found",".remove("],"hints":["Start: `title = input(\"enter the title to remove: \")` and `found = False`.","Loop: `for meal in meals:` and `if meal[\"title\"] == title:`, then `meals.remove(meal)`, `found = True` and `break`.","After the loop (not indented under the for): `if found == True:` print `entry removed!`, `else:` print `sorry, no entry with that title was found.`"],"solution":"meals = [\n    {\"title\": \"oatmeal\", \"category\": \"breakfast\", \"ingredients\": [\"oats\", \"milk\"], \"instructions\": \"cook it\"},\n    {\"title\": \"green salad\", \"category\": \"lunch\", \"ingredients\": [\"lettuce\", \"cucumber\"], \"instructions\": \"mix it\"}\n]\n\n# removes a meal by its title\ndef remove_entry():\n    title = input(\"enter the title of the entry to remove: \")\n\n    # found becomes True if we find the meal\n    found = False\n    for meal in meals:\n        if meal[\"title\"] == title:\n            meals.remove(meal)\n            found = True\n            break\n\n    # after checking every meal, tell the user what happened\n    if found == True:\n        print(\"entry removed!\")\n    else:\n        print(f\"sorry, {title} was not found.\")\n\n# test it\nremove_entry()\nprint(\"meals left:\", len(meals))"},{"t":"tip","md":"**Watch out, step 5:** order matters in the final file. Python reads from top to bottom, and a function must be defined **before** the line that calls it runs. So: a comment at the top, then `meals = []`, then all the functions, and the menu loop last."},{"t":"mc","kind":"predict","q":"What happens when this runs?","code":"show_menu()\n\ndef show_menu():\n    print(\"1. add a new entry\")","options":["It prints 1. add a new entry","Nothing is printed, and there's no error","NameError: show_menu is called before Python has read its def","It prints the line twice"],"answer":2,"why":"Python runs top to bottom. On line 1, show_menu doesn't exist yet, so Python stops with NameError: name 'show_menu' is not defined. Put the def above the call."},{"t":"mc","kind":"why","q":"In remove_entry, why is there a `break` right after `meals.remove(meal)`?","options":["break is what deletes the meal from the list","Without break, Python would remove every meal","break makes the function return True","The meal was found and the list just changed, so there's no reason to keep looping"],"answer":3,"why":"Once the meal is found and removed, the job is done. Stopping also avoids looping over a list that just changed, which can skip items. break doesn't remove anything itself: meals.remove(meal) does that."},{"t":"code","id":"d8-c-full","task":"**Step 5: the full Healthy Meal Tracker.** Put everything together in one file:\n\n- a comment at the top that says what the program is\n- `meals = []`\n- `print_ingredients`, `add_entry`, `view_entries` and `remove_entry` (your versions from steps 2 to 4)\n- the menu loop at the bottom, calling the right function for 1, 2 and 3, and printing `goodbye` and breaking on 4\n\nKeep the messages from the steps: `no entries yet` when the list is empty, a message with `removed` when a meal is removed, and a friendly message with the word `found` when the title isn't there. Add comments to every part (requirement 7).","starter":"# healthy meal tracker\n# (write your comments in your own words)\n\n# 1. the list of meals\n\n# 2. the functions: print_ingredients, add_entry, view_entries, remove_entry\n\n# 3. the menu loop\n","tests":[{"inputs":["1","oatmeal","breakfast","oats","milk","done","cook it","2","4"],"expect":["oatmeal","oats","milk","cook it","goodbye"]},{"inputs":["2","3","pizza","4"],"expect":["no entries yet","found","goodbye"],"reject":["removed"]},{"inputs":["1","toast","breakfast","bread","done","toast it","3","toast","2","4"],"expect":["removed","no entries yet","goodbye"]}],"require":["def add_entry","def view_entries","def remove_entry","while True","#"],"hints":["Copy your working pieces in this order: meals = [], the four functions, then the menu loop from step 1.","In the menu, replace the placeholders: `if choice == \"1\":` calls `add_entry()`, 2 calls `view_entries()`, 3 calls `remove_entry()`.","Try it yourself before you check: add a meal, view it, remove it, view again (you should see no entries yet), then quit with 4."],"solution":"# healthy meal tracker\n# lets the user add, view and remove meals until they choose to quit\n\n# the list that holds every meal; each meal is a dictionary\nmeals = []\n\n\n# prints each ingredient of one meal on its own line\ndef print_ingredients(ingredients):\n    for ingredient in ingredients:\n        print(\"   -\", ingredient)\n\n\n# asks for the details of a new meal and adds it to the list\ndef add_entry():\n    title = input(\"enter the title: \")\n    category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")\n\n    # keep asking for ingredients until the user types done\n    ingredients = []\n    while True:\n        ingredient = input(\"enter an ingredient (type done to finish): \")\n        if ingredient == \"done\":\n            break\n        ingredients.append(ingredient)\n\n    instructions = input(\"enter the instructions: \")\n\n    # put everything in one dictionary and add it to the list\n    meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}\n    meals.append(meal)\n    print(\"entry added!\")\n\n\n# shows every meal and all its details\ndef view_entries():\n    # friendly message when there is nothing to show\n    if len(meals) == 0:\n        print(\"no entries yet.\")\n    else:\n        for meal in meals:\n            print(\"----------\")\n            print(\"title:\", meal[\"title\"])\n            print(\"category:\", meal[\"category\"])\n            print(\"ingredients:\")\n            # the helper prints the ingredients, so there is no loop inside a loop\n            print_ingredients(meal[\"ingredients\"])\n            print(\"instructions:\", meal[\"instructions\"])\n        print(\"----------\")\n\n\n# removes a meal by its title\ndef remove_entry():\n    title = input(\"enter the title of the entry to remove: \")\n\n    # found becomes True if we find the meal\n    found = False\n    for meal in meals:\n        if meal[\"title\"] == title:\n            meals.remove(meal)\n            found = True\n            break\n\n    # after checking every meal, tell the user what happened\n    if found == True:\n        print(\"entry removed!\")\n    else:\n        print(\"sorry, no entry with that title was found.\")\n\n\n# show the menu again and again until the user chooses to quit\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1/2/3/4): \")\n\n    # call the function that matches the choice\n    if choice == \"1\":\n        add_entry()\n    elif choice == \"2\":\n        view_entries()\n    elif choice == \"3\":\n        remove_entry()\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"that is not a choice, please try again.\")","allow":["with"]},{"t":"explain","q":"Explain how your `remove_entry` works, and why it uses a found flag.","points":["it asks for the title and sets found = False before the loop","it loops over meals and compares each meal[\"title\"] to the title typed","when it matches: meals.remove(meal), found = True, and break to stop looking","after the loop, if found is still False, it prints a friendly not-found message","the not-found message has to wait until after the loop, because inside the loop you only see one meal"],"model":"remove_entry first asks which title to remove and sets found to False. Then it goes through the meals list one meal at a time and compares that meal's title to what the user typed. When they match, it removes that dictionary from the list, sets found to True and uses break, because the job is done. After the loop it checks the flag: if found is True it says the entry was removed, and if it's still False it prints a friendly message that the title wasn't found. I can only say not found after the loop, because inside the loop I only know about one meal at a time."}]},{"id":"d8-project-class","title":"Your version: the tracker as a class","minutes":30,"blocks":[{"t":"text","md":"Your project file does the same job, but it keeps everything inside one **class** called `MealTracker`. The brief's hint talks about functions, and both ways meet every requirement. A class just puts the list **and** the functions that use it together in one thing.\n\nGoing from the function version to the class version is three changes:\n\n- the list becomes an attribute: `self.meals = []` inside `__init__`\n- each function moves inside the class, gets `self` as its first parameter, and uses `self.meals` instead of `meals`\n- the menu makes **one** object, `tracker = MealTracker()`, and calls the methods with dot notation: `tracker.add_entry()`"},{"t":"example","title":"The same idea, tiny","code":"class MealTracker:\n    def __init__(self):\n        self.meals = []\n\n    def add_meal(self, title):\n        self.meals.append({\"title\": title})\n        print(\"added\", title)\n\ntracker = MealTracker()\ntracker.add_meal(\"oatmeal\")\ntracker.add_meal(\"soup\")\nprint(len(tracker.meals))","output":"added oatmeal\nadded soup\n2","notes":["line 2-3: `__init__` runs once, when the object is made, and gives it an empty list.","line 5: a method's first parameter is always `self`: the object it was called on.","line 6: `self.meals` is that object's list, so the meal is saved inside the tracker.","line 9: this line creates the object. Without it there is no list yet.","line 10-12: dot notation calls the method on that object, and reads its list."]},{"t":"tip","md":"**Watch out:** inside a method, the list is `self.meals`, never just `meals`. And to call another method from inside the class, use `self` too: `self.print_ingredients(meal[\"ingredients\"])`. Forget `self` and Python stops with a NameError."},{"t":"mc","kind":"bug","q":"Inside `add_entry(self)`, this line is written `meals.append(meal)` instead of `self.meals.append(meal)`. What happens when the user adds a meal?","options":["It works the same, because the class has a list called meals","The meal is added to a new, empty list","NameError: name 'meals' is not defined","SyntaxError before the program starts"],"answer":2,"why":"The list lives on the object as `self.meals`. There is no plain variable called `meals`, so Python stops with a NameError when that line runs. It's not a SyntaxError: the line is written correctly, it just names something that doesn't exist."},{"t":"mc","kind":"why","q":"Why does the menu loop call `tracker.view_entries()` and not `MealTracker.view_entries()` or just `view_entries()`?","options":["The methods belong to the object, so you call them on the object you made with tracker = MealTracker()","Because view_entries is a variable, not a method","Because a class can only be used once","Because tracker is a list of meals"],"answer":0,"why":"`tracker = MealTracker()` makes the object that holds the list. Calling `tracker.view_entries()` runs the method with `self` set to that object, so it can see `self.meals`. A plain `view_entries()` is a NameError, because the method only exists inside the class."},{"t":"code","id":"d8-c-class","task":"**Your project, as a class.** Write the whole tracker the way your project file does it:\n\n- `class MealTracker:` with `__init__(self)` that makes `self.meals = []`\n- the methods `add_entry`, `print_ingredients`, `view_entries` and `remove_entry`, each with `self` first and using `self.meals`\n- after the class: `tracker = MealTracker()` and the menu loop, calling `tracker.add_entry()` and so on, printing `goodbye` and breaking on 4\n\nSame messages as before: `no entries yet` for an empty list, `removed` when a meal is removed, and a friendly message with `found` when the title isn't there. Comment every part.","starter":"# healthy meal tracker app (class version)\n\n# 1. the class: __init__ and the four methods\n\n# 2. create the tracker object\n\n# 3. the menu loop","tests":[{"inputs":["1","oatmeal","breakfast","oats","milk","done","cook it","2","4"],"expect":["oatmeal","oats","milk","cook it","goodbye"]},{"inputs":["2","3","pizza","4"],"expect":["no entries yet","found","goodbye"],"reject":["removed"]},{"inputs":["1","toast","breakfast","bread","done","toast it","3","toast","2","4"],"expect":["removed","no entries yet","goodbye"]}],"require":["class MealTracker","def __init__(self)","self.meals","MealTracker()"],"hints":["Start with `class MealTracker:` and inside it `def __init__(self):` with `self.meals = []`. Then paste your four functions inside the class, indented one more level.","Give every method `self` as its first parameter, change `meals` to
