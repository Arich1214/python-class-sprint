<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python Class Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a study planner. Home is the 9-day plan (today first, then the timeline);
   a lesson is one reading column of blocks: learn, run, predict, write code, explain.
   Code always sits on a dark slab; the editor is a slab too, so "code" always looks the same. */
:root {
  --bg: #FBF3F6; --surface: #FFFFFF; --surface-2: #F5E9EF; --surface-3: #EFE0E8;
  --ink: #1E1420; --ink-2: #594957; --muted: #8A7886; --line: #EBDCE4;
  --accent: #D93A63; --accent-ink: #FFFFFF; --accent-soft: #FCE3EA;
  --coral: #F07A3A; --violet: #7445D6; --violet-soft: #EEE6FF;
  --good: #11815A; --good-soft: #DFF3E9; --bad: #C2303D; --bad-soft: #FBE5E7; --warn: #A8650A; --warn-soft: #FDF0DC;
  --slab: #1D121A; --slab-2: #2A1A25; --slab-ink: #F6EAF1; --slab-dim: #8E7889; --slab-line: #3A2733;
  --shadow: 0 1px 2px rgba(60, 20, 45, .05), 0 12px 32px rgba(60, 20, 45, .08);
  --f-sans: "Poppins", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150D13; --surface: #1F151C; --surface-2: #2A1D26; --surface-3: #33242F; --ink: #F7EDF2; --ink-2: #CDBBC7; --muted: #9C8897; --line: #3A2A35;
    --accent: #FF6B91; --accent-ink: #22080F; --accent-soft: #3E1A27; --coral: #FF9A63; --violet: #B79CFF; --violet-soft: #2D2346;
    --good: #4BCB92; --good-soft: #15302A; --bad: #FF7C86; --bad-soft: #3A181D; --warn: #F2B35C; --warn-soft: #3A2A12;
    --slab: #0E080C; --slab-2: #1E1219; --slab-ink: #F6EAF1; --slab-dim: #8E7889; --slab-line: #2E1F29;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #150D13; --surface: #1F151C; --surface-2: #2A1D26; --surface-3: #33242F; --ink: #F7EDF2; --ink-2: #CDBBC7; --muted: #9C8897; --line: #3A2A35;
  --accent: #FF6B91; --accent-ink: #22080F; --accent-soft: #3E1A27; --coral: #FF9A63; --violet: #B79CFF; --violet-soft: #2D2346;
  --good: #4BCB92; --good-soft: #15302A; --bad: #FF7C86; --bad-soft: #3A181D; --warn: #F2B35C; --warn-soft: #3A2A12;
  --slab: #0E080C; --slab-2: #1E1219; --slab-ink: #F6EAF1; --slab-dim: #8E7889; --slab-line: #2E1F29;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.65 var(--f-sans); -webkit-font-smoothing: antialiased; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2.5px solid var(--violet); outline-offset: 2px; border-radius: 8px; }
code, .mono { font-family: var(--f-mono); font-variant-ligatures: none; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 0 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); }
.top-in { max-width: 1080px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; color: var(--ink); text-decoration: none; margin-right: auto; }
.dot { width: 26px; height: 26px; border-radius: 50%; flex: none; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.65) 0, rgba(255,255,255,0) 34%), linear-gradient(140deg, var(--coral), var(--accent) 60%, var(--violet)); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--ink-2); font-size: 14px; font-weight: 500; padding: 6px 12px; border-radius: 999px; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.count-chip { font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
.note-bar { font-size: 13.5px; padding: 8px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--ink); margin-top: 14px; }

/* shared type */
h1 { margin: 0; font-weight: 600; font-size: clamp(28px, 4.6vw, 42px); line-height: 1.12; letter-spacing: -.02em; text-wrap: balance; }
h2 { margin: 0; font-weight: 600; font-size: 21px; line-height: 1.3; letter-spacing: -.01em; text-wrap: balance; }
h3 { margin: 0; font-weight: 600; font-size: 17px; line-height: 1.35; }
.eyebrow { margin: 0; font-size: 12.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.lede { margin: 0; color: var(--ink-2); max-width: 62ch; }
.sub { margin: 0; color: var(--muted); font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.page { display: flex; flex-direction: column; gap: 26px; padding-top: 28px; }

/* buttons */
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 14.5px; background: var(--accent); color: var(--accent-ink); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.violet { background: var(--violet); color: #fff; }
.btn.small { padding: 7px 13px; font-size: 13.5px; }
.linkish { background: none; border: 0; padding: 0; color: var(--violet); font-weight: 500; font-size: 14px; }

/* plan */
.hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 22px; align-items: stretch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.today { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.today .eyebrow { color: color-mix(in srgb, var(--accent) 70%, var(--bg)); }
.today .lede, .today .sub { color: color-mix(in srgb, var(--bg) 78%, transparent); }
.today .btn { background: var(--accent); color: var(--accent-ink); }
.meta { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.today .pill { background: color-mix(in srgb, var(--bg) 14%, transparent); color: var(--bg); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.vio { background: var(--violet-soft); color: var(--violet); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: st; }
.steps li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; font-size: 14.5px; color: var(--ink-2); }
.steps li::before { counter-increment: st; content: counter(st); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 12px/1 var(--f-sans); background: var(--violet-soft); color: var(--violet); margin-top: 1px; }
.steps b { color: var(--ink); font-weight: 600; }
.timeline { display: flex; flex-direction: column; gap: 10px; }
.drow { display: grid; grid-template-columns: 84px minmax(0, 1fr) 150px; gap: 16px; align-items: center; padding: 14px 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); text-decoration: none; color: inherit; }
.drow:hover { border-color: var(--accent); }
.drow.is-today { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.drow .date { font-size: 13px; color: var(--muted); line-height: 1.3; }
.drow .date b { display: block; font-size: 15px; color: var(--ink); font-weight: 600; }
.drow .t { font-weight: 600; font-size: 15.5px; line-height: 1.35; }
.drow .g { font-size: 13.5px; color: var(--ink-2); line-height: 1.45; margin-top: 2px; }
.drow .right { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.bar { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--coral), var(--accent) 60%, var(--violet)); }
.bar.good i { background: var(--good); }
.drow .right span { font-size: 12.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.testday { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 16px; padding: 14px 18px; border-radius: 18px; background: var(--violet-soft); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { text-decoration: none; color: inherit; padding: 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile b { font-size: 15.5px; font-weight: 600; }
.tile span { font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
.tile .num { font-size: 26px; font-weight: 600; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }

/* day + lesson layout */
.crumbs { font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.lessons { display: flex; flex-direction: column; gap: 10px; }
.lrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: inherit; }
.lrow:hover { border-color: var(--accent); }
.lrow .n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; background: var(--surface-2); color: var(--ink-2); }
.lrow.done .n { background: var(--good); color: #fff; }
.lrow .t { font-weight: 600; font-size: 15px; }
.lrow .s { font-size: 13px; color: var(--muted); }
.lesson-grid { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; align-items: start; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); display: flex; flex-direction: column; gap: 4px; }
.side a { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; text-decoration: none; color: var(--ink-2); font-size: 13.5px; line-height: 1.4; padding: 7px 10px; border-radius: 10px; }
.side a:hover { background: var(--surface-2); }
.side a[aria-current="page"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.side .ck { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); margin-top: 3px; }
.side .ck.on { background: var(--good); border-color: var(--good); }
.side .ck.part { border-color: var(--accent); }
.side h4 { margin: 10px 10px 4px; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lesson { display: flex; flex-direction: column; gap: 22px; min-width: 0; max-width: 760px; }
.lesson-head { display: flex; flex-direction: column; gap: 8px; }
.prog { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog .bar { flex: 1; max-width: 260px; }

/* blocks */
.blk { min-width: 0; }
.prose { display: flex; flex-direction: column; gap: 12px; font-size: 16.5px; line-height: 1.7; color: var(--ink); max-width: 66ch; }
.prose p { margin: 0; }
.prose ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.prose code, .tipbox code, .q code, .opt code, .fb code, .why code, .task code, .notes code, .errbox code, .ai code, .pts code, .model code { font-size: .87em; background: var(--surface-2); color: var(--accent); padding: .08em .38em; border-radius: 6px; overflow-wrap: anywhere; }
.tipbox { border-radius: 16px; padding: 14px 18px; background: var(--warn-soft); font-size: 15px; line-height: 1.6; display: flex; flex-direction: column; gap: 8px; }
.tipbox p { margin: 0; } .tipbox ul { margin: 0; padding-left: 20px; }
.tipbox code { background: color-mix(in srgb, var(--warn) 12%, transparent); }
.panel { border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); min-width: 0; }
.kind { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.tag.v { background: var(--violet-soft); color: var(--violet); }
.tag.g { background: var(--good-soft); color: var(--good); }
.tag.n { background: var(--surface-2); color: var(--ink-2); }
.code { margin: 0; background: var(--slab); color: var(--slab-ink); border-radius: 14px; padding: 12px 0; font: 400 13.5px/1.65 var(--f-mono); font-variant-ligatures: none; overflow-x: auto; counter-reset: ln; }
.code .l { display: block; padding: 0 16px 0 0; white-space: pre; min-height: 1.65em; }
.code .l::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 3em; padding-right: 1em; text-align: right; color: var(--slab-dim); user-select: none; }
.tk-k { color: #FF8FB3; } .tk-b { color: #C9A8FF; } .tk-s { color: #FFC29C; } .tk-n { color: #FFD978; } .tk-c { color: #8E7A8A; font-style: italic; } .tk-fx { color: #7FE7D2; }
.notes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; color: var(--ink-2); }
.notes li { padding-left: 16px; position: relative; } .notes li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 6px; height: 6px; border-radius: 50%; background: var(--violet); }
.console { background: var(--slab-2); color: var(--slab-ink); border-radius: 12px; padding: 12px 14px; font: 400 13.5px/1.6 var(--f-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow: auto; }
.console .pr { color: var(--slab-dim); } .console .ty { color: #7FE7D2; } .console .er { color: #FF8C96; }
.console .dim { color: var(--slab-dim); font-style: italic; }
.errbox { border-radius: 14px; padding: 12px 16px; background: var(--bad-soft); font-size: 14.5px; line-height: 1.55; display: flex; flex-direction: column; gap: 4px; }
.errbox b { color: var(--bad); }
.errbox p { margin: 0; }

/* quiz */
.q { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.45; }
.opts { display: grid; gap: 9px; }
.opt { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 13px; padding: 11px 13px; font-size: 15px; line-height: 1.45; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--surface-2); }
.opt .k { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 12.5px/1 var(--f-sans); background: var(--surface-2); color: var(--ink-2); }
.opt .txt { min-width: 0; overflow-wrap: anywhere; padding-top: 2px; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); } .opt.right .k { background: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); } .opt.wrong .k { background: var(--bad); color: #fff; }
.opt.faded { opacity: .55; }
.fb { border-radius: 14px; padding: 12px 16px; font-size: 14.5px; line-height: 1.55; display: flex; flex-direction: column; gap: 4px; }
.fb p { margin: 0; }
.fb.good { background: var(--good-soft); } .fb.bad { background: var(--bad-soft); } .fb.neutral { background: var(--surface-2); }
.fb h4 { margin: 0; font-size: 14.5px; font-weight: 600; }
.fb.good h4 { color: var(--good); } .fb.bad h4 { color: var(--bad); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions .grow { margin-right: auto; }

/* code task */
.task { font-size: 15.5px; line-height: 1.6; display: flex; flex-direction: column; gap: 8px; }
.task p { margin: 0; } .task ul { margin: 0; padding-left: 20px; }
.editor { display: grid; grid-template-columns: auto minmax(0, 1fr); background: var(--slab); border-radius: 14px; overflow: hidden; border: 2px solid transparent; }
.editor:focus-within { border-color: var(--violet); }
.gutter { margin: 0; padding: 12px 10px 12px 12px; font: 400 13.5px/1.65 var(--f-mono); color: var(--slab-dim); text-align: right; user-select: none; white-space: pre; background: var(--slab); min-width: 3em; }
.gutter .bad { color: #FF8C96; font-weight: 600; }
.src { display: block; width: 100%; min-height: 140px; border: 0; outline: none; resize: none; background: transparent; color: var(--slab-ink); font: 400 13.5px/1.65 var(--f-mono); font-variant-ligatures: none; padding: 12px 14px 12px 4px; tab-size: 4; white-space: pre; overflow-x: auto; overflow-y: hidden; caret-color: var(--accent); }
.src::placeholder { color: var(--slab-dim); }
.inputs { display: flex; flex-direction: column; gap: 6px; }
.inputs label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.inputs textarea { width: 100%; min-height: 42px; resize: vertical; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 12px; font: 400 13.5px/1.5 var(--f-mono); }
.tests { display: flex; flex-direction: column; gap: 8px; }
.trow { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; line-height: 1.5; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.trow .mk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--f-sans); color: #fff; }
.trow.pass .mk { background: var(--good); } .trow.fail .mk { background: var(--bad); }
.trow .det { color: var(--ink-2); font-size: 13.5px; }
.trow code { font-size: .9em; }
.hintbox { border-radius: 14px; padding: 12px 16px; background: var(--violet-soft); font-size: 14.5px; line-height: 1.55; display: flex; flex-direction: column; gap: 6px; }
.hintbox p { margin: 0; }
.hintbox b { color: var(--violet); }
.ai { white-space: normal; }
.ai p { margin: 0 0 6px; } .ai p:last-child { margin: 0; }
.ai pre { margin: 6px 0; }
.thinking { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
.spin { width: 15px; height: 15px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.passed-banner { display: flex; gap: 10px; align-items: center; font-size: 14.5px; font-weight: 600; color: var(--good); }

/* explain */
textarea.answer { width: 100%; min-height: 130px; resize: vertical; border: 1.5px solid var(--line); background: var(--surface); border-radius: 13px; padding: 12px 14px; font-size: 15px; line-height: 1.55; }
textarea.answer:focus, .inputs textarea:focus, .askbox input:focus { border-color: var(--violet); outline: none; }
.pts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pts li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14.5px; line-height: 1.45; }
.pts .mk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 11.5px/1 var(--f-sans); background: var(--line); color: var(--ink-2); margin-top: 1px; }
.pts li.yes .mk { background: var(--good); color: #fff; } .pts li.no .mk { background: var(--bad); color: #fff; }
.pts label { display: contents; cursor: pointer; }
.pts input { width: 19px; height: 19px; margin: 2px 0 0; accent-color: var(--good); }
.model { border-left: 3px solid var(--violet); padding: 2px 0 2px 14px; color: var(--ink-2); font-size: 14.5px; display: flex; flex-direction: column; gap: 4px; }
.model p { margin: 0; }
.lbl { font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* ask box */
.askbox { display: flex; flex-direction: column; gap: 10px; }
.askbox form { display: flex; gap: 8px; flex-wrap: wrap; }
.askbox input { flex: 1 1 260px; min-width: 0; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 16px; font-size: 15px; }

/* gym */
.sethead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 10px; }
.ex { text-decoration: none; color: inherit; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 11px 13px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; min-width: 0; }
.ex:hover { border-color: var(--accent); background: var(--surface-2); }
.ex .t { font-size: 14px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.ex .d { font-size: 12px; color: var(--muted); }
.pips { display: inline-flex; gap: 4px; }
.pip { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.pip.ok { background: var(--good); } .pip.no { background: var(--bad); } .pip.part { background: var(--warn); }

/* mock */
.score { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
.ring { width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface-2) 0); }
.ring div { width: 86px; height: 86px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.section-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.empty { color: var(--muted); font-size: 15px; margin: 0; }

@media (max-width: 860px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .lesson-grid { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .side h4 { display: none; }
  .side a { grid-template-columns: 14px auto; white-space: nowrap; border: 1px solid var(--line); }
  .tiles { grid-template-columns: minmax(0, 1fr); }
  .drow { grid-template-columns: 64px minmax(0, 1fr); }
  .drow .right { grid-column: 2; }
  .drow .right span { text-align: left; }
  .testday { grid-template-columns: 64px minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .card, .panel { padding: 16px; border-radius: 18px; }
  .nav a { padding: 5px 9px; font-size: 13px; }
  .score { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script>
var COURSE = {"days":[{"day":1,"title":"Values, variables and input","goal":"By the end of today you can write a small program that asks the user questions, stores the answers in variables, and prints a clear message back.","lessons":[{"id":"d1-run","title":"How a program runs","minutes":25,"blocks":[{"t":"text","md":"A **program** is a list of instructions for the computer. Python reads them like a recipe: from the **top line to the bottom line**, one line at a time. It finishes each line before it starts the next one.\n\nYour first instruction is `print()`. It shows something on the screen. Whatever you put inside the brackets is what appears, and each `print()` starts on a new line."},{"t":"example","title":"Top to bottom","code":"print(\"good morning\")\nprint(\"time to learn python\")\nprint(\"let's go\")","output":"good morning\ntime to learn python\nlet's go","notes":["line 1: Python runs this line first, so its text appears first","line 2: runs next and shows up on a new line","line 3: runs last. If you swap two lines, the output swaps too"]},{"t":"text","md":"Inside `print()` you can put **text** or **numbers**, and Python treats them very differently.\n\n- **Text** goes inside quotes: `\"pizza\"`. Python shows it exactly as written. Programmers call text a **string**.\n- **Numbers** have no quotes: `12` or `3.5`. Python treats them as numbers, so it can do math with them.\n\nA **comment** is a note for humans. It starts with `#`, and Python skips everything from the `#` to the end of the line. Use comments to say what your code does, like `# E - 2: temperature converter`."},{"t":"example","title":"Quotes and comments","code":"# my first program\nprint(2 + 3)\nprint(\"2 + 3\")\nprint(\"pizza\")\n# print(\"python skips this line\")\nprint(10 - 4)  # a comment can sit at the end of a line","output":"5\n2 + 3\npizza\n6","notes":["line 1: a comment. Python skips it; it's a note for you and your teacher","line 2: no quotes, so Python does the math and shows 5","line 3: quotes, so Python shows the characters exactly as typed: 2 + 3","line 5: starts with #, so this print never runs","line 6: the code runs; everything after the # is ignored"]},{"t":"mc","kind":"predict","q":"What does this program show?","code":"print(\"first\")\n# print(\"second\")\nprint(\"third\")","options":["first, second and third, on three lines","only first","first and third, on two lines","an error, because of the #"],"answer":2,"why":"The `#` turns line 2 into a comment, so Python skips it. Lines 1 and 3 run, each on its own line. A comment never causes an error; skipping is its whole job."},{"t":"mc","kind":"why","q":"Why does this line show `10 - 4` and not `6`?","code":"print(\"10 - 4\")","options":["The quotes make it text, so Python shows the characters exactly as typed","Python can't do math inside print()","The spaces around the - stop the math","print() can only do math with the + sign"],"answer":0,"why":"Anything inside quotes is text, and Python shows text exactly as it is, without working anything out. Remove the quotes, `print(10 - 4)`, and Python does the math and shows 6. print() can do any math, with or without spaces."},{"t":"text","md":"Errors are normal. Every programmer sees them every day. An error is Python saying \"I can't do this line\", and the message tells you **where** and **why**.\n\nRead an error message **from the bottom up**:\n\n- The **last line** gives the error's name and what went wrong, like `NameError: name 'prnt' is not defined`.\n- Just above it, Python shows the **line number** (`line 2`) and the line itself.\n\nTwo errors you'll meet early: a **SyntaxError** means Python can't even read the line, like a missing bracket or quote. A **NameError** means you used a name Python doesn't know, often a typo."},{"t":"example","title":"Reading an error","code":"print(\"this line runs\")\nprnt(\"this line has a typo\")\nprint(\"this line never runs\")","notes":["line 1: runs fine and prints this line runs","line 2: prnt is not a name Python knows, so it stops with NameError: name 'prnt' is not defined. The message says line 2","line 3: never runs. Python stops at the first error","the fix: change prnt to print and run it again"],"error":true},{"t":"tip","md":"**Watch out:** Python is picky. `Print(\"hi\")` with a capital P is a NameError, because `Print` and `print` are different names. A missing quote or bracket, like `print(\"hi\"`, is a SyntaxError."},{"t":"tip","md":"**On the test:** a SyntaxError stops the program before any line runs, because Python checks the grammar of the whole file first. Other errors, like a NameError, happen while the program runs, so the lines above them have already printed."},{"t":"mc","kind":"bug","q":"What happens when you run this program?","code":"print(\"start\")\nprnt(\"middle\")\nprint(\"end\")","options":["It prints start, middle and end","It prints start and end, and skips the bad line","It stops before printing anything, with a SyntaxError","It prints start, then stops with a NameError on line 2"],"answer":3,"why":"Line 1 runs fine. On line 2, `prnt` is a name Python doesn't know, so it stops with a NameError, and line 3 never runs. Python never skips a bad line and carries on. It's not a SyntaxError, because the line is written correctly; only the name is unknown."},{"t":"mc","kind":"vocab","q":"In an error message, where do you find the error's name, like NameError?","options":["In the first line of the message","In the last line of the message","Next to the line number","It isn't shown; you have to guess"],"answer":1,"why":"Read errors from the bottom up. The last line names the error and says what went wrong, like `NameError: name 'prnt' is not defined`. The line number sits just above it and tells you where."},{"t":"code","id":"d1-c-fix","task":"This program should print two lines, `welcome to the cafe` and `today's special: soup`, but it has two errors. Run it, read each error message, and fix the problems one at a time.","starter":"print(\"welcome to the cafe\"\nprnt(\"today's special: soup\")\n","tests":[{"inputs":[],"expect":["welcome to the cafe","today's special: soup"]}],"hints":["Run it and read the last line of the error. It names the error, and the line number tells you where to look.","Line 1 is missing something at the end. Every opening bracket `(` needs a closing bracket `)`.","Once the bracket is fixed, the next error is a NameError: check how `print` is spelled on line 2."],"solution":"print(\"welcome to the cafe\")\nprint(\"today's special: soup\")"},{"t":"code","id":"d1-c-snack","task":"Write a program that starts with a comment saying what it does. Then print the text `my snack bill` on the first line. On the second line, let Python work out the price of 3 sandwiches that cost 4 euros each: write the math without quotes, so the screen shows 12.","starter":"","tests":[{"inputs":[],"expect":["my snack bill","12"],"reject":["3 * 4"]}],"require":["#","*"],"hints":["A comment starts with `#`, for example `# my snack bill program`.","Text goes in quotes: `print(\"my snack bill\")`.","For the math, leave the quotes out so Python calculates it: `print(3 * 4)`."],"solution":"# prints my snack bill\nprint(\"my snack bill\")\nprint(3 * 4)"},{"t":"explain","q":"Your program stops with an error. Explain to your teacher how you read the error message and find the problem.","points":["Read from the bottom: the last line names the error and says what went wrong","The line number shows the line where Python stopped","Lines above the error already ran; lines below it did not","SyntaxError: Python can't read the line (like a missing bracket); NameError: a name Python doesn't know, often a typo"],"model":"First I don't panic, because errors are normal. I read the message from the bottom up. The last line tells me the error's name and what went wrong, for example NameError: name 'prnt' is not defined. Just above it is the line number, so I go to that line in my code. A NameError usually means a typo in a name, and a SyntaxError usually means a missing bracket or quote. I fix it and run the program again."}]},{"id":"d1-variables","title":"Variables: boxes with labels","minutes":30,"blocks":[{"t":"text","md":"A **variable** is a box with a label on it. You put a value in the box, and later you use the label to get the value back.\n\n`score = 10`\n\nRead this line from right to left: take the value `10` and store it in a box labelled `score`. The `=` sign means **store**. It does not mean \"equals\" like in math class.\n\nAfter that line, writing `score` (with no quotes) anywhere in your code means \"whatever is in the score box right now\"."},{"t":"example","title":"Storing and using values","code":"food = \"pizza\"\nslices = 8\nprint(food)\nprint(slices)\nprint(\"food\")","output":"pizza\n8\nfood","notes":["line 1: stores the text pizza in a box called food","line 2: stores the number 8 in a box called slices","line 3: no quotes, so Python looks inside the box and shows pizza","line 5: quotes, so this is just the text food. Python doesn't look in any box"]},{"t":"text","md":"A box holds **one value at a time**. When you store a new value, the old one is thrown away.\n\nYou can even use a box's own value to work out its new value:\n\n`score = score + 5`\n\nIn math class this line would be impossible. In Python it makes sense, because Python always works out the **right side first**: it takes what's in score, adds 5, and then stores the result back in score."},{"t":"example","title":"Changing a variable","code":"score = 10\nprint(score)\nscore = score + 5\nprint(score)\nscore = 0\nprint(score)","output":"10\n15\n0","notes":["line 1: score starts at 10","line 3: right side first: 10 + 5 is 15, then 15 is stored in score. The 10 is gone","line 5: storing 0 throws away the 15","each print shows what's in the box at that moment, from top to bottom"]},{"t":"mc","kind":"predict","q":"What does this print?","code":"coins = 3\ncoins = coins + 2\ncoins = coins * 2\nprint(coins)","options":["3","7","10","coins"],"answer":2,"why":"Follow the box line by line: 3, then 3 + 2 = 5, then 5 * 2 = 10. Each line uses the value left by the line before. 7 forgets that line 3 starts from 5, and `coins` has no quotes, so print shows the value, not the word."},{"t":"mc","kind":"predict","q":"What does this print?","code":"drink = \"tea\"\ndrink = \"juice\"\nprint(drink)","options":["juice","tea","tea juice","drink"],"answer":0,"why":"A box holds one value at a time. Line 2 replaces tea with juice, so tea is gone. To keep both you'd need two boxes with different names."},{"t":"mc","kind":"why","q":"Why does `score = score + 1` make sense in Python, even though it's impossible in math?","options":["= means store: Python works out score + 1, then puts it back in score","Python ignores the score on the right side","+ 1 is only a note, like a comment","It doesn't make sense; Python stops with an error"],"answer":0,"why":"In Python, `=` is not a math equals sign. Python works out the right side with the old value, then stores the result in the box on the left. It's a normal line, and you'll use it all the time to count things."},{"t":"text","md":"**Naming rules.** A variable name can use lowercase letters, digits and underscores, like `birth_year` or `player2`. It can't have spaces (`birth year` is an error) and it can't start with a digit (`2nd_place` is an error). Capitals matter: `Age` and `age` are two different boxes. Pick names that say what's inside: `celsius` tells your teacher more than `c`.\n\n**Types.** Every value has a **type**, the kind of value it is:\n\n- `int`: a whole number, like `19` or `-3`\n- `float`: a number with a decimal point, like `1.75` or `20.0`\n- `str`: text in quotes, like `\"ana\"` or even `\"19\"`\n- `bool`: only `True` or `False`, for yes/no facts\n\n`type()` tells you the type of any value."},{"t":"example","title":"Four types","code":"age = 19\nheight = 1.75\nname = \"ana\"\nis_student = True\nprint(type(age))\nprint(type(height))\nprint(type(name))\nprint(type(is_student))\nprint(type(\"19\"))","output":"<class 'int'>\n<class 'float'>\n<class 'str'>\n<class 'bool'>\n<class 'str'>","notes":["line 1: a whole number, so it's an int","line 2: it has a decimal point, so it's a float","line 4: True has a capital T and no quotes. It's a bool, not text","line 9: \"19\" is in quotes, so it's a str (text), even though it looks like a number"]},{"t":"tip","md":"**Watch out:** `\"19\"` and `19` look alike but are different types. With quotes it's text (`str`), and you can't do math with it. Without quotes it's a number (`int`). Also, `True` and `False` need a capital letter: `true` gives a NameError."},{"t":"tip","md":"**On the test:** if you're asked what `=` does, say: it **stores** (or assigns) the value on the right in the variable on the left. Comparing two values uses `==`, which you'll meet on day 2."},{"t":"mc","kind":"vocab","q":"Which of these is a valid variable name?","options":["birth year","2nd_player","birth-year","birth_year"],"answer":3,"why":"Names use letters, digits and underscores. A space splits it into two names, a name can't start with a digit, and `-` is the minus sign, so `birth-year` means birth minus year."},{"t":"mc","kind":"what","q":"What type is the value `\"3.5\"`?","options":["float","str","int","bool"],"answer":1,"why":"It's in quotes, so it's text: a `str`. Without the quotes, `3.5` would be a float. The quotes always win: Python doesn't look at what's inside them."},{"t":"code","id":"d1-c-apples","task":"Make a variable `apples` and store 4 in it. Then add 3 to it by using its own value (`apples = apples + ...`) and print it. Then double it the same way and print it again. The program should show 7, then 14.","starter":"apples = 4\n# add 3 to apples\n\n# print apples\n\n# double apples\n\n# print apples again\n","tests":[{"inputs":[],"expect":["7","14"]}],"require":["apples = apples"],"hints":["Use the box's own value on the right side: `apples = apples + 3`.","After that line, `print(apples)` shows 7.","Doubling works the same way: `apples = apples * 2`, then print again."],"solution":"apples = 4\napples = apples + 3\nprint(apples)\napples = apples * 2\nprint(apples)"},{"t":"code","id":"d1-c-types","task":"Pick a favourite game or food and make four variables about it, one of each type: an `int` (like a number of players), a `float` (like a price), a `str` (like its name) and a `bool` (like whether you own it). Then print the type of each one with `type()`.","starter":"# make four variables here\n\n# print the type of each one\n","tests":[{"inputs":[],"expect":["<class 'int'>","<class 'float'>","<class 'str'>","<class 'bool'>"]}],"require":["type("],"hints":["Whole number with no quotes = int, decimal point = float, quotes = str, True or False = bool.","For example `players = 4` and `price = 29.99`.","Print each type on its own line: `print(type(players))`."],"solution":"game = \"minecraft\"\nplayers = 4\nprice = 29.99\nown_it = True\nprint(type(game))\nprint(type(players))\nprint(type(price))\nprint(type(own_it))"},{"t":"explain","q":"Explain to your teacher what a variable is, and what Python does on the line `price = price + 2`.","points":["A variable is a named box that holds one value","= stores the value on the right in the variable on the left","Python works out the right side first, using the old value","The new value replaces the old one"],"model":"A variable is like a box with a label. I store a value in it with `=`, and later I use the name to get the value back. On `price = price + 2`, Python first works out the right side: it takes the value in price and adds 2. Then it stores that result back in price, so the old value is replaced. That's fine in Python, even though it looks wrong in math, because `=` means store, not equals."}]},{"id":"d1-input","title":"Asking the user: input()","minutes":30,"blocks":[{"t":"text","md":"So far your programs do the same thing every time. `input()` lets them talk to the user. It shows a question, waits for the user to type something and press Enter, and **gives back what they typed**. You store it in a variable:\n\n`name = input(\"enter your name: \")`\n\nThe text in the brackets is the **prompt**, the question the user sees. End it with a colon and a space, so the typing doesn't stick to the words."},{"t":"example","title":"Asking two questions","code":"name = input(\"enter your name: \")\nfood = input(\"what's your favourite food? \")\nprint(\"hi\", name)\nprint(name, \"likes\", food)","inputs":["mia","tacos"],"notes":["line 1: shows the prompt, waits, and stores what the user types (mia) in name","line 2: a second question, so a second box","line 4: you can use a box as often as you like"]},{"t":"text","md":"**Here's the catch:** `input()` always gives back **text**, even when the user types digits. Type `19` and you get `\"19\"`, the characters 1 and 9, not the number nineteen. You can't do math with that.\n\nSo you convert the text to a number:\n\n- `int()` turns text like `\"19\"` into the whole number `19`\n- `float()` turns text like `\"1.75\"` into the decimal number `1.75`, and `\"20\"` into `20.0`\n\nYou usually do it all on one line: `age = int(input(\"enter your age: \"))`. Read it from the **inside out**: first `input()` asks, then `int()` converts, then `=` stores."},{"t":"example","title":"Name and age: a complete program","code":"name = input(\"enter your name: \")\nage = int(input(\"enter your age: \"))\nprint(\"hello\", name)\nprint(\"you are\", age, \"years old\")\nprint(\"next year you will be\", age + 1)","inputs":["leo","19"],"notes":["line 1: a name is text, so no conversion is needed","line 2: input() gives \"19\" (text), int() turns it into the number 19, and = stores it in age","line 5: age holds a real number, so age + 1 works and gives 20"]},{"t":"mc","kind":"what","q":"The user types `25`. What is stored in `x`?","code":"x = input(\"enter a number: \")","options":["The whole number 25","The float 25.0","The text \"25\"","Nothing, until you print it"],"answer":2,"why":"`input()` always gives back text, so x holds the characters 2 and 5. To get the number 25 you'd write `int(input(...))`. Typing digits doesn't change what `input()` gives back."},{"t":"mc","kind":"predict","q":"The user types `4`. What does the second line print?","code":"n = input(\"enter a number: \")\nprint(n + n)","options":["8","44","4 + 4","a TypeError"],"answer":1,"why":"n holds the text \"4\", not the number 4. Using `+` on two texts glues them together, so you get 44, not 8. With `n = int(input(...))` it would print 8."},{"t":"text","md":"What if the user types letters where you expect a number? `int(\"nineteen\")` can't work, so Python stops with a **ValueError**. The type is right (it's text), but the value inside can't become a number.\n\nThe same happens with `int(\"1.75\")`: `int()` only accepts whole numbers. For anything that can have a decimal point, like a price, a height or a temperature, use `float()`. It accepts both `\"1.75\"` and `\"2\"`."},{"t":"example","title":"Typing letters","code":"age = int(input(\"enter your age: \"))\nprint(\"you are\", age)","inputs":["nineteen"],"notes":["line 1: int() gets the text nineteen, which isn't digits, so Python stops with ValueError: invalid literal for int() with base 10: 'nineteen'","line 2: never runs","your code isn't wrong here: the user typed something the program can't use"],"error":true},{"t":"tip","md":"**Watch out:** forgetting `int()` doesn't always crash right away. `age = input(\"age: \")` runs fine, but a later `age + 1` stops with a **TypeError**, because you can't add a number to text. If a math line crashes, check that every typed number went through `int()` or `float()`."},{"t":"mc","kind":"bug","q":"Which typed answer makes this line crash?","code":"height = float(input(\"enter your height in meters: \"))","options":["one point seven","1.75","2","0.5"],"answer":0,"why":"`float()` needs digits, with or without a decimal point, so 1.75, 2 and 0.5 all work (2 becomes 2.0). Words can't be turned into a number, so Python stops with a ValueError."},{"t":"mc","kind":"why","q":"Why should a typed price like 2.50 go through `float()` and not `int()`?","options":["float() rounds the price to two decimals","int() can't be used together with input()","float() adds a currency sign when you print the price","int() only accepts whole numbers, so \"2.50\" would cause a ValueError"],"answer":3,"why":"`float()` handles decimals like 2.50 and whole numbers like 3. `int(\"2.50\")` stops with a ValueError, because `int()` only accepts whole numbers. `int(input(...))` itself is fine, as long as the user types a whole number."},{"t":"code","id":"d1-c-double","task":"Ask the user for their name and their favourite whole number. Print a greeting with their name, then their number times 2. Example: you type `mia` and `7`, and the program prints `hi mia` and `double your number: 14`.","starter":"name = input(\"enter your name: \")\n# ask for the favourite number and turn it into a whole number\n\n# print a greeting with the name\n\n# print the number times 2\n","tests":[{"inputs":["mia","7"],"expect":["mia","14"]},{"inputs":["sam","21"],"expect":["sam","42"]},{"inputs":["jo","50"],"expect":["jo","100"]}],"require":["int("],"hints":["The name is text, so plain `input()` is fine. The number needs `int()` around the `input()`.","`number = int(input(\"enter your favourite number: \"))`","Print with commas: `print(\"hi\", name)` and `print(\"double your number:\", number * 2)`."],"solution":"name = input(\"enter your name: \")\nnumber = int(input(\"enter your favourite number: \"))\nprint(\"hi\", name)\nprint(\"double your number:\", number * 2)"},{"t":"code","id":"d1-c-bill","task":"Ask for the price of one item (it can have cents, like 2.5) and how many the user wants (a whole number). Print the total price. Example: price `2.5` and `4` items gives `10.0`.","starter":"# ask for the price (it can have decimals)\n\n# ask for how many (a whole number)\n\n# print the total\n","tests":[{"inputs":["2.5","4"],"expect":["10.0"]},{"inputs":["1.25","3"],"expect":["3.75"]},{"inputs":["0.5","10"],"expect":["5.0"]}],"require":["float("],"hints":["A price can have decimals, so convert it with `float()`. The number of items is whole, so `int()` works.","`price = float(input(\"enter the price of one item: \"))`","Multiply the two boxes inside the print: `print(\"total:\", price * amount)`."],"solution":"price = float(input(\"enter the price of one item: \"))\namount = int(input(\"how many do you want? \"))\nprint(\"total:\", price * amount)"},{"t":"explain","q":"Explain, step by step, what `age = int(input(\"enter your age: \"))` does, and what happens if the user types `nineteen`.","points":["input() shows the prompt and gives back what the user typed, always as text","int() turns that text into a whole number, so you can do math with it","= stores the result in age; Python works from the inside out","Letters like nineteen make int() stop with a ValueError"],"model":"Python works from the inside out. First `input()` shows the question and waits. Whatever the user types comes back as text, so 19 comes back as \"19\". Then `int()` turns that text into the whole number 19, so I can do math with it. Last, `=` stores the number in the variable age. If the user types nineteen, `int()` can't turn letters into a number, so the program stops with a ValueError."}]},{"id":"d1-print","title":"Printing clear messages","minutes":25,"blocks":[{"t":"text","md":"`print()` can show several things at once. Separate them with **commas**, and print puts **one space** between the pieces:\n\n`print(\"you are\", age, \"years old\")` shows `you are 19 years old`\n\nYou can mix text, numbers and variables this way, and you don't type the spaces yourself. That's how all your E01 programs print their results."},{"t":"example","title":"Commas add the spaces","code":"name = \"ana\"\nage = 19\nprint(\"hello\", name)\nprint(\"you are\", age, \"years old\")\nprint(name, \"turns\", age + 1, \"next year\")","output":"hello ana\nyou are 19 years old\nana turns 20 next year","notes":["line 3: two pieces, so one space between them","line 4: three pieces: text, the value in age, more text","line 5: a piece can be a calculation; Python works out age + 1 first"]},{"t":"mc","kind":"predict","q":"What does this print?","code":"item = \"cookie\"\nn = 3\nprint(n, item, \"s\")","options":["3 cookies","3cookies","3 cookie s","n item s"],"answer":2,"why":"The commas put a space between every piece, including before the s. To get 3 cookies you'd write `print(n, \"cookies\")`. And `n` and `item` have no quotes, so print shows their values, not their names."},{"t":"text","md":"An **f-string** is another way to build a message. Put the letter `f` right before the opening quote, then write variables inside **curly brackets** `{}`. Python swaps each `{name}` for the value in the box:\n\n`print(f\"hello {name}, you are {age}\")` shows `hello ana, you are 19`\n\nWith an f-string, the spaces and commas are exactly the ones you type. You can also put a small calculation inside the brackets, like `{age + 1}`."},{"t":"example","title":"f-strings","code":"food = \"tacos\"\nprice = 3.5\ncount = 4\nprint(f\"i want {count} {food}\")\nprint(f\"that costs {price * count} euros\")\nprint(\"{food} without the f\")","output":"i want 4 tacos\nthat costs 14.0 euros\n{food} without the f","notes":["line 4: each {} is replaced by the value in that box","line 5: Python works out price * count inside the brackets: 14.0","line 6: no f before the quote, so the curly brackets are printed as plain text"]},{"t":"mc","kind":"why","q":"Why does this print `score: {score}` instead of `score: 8`?","code":"score = 8\nprint(\"score: {score}\")","options":["There's no f before the quote, so it's a normal string","score has no value yet","Curly brackets only work with text, not numbers","print() always shows curly brackets as they are"],"answer":0,"why":"Only an f-string swaps `{score}` for the value. Without the `f`, the curly brackets are ordinary characters and get printed as they are. Write `f\"score: {score}\"` and it shows score: 8; numbers work fine inside the brackets."},{"t":"mc","kind":"predict","q":"What does this print?","code":"a = 2\nb = 3\nprint(f\"{a} + {b} = {a + b}\")","options":["5 + 5 = 5","2 + 3 = 5","a + b = a + b","2 + 3 = 2 + 3"],"answer":1,"why":"Each `{}` is replaced by its value: {a} is 2, {b} is 3, and {a + b} is worked out to 5. The + and = outside the brackets are just text, so they're printed as typed."},{"t":"text","md":"You might try to glue text and a number together with `+`:\n\n`print(\"age: \" + age)`\n\nIf age holds the number 19, this crashes with a **TypeError**. `+` can add two numbers or join two texts, but it can't mix text with a number, and Python won't guess what you meant.\n\nTwo easy fixes that work with any type:\n\n- a comma: `print(\"age:\", age)`\n- an f-string: `print(f\"age: {age}\")`"},{"t":"example","title":"The + trap","code":"age = 19\nprint(\"age:\", age)\nprint(f\"age: {age}\")\nprint(\"age: \" + age)","notes":["line 2: the comma version works and prints age: 19","line 3: the f-string version prints the same thing","line 4: TypeError: can only concatenate str (not \"int\") to str. Concatenate means join: + can't join text and a number"],"error":true},{"t":"tip","md":"**Watch out:** a comma adds a space for you; an f-string doesn't. If `total = 5`, then `print(\"total:\", total)` shows `total: 5`, but `print(f\"total:{total}\")` shows `total:5`. In an f-string, type the space yourself."},{"t":"tip","md":"**On the test:** `print(\"5\" + \"5\")` shows `55` (two texts joined), `print(5 + 5)` shows `10`, and `print(\"5\" + 5)` is a TypeError. Look for the quotes to know which one you have."},{"t":"mc","kind":"bug","q":"Why does the last line crash?","code":"total = 12\nprint(\"total: \" + total)","options":["total was never created","print() can only show text","the space inside the quotes isn't allowed","+ can't join text and a number, so it's a TypeError"],"answer":3,"why":"total holds the number 12, and `+` can't join text with a number. Use a comma, `print(\"total:\", total)`, or an f-string. print() itself shows numbers just fine."},{"t":"mc","kind":"what","q":"`price = 5`. Which line prints exactly `price: 5`?","options":["`print(\"price:\", price)`","`print(\"price:\" + price)`","`print(f\"price:{price}\")`","`print(\"price:\", \"price\")`"],"answer":0,"why":"The comma adds the space, so you get price: 5. The f-string has no space after the colon, so it shows price:5. `+` crashes with a number, and \"price\" in quotes prints the word price."},{"t":"code","id":"d1-c-score","task":"Ask for a player's name and their points (a whole number). Use an f-string to print one line like `mia has 30 points`. Then print the doubled points on a second line, like `bonus points: 60`.","starter":"name = input(\"enter the player's name: \")\npoints = int(input(\"enter the points: \"))\n# print the first line with an f-string\n\n# print the doubled points\n","tests":[{"inputs":["mia","30"],"expect":["mia","30","60"]},{"inputs":["leo","7"],"expect":["leo","7","14"]}],"require":["f\""],"hints":["An f-string starts with f right before the quote: `f\"...\"`.","Put each variable in curly brackets: `{name}` and `{points}`.","`print(f\"{name} has {points} points\")`. For the second line you can put the math inside the brackets: `{points * 2}`."],"solution":"name = input(\"enter the player's name: \")\npoints = int(input(\"enter the points: \"))\nprint(f\"{name} has {points} points\")\nprint(f\"bonus points: {points * 2}\")"},{"t":"explain","q":"`age = 19`. Explain two ways to print `you are 19 years old`, and why `print(\"you are \" + age)` crashes.","points":["Commas: print(\"you are\", age, \"years old\") puts a space between the pieces","f-string: f\"you are {age} years old\" puts the value where the {} is","+ only joins text with text, so text + a number is a TypeError","In an f-string you type the spaces yourself"],"model":"The first way is commas: `print(\"you are\", age, \"years old\")`. Print puts a space between each piece, so I don't type them. The second way is an f-string: I put f before the quote and write `{age}` where the number should go, and I type the spaces myself. Using `+` crashes because age is a number, and `+` can only join text with text. Python gives a TypeError instead of guessing."}]}]},{"day":2,"title":"Operators: math, text and True/False","goal":"By the end of today you can do math, work with text and ask True/False questions in Python, and you can solve every E01 exercise.","lessons":[{"id":"d2-math","title":"Math operators","minutes":30,"blocks":[{"t":"text","md":"Python is a very good calculator. The symbols that do math are called **operators**:\n\n- `+` add and `-` subtract\n- `*` multiply (a star, not an x)\n- `/` divide. It **always** gives a float: `10 / 2` is `5.0`\n- `**` power: `3 ** 2` is 3 × 3, which is 9\n- `//` and `%`, two special kinds of division, coming next"},{"t":"example","title":"The basic operators","code":"print(7 + 3)\nprint(7 - 3)\nprint(7 * 3)\nprint(7 / 2)\nprint(10 / 2)\nprint(3 ** 2)","output":"10\n4\n21\n3.5\n5.0\n9","notes":["line 4: 7 / 2 is 3.5, a float","line 5: even when it divides evenly, / gives a float: 5.0, not 5","line 6: ** is power: 3 to the power of 2, which is 9"]},{"t":"tip","md":"**Slides vs Python:** the slides write powers with `^`, like `3^2`. In Python, `^` is a different operator, and it gives a strange answer with **no error**: `3 ^ 2` is `1`. Always write `3 ** 2`."},{"t":"mc","kind":"predict","q":"What does this print?","code":"print(9 / 3)","options":["3","3.0","3.3","0"],"answer":1,"why":"A single `/` always gives a float, even when it divides evenly, so you get 3.0, not 3. `9 // 3` would give 3."},{"t":"text","md":"Think of sharing sweets. You have 17 sweets and 5 friends.\n\n- `17 // 5` is `3`: each friend gets 3 whole sweets. `//` is **floor division**: divide and keep only the whole part.\n- `17 % 5` is `2`: 2 sweets are left over. `%` is **modulo**: the **remainder** after dividing.\n\nThey're perfect for splitting an amount into units. 135 minutes is `135 // 60` = 2 whole hours, and `135 % 60` = 15 minutes left. That's exactly how E01-9 breaks cents into bills and coins."},{"t":"example","title":"Hours, minutes and money","code":"minutes = 135\nhours = minutes // 60\nleft = minutes % 60\nprint(hours, \"hours and\", left, \"minutes\")\ncents = 287\nprint(\"dollars:\", cents // 100)\nprint(\"cents left:\", cents % 100)","output":"2 hours and 15 minutes\ndollars: 2\ncents left: 87","notes":["line 2: 60 fits into 135 two whole times, so hours is 2","line 3: 135 - 120 leaves 15, so left is 15","line 6: 287 cents is 2 whole dollars...","line 7: ...and 87 cents left over"]},{"t":"mc","kind":"predict","q":"What does this print?","code":"print(20 // 6, 20 % 6)","options":["3.3333333333333335 2","2 3","3 2","3 0"],"answer":2,"why":"6 fits into 20 three whole times (18), so `20 // 6` is 3. 20 - 18 leaves 2, so `20 % 6` is 2. The long decimal is what `/` would give."},{"t":"mc","kind":"what","q":"Which expression gives the remainder when 25 is divided by 7?","options":["25 / 7","25 // 7","25 ** 7","25 % 7"],"answer":3,"why":"`%` gives what's left over: 7 fits 3 times (21), leaving 4. `//` would give the 3 whole times, and `/` gives 3.57..., the full answer as a float."},{"t":"text","md":"When one line has several operators, Python follows the same order as math class:\n\n- first anything in brackets `( )`\n- then `**`\n- then `*`, `/`, `//` and `%`, from left to right\n- last `+` and `-`, from left to right\n\nSo `2 + 3 * 4` is `14`, not 20. To make the adding happen first, use brackets: `(2 + 3) * 4` is `20`. When in doubt, add brackets. They never hurt, and they show what you mean."},{"t":"example","title":"Order of operations","code":"print(2 + 3 * 4)\nprint((2 + 3) * 4)\nprint(10 - 4 - 2)\nprint(2 * 3 ** 2)\nfahrenheit = 212\nprint((fahrenheit - 32) * 5 / 9)","output":"14\n20\n4\n18\n100.0","notes":["line 1: * goes before +, so 3 * 4 = 12, then 2 + 12 = 14","line 2: brackets first: 5 * 4 = 20","line 3: same rank, so left to right: 10 - 4 = 6, then 6 - 2 = 4","line 4: ** first: 3 ** 2 = 9, then 2 * 9 = 18","line 6: the E01-2 formula. The brackets make the subtraction happen first"]},{"t":"tip","md":"**On the test:** `/` always gives a float, even when it divides evenly. `print(8 / 4)` shows `2.0`, not `2`. When you only want the whole part, use `//`: `print(8 // 4)` shows `2`."},{"t":"mc","kind":"predict","q":"What does this print?","code":"print(10 - 2 * 3)","options":["24","4","-4","10"],"answer":1,"why":"`*` goes before `-`, so Python does 2 * 3 = 6 first, then 10 - 6 = 4. 24 is what you'd get going left to right, which Python doesn't do here."},{"t":"mc","kind":"bug","q":"This should print the average of 4 and 6, which is 5.0. Why does it print 7.0?","code":"print(4 + 6 / 2)","options":["/ goes before +, so it works out 4 + 3; it needs (4 + 6) / 2","/ always adds 2 to the answer","Python rounds 5.0 up to 7.0","The numbers need float() first"],"answer":0,"why":"Division comes before addition, so Python does 6 / 2 = 3.0 first, then 4 + 3.0 = 7.0. Brackets fix it: `(4 + 6) / 2` is 5.0. Python never rounds by itself."},{"t":"code","id":"d2-c-time","task":"Ask for a number of minutes (a whole number). Print how many whole hours that is and how many minutes are left over. Example: `135` gives 2 hours and 15 minutes.","starter":"minutes = int(input(\"enter the minutes: \"))\n# work out the whole hours\n\n# work out the minutes left over\n\n# print both\n","tests":[{"inputs":["135"],"expect":["2","15"],"reject":["2.25"]},{"inputs":["200"],"expect":["3","20"],"reject":["3.33"]},{"inputs":["499"],"expect":["8","19"],"reject":["8.31"]}],"require":["//","%"],"hints":["An hour has 60 minutes. Which operator tells you how many whole 60s fit?","`//` gives the whole hours and `%` gives the minutes left over.","`hours = minutes // 60` and `left = minutes % 60`, then print both with commas."],"solution":"minutes = int(input(\"enter the minutes: \"))\nhours = minutes // 60\nleft = minutes % 60\nprint(hours, \"hours and\", left, \"minutes\")"},{"t":"code","id":"d2-c-average","task":"Ask for three test scores (whole numbers) and print their average: add them up and divide by 3. Example: `3`, `6` and `9` give `6.0`. Watch the order of operations!","starter":"score1 = int(input(\"enter score 1: \"))\nscore2 = int(input(\"enter score 2: \"))\nscore3 = int(input(\"enter score 3: \"))\n# work out and print the average\n","tests":[{"inputs":["3","6","9"],"expect":["6.0"]},{"inputs":["9","9","6"],"expect":["8.0"]},{"inputs":["6","7","7"],"expect":["6.666"]}],"hints":["The average is the total divided by how many scores there are.","Python divides before it adds, so `score1 + score2 + score3 / 3` only divides the last score.","Put the adding in brackets: `(score1 + score2 + score3) / 3`."],"solution":"score1 = int(input(\"enter score 1: \"))\nscore2 = int(input(\"enter score 2: \"))\nscore3 = int(input(\"enter score 3: \"))\naverage = (score1 + score2 + score3) / 3\nprint(\"average:\", average)"},{"t":"explain","q":"Explain what `//` and `%` do, using 17 sweets shared between 5 friends. Why isn't `/` enough?","points":["// divides and keeps only the whole part: 17 // 5 is 3","% gives the remainder, what's left over: 17 % 5 is 2","/ gives the full answer as a float: 17 / 5 is 3.4","Together they split an amount into whole units and the rest, like hours and minutes or bills and coins"],"model":"`//` divides and keeps only the whole part, so `17 // 5` is 3: each friend gets 3 whole sweets. `%` gives the remainder, what's left after sharing, so `17 % 5` is 2. A normal `/` gives 3.4, but you can't give someone 0.4 of a sweet. Together, `//` and `%` split an amount into whole pieces and what's left, like minutes into hours, or cents into bills and coins in my E01-9 program."}]},{"id":"d2-strings","title":"Working with text","minutes":25,"blocks":[{"t":"text","md":"Text (a `str`) has its own tools:\n\n- `+` joins two texts: `\"ice\" + \"cream\"` is `\"icecream\"`. No space is added, so add one yourself: `\"ice\" + \" \" + \"cream\"`.\n- `*` repeats a text: `\"ha\" * 3` is `\"hahaha\"`.\n- `len()` counts the characters, spaces included: `len(\"hi there\")` is `8`.\n\nSo `+` means add for numbers but join for text. Python looks at the types to decide what to do, which is why mixing a text and a number gives a TypeError."},{"t":"example","title":"Joining, repeating, counting","code":"first = \"ice\"\nsecond = \"cream\"\nprint(first + second)\nprint(first + \" \" + second)\nprint(\"ha\" * 3)\nprint(\"-\" * 10)\nprint(len(\"ice cream\"))","output":"icecream\nice cream\nhahaha\n----------\n9","notes":["line 3: + glues the texts with no space between them","line 4: a text with only a space in it adds the gap","line 6: a handy way to draw a line of 10 dashes","line 7: i-c-e, space, c-r-e-a-m: 9 characters, because the space counts"]},{"t":"mc","kind":"predict","q":"What does this print?","code":"print(\"ba\" + \"na\" * 2)","options":["banabana","banana","ba na na","an error"],"answer":1,"why":"Like in math, `*` happens before `+`. So \"na\" * 2 is \"nana\" first, then \"ba\" + \"nana\" is banana. banabana would need brackets: `(\"ba\" + \"na\") * 2`."},{"t":"mc","kind":"predict","q":"What does this print?","code":"print(len(\"hi there!\"))","options":["7","8","2","9"],"answer":3,"why":"len() counts every character: h, i, the space, t, h, e, r, e and the !. That's 9. 7 forgets that spaces and punctuation count too."},{"t":"text","md":"A **method** is a tool that belongs to a value. You call it with a **dot**: the value, a dot, the method's name, then brackets.\n\n- `word.count(\"a\")` counts how many times `\"a\"` appears in word, and gives back a whole number\n- `word.startswith(\"un\")` asks: does word begin with `\"un\"`? It gives back `True` or `False`\n- `word.endswith(\"ing\")` asks the same question about the end\n\nThe text you check goes **before** the dot. The piece you're looking for goes **inside the brackets**."},{"t":"example","title":"count, startswith and endswith","code":"fruit = \"banana\"\nprint(fruit.count(\"a\"))\nprint(fruit.count(\"an\"))\nprint(fruit.startswith(\"ban\"))\nprint(fruit.endswith(\"na\"))\nprint(fruit.endswith(\"x\"))","output":"3\n2\nTrue\nTrue\nFalse","notes":["line 2: banana has three a's","line 3: count() looks for the whole piece: b-an-an-a has an twice","line 4: banana begins with ban, so True","line 6: banana doesn't end with x, so False. A False is an answer, not an error"]},{"t":"text","md":"Methods are **exact**, character by character. For Python, a capital `B` and a small `b` are completely different characters. So are a space and no space.\n\nSo `\"Banana\".startswith(\"b\")` is `False`, and `\"Banana\".count(\"b\")` is `0`. The program isn't broken; Python is being exact. When a check gives a surprising `False` or `0`, look at capitals and spaces first."},{"t":"example","title":"Exact matching","code":"dish = \"Pasta salad\"\nprint(dish.startswith(\"pasta\"))\nprint(dish.startswith(\"Pasta\"))\nprint(dish.count(\"a\"))\nprint(dish.count(\" \"))\nprint(len(dish))","output":"False\nTrue\n4\n1\n11","notes":["line 2: small p vs capital P, so False","line 3: an exact match, so True","line 4: four small a's. The capital P doesn't count; it isn't an a","line 5: you can count spaces too: there's one"]},{"t":"tip","md":"**Watch out:** `len()` is not a method, so it doesn't use a dot. Write `len(word)`, not `word.len()`. But `count`, `startswith` and `endswith` are methods, so they do use one: `word.count(\"a\")`."},{"t":"mc","kind":"why","q":"Why does this print `False`?","code":"word = \"Hello\"\nprint(word.startswith(\"h\"))","options":["startswith() is exact: a capital H and a small h are different","startswith() only checks the last letter","Hello is too long for startswith()","The brackets must hold a whole word, not one letter"],"answer":0,"why":"For Python, H and h are two different characters, so \"Hello\" does not start with a small h. One letter in the brackets is fine: `word.startswith(\"H\")` gives True."},{"t":"mc","kind":"what","q":"What does `\"mississippi\".count(\"ss\")` give?","options":["4","1","2","True"],"answer":2,"why":"count() looks for the whole piece ss: mi-ss-i-ss-ippi has it twice. 4 would be counting each s on its own. count() gives a number, not True or False."},{"t":"mc","kind":"bug","q":"This should print 5. What happens instead?","code":"print(\"pizza\".len())","options":["It prints 5","It prints pizza","It prints 0","AttributeError: len isn't a method, so write len(\"pizza\")"],"answer":3,"why":"Text has no method called len, so Python stops with an AttributeError. len() goes around the value: `len(\"pizza\")` gives 5. Only methods like count() use the dot."},{"t":"code","id":"d2-c-word","task":"Ask the user for a word. Print how many characters it has (use `len()`) and how many times the letter `a` appears in it (use `count()`). Example: `banana` has 6 characters and 3 a's.","starter":"word = input(\"enter a word: \")\n# print the number of characters\n\n# print how many times a appears\n","tests":[{"inputs":["banana"],"expect":["6","3"]},{"inputs":["avocado"],"expect":["7","2"]},{"inputs":["kiwi"],"expect":["4","0"]}],"require":["len(",".count("],"hints":["len() goes around the value: `len(word)`.","count() is a method, so it uses a dot: `word.count(...)`.","Look for the letter a, in quotes: `print(\"a's:\", word.count(\"a\"))`."],"solution":"word = input(\"enter a word: \")\nprint(\"characters:\", len(word))\nprint(\"a's:\", word.count(\"a\"))"},{"t":"code","id":"d2-c-banner","task":"Ask for a title and print it in a banner: a line of `=` signs above it and below it, exactly as long as the title. Example: `menu` gives `====`, then `menu`, then `====`.","starter":"title = input(\"enter a title: \")\n# print the line of = signs, the title, and the line again\n","tests":[{"inputs":["menu"],"expect":["====","menu"],"reject":["====="]},{"inputs":["pizza time"],"expect":["==========","pizza time"],"reject":["==========="]}],"require":["len("],"hints":["`*` repeats a text: `\"=\" * 4` is `====`.","You don't know how long the title will be, but `len(title)` does.","`line = \"=\" * len(title)`, then print line, title, line."],"solution":"title = input(\"enter a title: \")\nline = \"=\" * len(title)\nprint(line)\nprint(title)\nprint(line)"},{"t":"explain","q":"Your friend says Python is broken, because `\"Banana\".count(\"b\")` gives 0. Explain what's going on, and how a method like `count()` is called.","points":["A method is called with a dot: the text before the dot, the piece to look for in the brackets","count() gives back how many times the piece appears, as a whole number","Matching is exact: a capital B and a small b are different characters","Banana has no small b, so 0 is the right answer"],"model":"Python isn't broken; it's being exact. count() is a method, so I call it with a dot: the text I'm checking goes before the dot, and the piece I'm looking for goes in the brackets. It gives back how many times that piece appears. Banana starts with a capital B, and for Python a capital B and a small b are different characters. There's no small b in Banana, so 0 is the right answer. `\"Banana\".count(\"B\")` would give 1."}]},{"id":"d2-compare","title":"Comparisons: True or False","minutes":25,"blocks":[{"t":"text","md":"A **comparison** asks Python a yes-or-no question about two values. The answer is always a `bool`: `True` or `False`.\n\n- `==` equal to\n- `!=` not equal to\n- `<` less than, `>` greater than\n- `<=` less than or equal to, `>=` greater than or equal to\n\nSo `5 > 3` is `True`, and `age >= 18` is `True` only when the value in age is 18 or more."},{"t":"example","title":"Asking questions","code":"age = 16\nprint(age >= 18)\nprint(age < 18)\nprint(age == 16)\nprint(age != 16)\nprint(10 <= 10)","output":"False\nTrue\nTrue\nFalse\nTrue","notes":["line 2: is 16 at least 18? No, so False","line 4: == asks: is the value in age 16? Yes, so True","line 5: != asks: is it different from 16? No, so False","line 6: <= includes the equal case, so 10 <= 10 is True"]},{"t":"tip","md":"**Slides vs Python:** the slides write \"not equal\" as `<>`. That's from the old Python 2. In today's Python, `5 <> 3` is a SyntaxError. Always write `!=`."},{"t":"mc","kind":"predict","q":"What does this print?","code":"x = 7\nprint(x != 7, x > 5)","options":["True False","False True","True True","7 7"],"answer":1,"why":"x is 7, so \"is x different from 7?\" is False, and \"is 7 bigger than 5?\" is True. Comparisons give back booleans, never the number itself."},{"t":"mc","kind":"bug","q":"The slides write \"not equal\" as `<>`. What happens if you type this in Python?","code":"print(5 <> 3)","options":["It prints True","It prints False","SyntaxError: in Python 3, not equal is written !=","It prints 5 <> 3"],"answer":2,"why":"`<>` was removed from Python long ago, so Python can't read the line and gives a SyntaxError. Write `5 != 3`, which prints True."},{"t":"text","md":"This is the classic beginner mix-up:\n\n- `=` **stores**: `age = 16` puts 16 in the box\n- `==` **compares**: `age == 16` asks \"is the value in age 16?\" and gives `True` or `False`\n\nA comparison's answer is a value like any other, so you can store it: `is_adult = age >= 18`. Python works out the right side first (False), then stores it.\n\nComparisons work on text too, and `==` is exact: `\"yes\" == \"Yes\"` is `False`. Text is never equal to a number: `\"19\" == 19` is `False`."},{"t":"example","title":"Checking a password","code":"secret = \"tacos123\"\nguess = input(\"guess the password: \")\ncorrect = guess == secret\nprint(\"correct:\", correct)\nprint(type(correct))","inputs":["Tacos123"],"notes":["line 3: Python works out guess == secret first, then stores the answer in correct","the user typed a capital T, so the texts aren't exactly the same, and correct is False","line 5: the answer of a comparison is a bool"]},{"t":"example","title":"Counting and comparing, like E01-10","code":"email = \"ana@@mail.com\"\nat_signs = email.count(\"@\")\nprint(\"@ signs:\", at_signs)\nprint(\"exactly one @:\", at_signs == 1)\nprint(\"at least one @:\", at_signs >= 1)","output":"@ signs: 2\nexactly one @: False\nat least one @: True","notes":["line 2: count() gives the number 2","line 4: == 1 asks for exactly one, so 2 gives False","line 5: >= 1 would accept 2, which is why E01-10 uses == 1"]},{"t":"tip","md":"**On the test:** a comparison always prints `True` or `False`, with a capital first letter, never yes or no. And whenever you see `=` or `==`, ask yourself: is this line storing, or asking?"},{"t":"mc","kind":"vocab","q":"What's the difference between `=` and `==`?","options":["= stores a value; == compares two values and gives True or False","They're the same; == is just easier to read","= is for numbers; == is for text","== stores the value twice, to be safe"],"answer":0,"why":"One `=` puts a value in a box. Two `==` ask whether two values are equal and answer True or False. Both work on numbers and on text. Mixing them up is the most common beginner mistake."},{"t":"mc","kind":"predict","q":"The program forgot `int()`, so age holds text. What does this print?","code":"age = \"19\"\nprint(age == 19)","options":["True","TypeError","19","False"],"answer":3,"why":"\"19\" is text and 19 is a number. Text is never equal to a number, so `==` says False, with no error. That's another reason to convert typed numbers with int()."},{"t":"mc","kind":"predict","q":"What does this print?","code":"score = 10\nwon = score >= 10\nprint(won)","options":["10","False","won","True"],"answer":3,"why":"Python works out the right side first: 10 >= 10 is True, because >= includes equal. That True is stored in won and printed. False would be the answer for `score > 10`."},{"t":"code","id":"d2-c-adult","task":"Ask for an age (a whole number). Print whether the person is an adult (18 or older), as True or False. Then print whether they are exactly 18. Example: `20` gives True, then False.","starter":"age = int(input(\"enter your age: \"))\n# print whether age is 18 or more\n\n# print whether age is exactly 18\n","tests":[{"inputs":["18"],"expect":["True"],"reject":["False"]},{"inputs":["12"],"expect":["False"],"reject":["True"]},{"inputs":["30"],"expect":["True","False"]}],"hints":["\"18 or older\" means greater than or equal to: `>=`.","\"Exactly 18\" uses two equal signs: `==`.","`print(\"adult:\", age >= 18)` and `print(\"exactly 18:\", age == 18)`."],"solution":"age = int(input(\"enter your age: \"))\nprint(\"adult:\", age >= 18)\nprint(\"exactly 18:\", age == 18)"},{"t":"code","id":"d2-c-secret","task":"Store the secret word `mango` in a variable. Ask the user to guess it, then print whether the guess is right, as True or False. Remember that the check is exact, so `Mango` is wrong.","starter":"secret = \"mango\"\n# ask for a guess\n\n# print True or False\n","tests":[{"inputs":["mango"],"expect":["True"],"reject":["False"]},{"inputs":["Mango"],"expect":["False"],"reject":["True"]},{"inputs":["melon"],"expect":["False"],"reject":["True"]}],"require":["=="],"hints":["Ask with input() and store the guess in its own variable.","Asking \"are these the same?\" uses `==`, not `=`.","`print(\"correct:\", guess == secret)`"],"solution":"secret = \"mango\"\nguess = input(\"guess the secret fruit: \")\nprint(\"correct:\", guess == secret)"},{"t":"explain","q":"Explain the difference between `age = 16` and `age == 16`. What does each one give you?","points":["= stores the value on the right in the variable","== compares two values and asks whether they're equal","A comparison always gives a bool: True or False","You can store a comparison's answer, like is_adult = age >= 18"],"model":"`age = 16` stores the number 16 in the box called age. It doesn't answer anything; it just changes the box. `age == 16` asks a question: is the value in age equal to 16? It gives back True or False and doesn't change age at all. Because the answer is a value, I can store it, like `is_adult = age >= 18`. In my email check I used `== 1` to ask if there was exactly one @."}]},{"id":"d2-logic","title":"and, or, not","minutes":30,"blocks":[{"t":"text","md":"Sometimes one question isn't enough. A teen ticket needs age 13 or more **and** age 19 or less. A discount is for students **or** people with a coupon. Python combines True/False answers with three **logical operators**:\n\n- `a and b` is True only when **both** sides are True\n- `a or b` is True when **at least one** side is True\n- `not a` flips it: `not True` is `False`, and `not False` is `True`\n\nThe result is always a bool."},{"t":"example","title":"Teen ticket and discount","code":"age = 15\nis_teen = age >= 13 and age <= 19\nprint(\"teen:\", is_teen)\nis_student = True\nhas_coupon = False\nprint(\"discount:\", is_student or has_coupon)\nprint(\"no coupon:\", not has_coupon)","output":"teen: True\ndiscount: True\nno coupon: True","notes":["line 2: both comparisons are True (15 >= 13 and 15 <= 19), so and gives True","line 6: or needs only one True side, and is_student is True","line 7: not flips False into True"]},{"t":"text","md":"A **truth table** lists every possible combination and its answer. With two True/False values there are only four combinations, so it's easy to learn by heart:\n\n- `and` is **strict**: it's True only for True and True. Every other row is False.\n- `or` is **relaxed**: it's False only for False or False. Every other row is True.\n\nRun the example below and check each line against those two rules."},{"t":"example","title":"The truth tables, printed by Python","code":"print(\"True and True =\", True and True)\nprint(\"True and False =\", True
