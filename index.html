      h += '<section class="stack"><div class="sethead"><h2>' + esc(s[1]) + '</h2><span class="sub">' + done + ' of ' + list.length + ' finished</span></div><div class="grid">' + list.map(exTile).join('') + '</div></section>';
    });
    var proj = DAY(8) && DAY(8).lessons.filter(function (l) { return /project/.test(l.id); });
    if (proj && proj.length) h += '<section class="stack"><div class="sethead"><h2>Module 1 project · Healthy Meal Tracker</h2></div><div class="grid">' + proj.map(function (l) { return '<a class="ex" href="#l-' + l.id + '"><span class="t">' + esc(l.title) + '</span><span class="sub">' + Math.round(lessonPct(l) * 100) + '%</span></a>'; }).join('') + '</div></section>';
    view.innerHTML = h + '</div>'; window.scrollTo(0, 0);
  }
  function renderEx(key) {
    var e = EXS[key]; if (!e) return renderGym();
    cur = { type: 'ex', key: key }; setNav('gym');
    var list = dayExercises(e.day), i = list.indexOf(e), next = list[i + 1];
    var h = '<div class="page"><div class="crumbs"><a href="#plan">Plan</a><span>›</span><a href="#day-' + e.day + '">Day ' + e.day + '</a><span>›</span><span>' + esc(e.set) + '</span></div>';
    h += '<div class="lesson-grid">' + sideHtml(e.day, null, key) + '<article class="lesson"><div class="lesson-head"><p class="eyebrow">Homework · ' + esc(e.set) + '</p><h1>' + esc(e.title) + '</h1>' + (e.ask ? '<p class="lede">' + inl(e.ask) + '</p>' : '') + '</div>';
    h += '<div id="pynote">' + pyNote() + '</div>';
    h += '<section class="blk" data-uid="x~' + esc(key) + '">' + itemHtml('x~' + key) + '</section>';
    if (e.uids.length > 1) {
      h += '<div class="stack"><h2>Do you really understand it?</h2><p class="sub">Questions like the ones on the test and in your 1-on-1.</p></div>';
      e.uids.slice(1).forEach(function (u) { h += '<section class="blk" data-uid="' + esc(u) + '">' + itemHtml(u) + '</section>'; });
    }
    h += askBox('ex:' + key);
    h += '<div class="row">' + (next ? '<a class="btn" href="#x-' + next.key + '">Next exercise: ' + esc(next.title) + ' →</a>' : '<a class="btn" href="#day-' + e.day + '">Back to Day ' + e.day + '</a>') + '</div>';
    view.innerHTML = h + '</article></div></div>'; fitEditors(); window.scrollTo(0, 0); warmPython();
  }

  function reviewList() {
    return Object.keys(ITEMS).filter(function (u) {
      if (u.indexOf('m~') === 0 && !(S.mock && S.mock.done)) return false;
      var s = status(u), it = ITEMS[u];
      if (it.kind === 'mc') { var a = S.mc[u]; return a && (a.choice != null ? !a.ok : a.first === false); }
      if (it.kind === 'code') { var c = S.code[u]; return c && !c.pass; }
      return s === 'no';
    });
  }
  function renderReview() {
    cur = { type: 'review' }; setNav('review');
    var list = reviewList();
    var h = '<div class="page"><div class="stack"><p class="eyebrow">Mistakes to fix</p><h1>' + (list.length ? 'Fix these and you\'ll remember them' : 'Nothing to fix yet') + '</h1><p class="lede">' + (list.length ? 'Everything you got wrong or didn\'t finish. Redo each one. Once you get it right, it leaves this list next time you open it.' : 'Questions you get wrong and tasks you don\'t finish show up here, so you can come back to them.') + '</p></div>';
    list.forEach(function (u) {
      var it = ITEMS[u];
      if (it.kind === 'mc') { var a = S.mc[u]; if (a && a.choice != null && !a.ok) { S.mc[u] = { choice: null, first: false }; } }
      h += '<div class="stack"><p class="sub">From: ' + (it.lesson ? '<a href="#l-' + it.lesson + '">' + esc(it.where) + '</a>' : it.ex ? '<a href="#x-' + it.ex + '">' + esc(it.where) + '</a>' : esc(it.where)) + '</p><section class="blk" data-uid="' + esc(u) + '">' + itemHtml(u) + '</section></div>';
    });
    view.innerHTML = h + '</div>'; fitEditors(); window.scrollTo(0, 0); if (list.length) warmPython();
  }

  var MOCKORDER = {}, HIDE_FEEDBACK = {};
  function renderMock() {
    cur = { type: 'mock' }; setNav('mock');
    var m = S.mock;
    if (!m || !m.ids) {
      var h = '<div class="page"><div class="stack"><p class="eyebrow">Practice test</p><h1>Test yourself like it\'s Nov 26</h1><p class="lede">Three parts, like the real test: multiple choice, writing code, and explaining code. Give yourself about 60 minutes and don\'t look at your notes. You see your score and every answer at the end.</p></div>';
      h += '<section class="tiles"><div class="tile"><span class="num">12</span><b>Multiple choice</b><span>What does it print, what does it mean, what\'s wrong.</span></div><div class="tile"><span class="num">3</span><b>Write the code</b><span>Checked by the same tests as your lessons.</span></div><div class="tile"><span class="num">2</span><b>Explain it</b><span>Answer like you would in your 1-on-1.</span></div></section>';
      h += '<div class="row"><button class="btn" data-act="mock-start">Start the practice test</button></div>';
      if (S.mockHistory && S.mockHistory.length) h += '<p class="sub">Earlier scores: ' + S.mockHistory.map(function (x) { return x + '%'; }).join(', ') + '</p>';
      view.innerHTML = h + '</div>'; window.scrollTo(0, 0); return;
    }
    m.ids.forEach(function (u) { if (ITEMS[u] && ITEMS[u].kind === 'mc') { MOCKORDER[u] = m.order[u] || [0, 1, 2, 3]; HIDE_FEEDBACK[u] = !m.done; } });
    var h2 = '<div class="page"><div class="stack"><p class="eyebrow">Practice test' + (m.done ? ' · finished' : ' · in progress') + '</p><h1>' + (m.done ? 'Your result' : 'Answer every question, then finish') + '</h1></div>';
    if (m.done) {
      h2 += '<section class="card"><div class="score"><div class="ring" style="--p:' + m.score + '"><div>' + m.score + '%</div></div><div class="stack" style="gap:6px"><h2>' + (m.score >= 85 ? 'You\'re ready.' : m.score >= 60 ? 'Good, with gaps to fix.' : 'Worth another round after review.') + '</h2><p class="lede">' + esc(m.summary) + '</p><div class="row"><a class="btn" href="#review">Fix my mistakes</a><button class="btn ghost" data-act="mock-new">Take a new practice test</button></div></div></div></section>';
    }
    var parts = [['mc', 'Part 1 · Multiple choice'], ['code', 'Part 2 · Write the code'], ['explain', 'Part 3 · Explain it']];
    parts.forEach(function (p) {
      var ids = m.ids.filter(function (u) { return ITEMS[u] && ITEMS[u].kind === p[0]; });
      h2 += '<section class="stack"><div class="section-h"><h2>' + p[1] + '</h2><span class="sub">' + ids.length + ' questions</span></div>';
      ids.forEach(function (u) { h2 += '<section class="blk" data-uid="' + esc(u) + '">' + itemHtml(u) + '</section>'; });
      h2 += '</section>';
    });
    if (!m.done) h2 += '<div class="card"><p class="sub">When you\'ve done every part, finish to see your score and the right answers.</p><div class="row"><button class="btn" data-act="mock-finish">Finish and score</button></div></div>';
    view.innerHTML = h2 + '</div>'; fitEditors(); window.scrollTo(0, 0); warmPython();
  }
  function mockStart() {
    var mcPool = shuffle(MOCK.mc.map(function (_, i) { return 'm~mc~' + i; })).slice(0, 8);
    var bankMc = shuffle(Object.keys(ITEMS).filter(function (u) { return u.indexOf('b~') === 0 && ITEMS[u].kind === 'mc'; })).slice(0, 12 - mcPool.length);
    var mc = shuffle(mcPool.concat(bankMc));
    var code = shuffle(MOCK.code.map(function (_, i) { return 'm~code~' + i; })).slice(0, 3);
    var ex = shuffle(MOCK.explain.map(function (_, i) { return 'm~ex~' + i; })).slice(0, 2);
    var order = {}; mc.forEach(function (u) { order[u] = shuffle([0, 1, 2, 3]); });
    // fresh answers for the test items
    mc.forEach(function (u) { delete S.mc[u]; }); code.forEach(function (u) { delete S.code[u]; delete DRAFTS[u]; delete RT[u]; }); ex.forEach(function (u) { delete S.ex[u]; });
    S.mock = { ids: mc.concat(code, ex), order: order, done: false, started: Date.now() };
    save(); renderMock();
  }
  function mockFinish() {
    var m = S.mock, mcN = 0, mcOk = 0, cN = 0, cOk = 0, eN = 0, eSum = 0;
    // check any code not yet checked: count only passed
    m.ids.forEach(function (u) {
      var it = ITEMS[u];
      if (it.kind === 'mc') { mcN++; var a = S.mc[u]; if (a && a.ok && a.first !== false) mcOk++; }
      else if (it.kind === 'code') { cN++; var c = S.code[u]; if (c && c.pass && !c.help) cOk++; }
      else { eN++; var x = S.ex[u]; if (x && x.cov) eSum += x.cov.filter(Boolean).length / ((it.d.points || []).length || 1); }
    });
    var score = Math.round((mcOk / Math.max(mcN, 1)) * 50 + (cOk / Math.max(cN, 1)) * 35 + (eSum / Math.max(eN, 1)) * 15);
    m.done = true; m.score = score;
    m.summary = 'Multiple choice: ' + mcOk + ' of ' + mcN + ' right. Code: ' + cOk + ' of ' + cN + ' passed without help. Explaining: ' + Math.round(eSum / Math.max(eN, 1) * 100) + '% of the key points.';
    S.mockHistory = (S.mockHistory || []).concat(score).slice(-6);
    save(); renderMock();
  }

  // ───────────────────────── router
  function route() {
    countdown();
    var h = (location.hash || '').replace('#', '');
    if (!h || h === 'plan') return renderPlan();
    var m;
    if ((m = /^day-(\d)$/.exec(h))) return renderDay(Number(m[1]));
    if ((m = /^l-(.+)$/.exec(h))) return renderLesson(m[1]);
    if ((m = /^x-(.+)$/.exec(h))) return renderEx(m[1]);
    if (h === 'project') return renderProject();
    if (h === 'gym') return renderGym();
    if (h === 'review') return renderReview();
    if (h === 'mock') return renderMock();
    renderPlan();
  }
  window.addEventListener('hashchange', route);

  // ───────────────────────── events
  view.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    var act = t.dataset.act, uid = itemOf(t);
    if (act === 'mc') {
      var q = ITEMS[uid].d, oi = Number(t.dataset.opt), prev = S.mc[uid] || {};
      var ok = oi === q.answer;
      S.mc[uid] = { choice: oi, ok: ok, first: prev.first === false ? false : (ok ? true : false) };
      if (!ok) S.mc[uid].first = false;
      save(); rerender(uid); return;
    }
    if (act === 'mc-retry') { S.mc[uid] = { choice: null, first: false }; save(); rerender(uid); return; }
    if (act === 'carry-load') { var cd = carryOf(ITEMS[uid].d); if (cd != null) { DRAFTS[uid] = cd; save(); rerender(uid); } return; }
    if (act === 'run') return doRun(uid);
    if (act === 'check') return doCheck(uid);
    if (act === 'hint') return doHint(uid);
    if (act === 'solution') return doSolution(uid);
    if (act === 'ask-hint') return askHint(uid);
    if (act === 'ex-claude') return exClaude(uid);
    if (act === 'ex-self') return exSelf(uid);
    if (act === 'stop') { if (AI[uid] && AI[uid].ctl) AI[uid].ctl.abort(); return; }
    if (act === 'ex-run' || act === 'ex-edit' || act === 'ex-reset') {
      var b = findExample(uid), st = EXRUN[uid] || (EXRUN[uid] = {});
      if (act === 'ex-edit') { st.editing = true; st.src = b.code; return rerender(uid); }
      if (act === 'ex-reset') { st.editing = false; st.src = null; st.r = null; return rerender(uid); }
      var src = st.editing ? (codeOf(uid) || b.code) : b.code; if (st.editing) st.src = src;
      st.busy = true; rerender(uid);
      runPy(src, b.inputs || []).then(function (r) { st.busy = false; st.r = r; rerender(uid); });
      return;
    }
    if (act === 'mock-start' || act === 'mock-new') return mockStart();
    if (act === 'mock-finish') return mockFinish();
  });
  view.addEventListener('submit', function (e) {
    var f = e.target.closest('[data-role="askform"]'); if (!f) return;
    e.preventDefault();
    var key = f.closest('[data-ask]').dataset.ask, q = f.querySelector('[data-role="askq"]').value;
    doAsk(key, q);
  });
  view.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.role === 'pt') {
      var uid = itemOf(t), a = S.ex[uid]; if (!a || a.mode !== 'self') return;
      a.cov[Number(t.dataset.pt)] = t.checked; save(); refreshSide();
    }
  });
  var draftTimer = null;
  view.addEventListener('input', function (e) {
    var t = e.target;
    if (t.classList.contains('src')) {
      fitEditors(t.closest('.editor').parentNode);
      var uid = itemOf(t);
      if (uid && ITEMS[uid]) { DRAFTS[uid] = t.value; clearTimeout(draftTimer); draftTimer = setTimeout(function () { try { localStorage.setItem(LKEY, JSON.stringify({ S: S, drafts: DRAFTS })); } catch (x) {} }, 600); }
      else if (uid && EXRUN[uid]) EXRUN[uid].src = t.value;
    }
    if (t.dataset && t.dataset.role === 'inputs') { var u2 = itemOf(t); (RT[u2] || (RT[u2] = { hints: 0 })).inputs = t.value; }
    if (t.dataset && t.dataset.role === 'answer') { var u3 = itemOf(t); var a = S.ex[u3] = S.ex[u3] || {}; a.text = t.value; clearTimeout(draftTimer); draftTimer = setTimeout(save, 800); }
  });
  // editor keys: Tab indents, Enter keeps indentation (and adds 4 after a colon), Cmd/Ctrl+Enter runs
  view.addEventListener('keydown', function (e) {
    var t = e.target; if (!t.classList || !t.classList.contains('src')) return;
    var v = t.value, s = t.selectionStart, en = t.selectionEnd;
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); var uid = itemOf(t); if (ITEMS[uid]) doRun(uid); else { var b = t.closest('[data-uid]').querySelector('[data-act="ex-run"]'); if (b) b.click(); } return; }
    if (e.key === 'Tab') {
      e.preventDefault();
      var ls = v.lastIndexOf('\n', s - 1) + 1;
      if (e.shiftKey) {
        var lineStart = ls, rm = Math.min(4, (v.slice(lineStart).match(/^ */) || [''])[0].length);
        if (rm) { t.setRangeText('', lineStart, lineStart + rm, 'end'); t.setSelectionRange(Math.max(lineStart, s - rm), Math.max(lineStart, en - rm)); }
      } else if (s !== en && v.slice(s, en).indexOf('\n') > -1) {
        var block = v.slice(ls, en).replace(/^/gm, '    '); t.setRangeText(block, ls, en, 'select');
      } else t.setRangeText('    ', s, en, 'end');
      t.dispatchEvent(new Event('input', { bubbles: true })); return;
    }
    if (e.key === 'Enter' && !e.shiftKey) {
      var lineS = v.lastIndexOf('\n', s - 1) + 1, line = v.slice(lineS, s), ind = (line.match(/^ */) || [''])[0];
      if (/:\s*(#.*)?$/.test(line)) ind += '    ';
      e.preventDefault(); t.setRangeText('\n' + ind, s, en, 'end'); t.dispatchEvent(new Event('input', { bubbles: true }));
    }
  });

  // ───────────────────────── start
  route();
  initDb();
  if ('requestIdleCallback' in window) requestIdleCallback(function () { warmPython(); }); else setTimeout(warmPython, 1500);
  window.__sprint = { COURSE: COURSE, ITEMS: ITEMS, S: function () { return S; }, runPy: runPy, PY: PY, LESSONS: LESSONS, EXS: EXS };
})();
</script>
