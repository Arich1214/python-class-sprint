 and False)\nprint(\"False and True =\", False and True)\nprint(\"False and False =\", False and False)\nprint(\"True or True =\", True or True)\nprint(\"True or False =\", True or False)\nprint(\"False or True =\", False or True)\nprint(\"False or False =\", False or False)\nprint(\"not True =\", not True)\nprint(\"not False =\", not False)","output":"True and True = True\nTrue and False = False\nFalse and True = False\nFalse and False = False\nTrue or True = True\nTrue or False = True\nFalse or True = True\nFalse or False = False\nnot True = False\nnot False = True","notes":["lines 1-4: and is True only on line 1, where both sides are True","lines 5-8: or is False only on line 8, where both sides are False","lines 9-10: not flips the value"]},{"t":"tip","md":"**Slides vs Python:** the slides' truth tables use `&` for and, `|` for or, and `~` for not. In Python code, write the words `and`, `or` and `not`. The symbols do other jobs in Python: `~True` doesn't give False, it gives a strange number."},{"t":"mc","kind":"predict","q":"What does this print?","code":"print(True and False, True or False)","options":["True True","False False","True False","False True"],"answer":3,"why":"`and` needs both sides True, so True and False is False. `or` needs only one, so True or False is True. The comma prints them with a space between."},{"t":"mc","kind":"what","q":"`rain = False` and `snow = True`. Which expression is True?","options":["rain and snow","not snow","rain or snow","not rain and not snow"],"answer":2,"why":"or needs only one True side, and snow is True. `rain and snow` needs both. `not snow` is False, and in the last one `not snow` is False, so the whole and is False."},{"t":"text","md":"Python works out each comparison first, then the `and` or `or`. With age 25, `age >= 13 and age <= 19` becomes `True and False`, which is `False`.\n\nEach side must be a **complete comparison**. `age >= 13 and <= 19` is a SyntaxError, because `<= 19` on its own doesn't say what is being compared.\n\nWhen you mix them, `not` goes first, then `and`, then `or`. Brackets make your meaning clear: `(a or b) and c`."},{"t":"example","title":"Turning typed text into a bool, like E01-11","code":"ticket = input(\"do you have a ticket? type True or False: \") == \"True\"\nage = int(input(\"enter your age: \"))\ncan_enter = ticket and age >= 12\nprint(\"can enter:\", can_enter)","inputs":["True","10"],"notes":["line 1: input() gives the text \"True\". Comparing it with == \"True\" turns it into the real bool True","line 3: ticket is True, but 10 >= 12 is False, so and gives False","try it with an age of 15: then both sides are True"]},{"t":"tip","md":"**Watch out:** `bool(\"False\")` is `True`! `bool()` turns any text that isn't empty into True. To turn a typed True or False into a real bool, compare it: `input(...) == \"True\"`. That's how E01-11 does it."},{"t":"mc","kind":"predict","q":"What does this print?","code":"age = 25\nprint(age >= 13 and age <= 19)","options":["False","True","25","SyntaxError"],"answer":0,"why":"25 >= 13 is True, but 25 <= 19 is False. `and` needs both sides to be True, so the answer is False: 25 isn't a teen age."},{"t":"mc","kind":"predict","q":"What does this print?","code":"x = 5\nprint(not x > 3)","options":["True","-5","False","SyntaxError"],"answer":2,"why":"Python works out the comparison first: 5 > 3 is True. Then not flips it to False. not doesn't change the number in x."},{"t":"mc","kind":"bug","q":"What happens when you run this?","code":"age = 15\nprint(age >= 13 and <= 19)","options":["It prints True","SyntaxError: each side of and needs a full comparison","It prints False","It prints 15"],"answer":1,"why":"`<= 19` on its own doesn't say what is compared with 19, so Python can't read the line. Write the variable on both sides: `age >= 13 and age <= 19`."},{"t":"code","id":"d2-c-teen","task":"Ask for an age (a whole number) and print whether it's a teen age, from 13 to 19 with both included, as True or False. Use `and` to join two comparisons. Example: `13` gives True and `20` gives False.","starter":"age = int(input(\"enter your age: \"))\n# print True if age is from 13 to 19\n","tests":[{"inputs":["13"],"expect":["True"],"reject":["False"]},{"inputs":["19"],"expect":["True"],"reject":["False"]},{"inputs":["20"],"expect":["False"],"reject":["True"]},{"inputs":["12"],"expect":["False"],"reject":["True"]}],"require":["and"],"hints":["You need two questions: is the age at least 13? Is the age at most 19?","\"At least\" is `>=` and \"at most\" is `<=`, so 13 and 19 are included.","`print(\"teen:\", age >= 13 and age <= 19)`"],"solution":"age = int(input(\"enter your age: \"))\nprint(\"teen:\", age >= 13 and age <= 19)"},{"t":"code","id":"d2-c-wet","task":"Ask two questions that the user answers with True or False: `is it raining?` and `do you have an umbrella?`. Turn each answer into a real boolean by comparing it with `== \"True\"`. Then print `wet:` and whether you'll get wet: it's raining and you do not have an umbrella.","starter":"raining = input(\"is it raining? (True or False): \") == \"True\"\n# ask about the umbrella the same way\n\n# print wet: and the answer\n","tests":[{"inputs":["True","False"],"expect":["wet: True"]},{"inputs":["True","True"],"expect":["wet: False"]},{"inputs":["False","False"],"expect":["wet: False"]}],"require":["not"],"hints":["Ask the umbrella question just like the rain question, with `== \"True\"` at the end.","You get wet when it's raining and you have no umbrella. \"No umbrella\" is `not umbrella`.","`print(\"wet:\", raining and not umbrella)`"],"solution":"raining = input(\"is it raining? (True or False): \") == \"True\"\numbrella = input(\"do you have an umbrella? (True or False): \") == \"True\"\nprint(\"wet:\", raining and not umbrella)"},{"t":"explain","q":"Explain what `and`, `or` and `not` do. Give a real-life example for each.","points":["and is True only if both sides are True","or is True if at least one side is True","not flips True to False and False to True","Each side must be a full comparison, like age >= 13 and age <= 19","In Python you write and, or, not, not the slides' & | ~"],"model":"`and` is strict: it's True only when both sides are True. A teen ticket is `age >= 13 and age <= 19`, and both parts must be true. `or` is relaxed: it's True when at least one side is True, like a discount for students or people with a coupon. `not` flips a value: if has_coupon is False, `not has_coupon` is True. The slides write these as & | ~, but in Python I write the words and, or, not."}]}]},{"day":3,"title":"Making decisions with if","goal":"By the end of today you can make a program choose what to do with if, elif and else, and combine conditions with and, or and not.","lessons":[{"id":"d3-if","title":"if and else: choosing between two roads","minutes":25,"blocks":[{"t":"text","md":"Until now, your programs ran every line, top to bottom, every time. Real programs need to **choose**. A game checks if you have enough coins. A shop checks if you are old enough.\n\nAn `if` statement lets your program ask a yes-or-no question and run some lines **only when the answer is yes**.\n\nThe question is called the **condition**. It is a comparison that comes out as `True` or `False`, like `age >= 18` or `answer == \"yes\"`. You already know these comparisons: `==`, `!=`, `<`, `>`, `<=` and `>=`."},{"t":"text","md":"Here is how an `if` is built:\n\n- the word `if`\n- the condition, like `age >= 18`\n- a colon `:` at the end of the line\n- below it, the lines that should only run when the condition is True, pushed in by **4 spaces**\n\nThose 4 spaces are called **indentation**. They are how Python knows which lines belong to the `if`. Indented lines are inside. The first line that goes back to the left edge is outside: it runs for everyone, after the `if` is finished."},{"t":"example","title":"only adults see the voting message","code":"age = int(input(\"enter your age: \"))\nif age >= 18:\n    print(\"you can vote.\")\n    print(\"don't forget your id card.\")\nprint(\"thanks for using the app.\")","inputs":["20"],"notes":["line 1: input() gives text, so int() turns it into a whole number we can compare.","line 2: the condition `age >= 18` is True for 20. The colon starts the block.","lines 3-4: indented, so they belong to the if. They only run because the condition is True.","line 5: back at the left edge, so it is not part of the if. It runs for every age. If you typed 15, only this line would print."]},{"t":"text","md":"Often you want one thing to happen when the condition is True, and **something else** when it is False. That is what `else` is for.\n\n`else:` has no condition of its own. It simply means \"in every other case\". It sits at the same level as the `if` (not indented), ends with a colon, and its own lines are indented under it.\n\nWith an `if` and an `else`, exactly **one** of the two blocks runs. Never both, and never neither."},{"t":"example","title":"pass or fail","code":"score = int(input(\"enter your test score: \"))\nif score >= 55:\n    print(\"you passed!\")\nelse:\n    print(\"not this time. you need 55 to pass.\")\nprint(\"your score was\", score)","inputs":["48"],"notes":["line 2: 48 >= 55 is False, so Python skips the block under the if.","line 4: else catches every case the if did not, so its block runs.","line 6: back at the left edge, so it runs after the if/else, whatever the score was."]},{"t":"mc","kind":"predict","q":"This one is from your slides. What does it print?","code":"x = 5\nif x > 10:\n    print(\"big\")\nelse:\n    print(\"small\")","options":["big","small","big, then small on the next line","nothing, because 5 is not bigger than 10"],"answer":1,"why":"`5 > 10` is False, so the `if` block is skipped and the `else` block runs: small. It is never both. And with an else it is never nothing: when the if is False, the else always runs."},{"t":"tip","md":"**Watch out:** three classic mistakes with `if`:\n\n- no colon at the end: `if age >= 18` gives a SyntaxError\n- one `=` instead of two: `if age = 18:` gives a SyntaxError. One `=` stores a value, two `==` compare\n- no indentation under the `if`: you get an **IndentationError**, which means \"the spaces at the start of a line are wrong\""},{"t":"example","title":"an IndentationError","code":"temperature = 30\nif temperature > 25:\nprint(\"it is hot today.\")","error":true,"notes":["line 2: the colon promises an indented block on the next line.","line 3: but this line is at the left edge. Python stops before running anything and shows IndentationError: expected an indented block.","the fix: put 4 spaces in front of line 3. In VS Code, the Tab key does that for you."]},{"t":"mc","kind":"bug","q":"Mia has only $3, but this program still talks about pizza. What does it print?","code":"money = 3\nif money >= 5:\n    print(\"you buy a slice of pizza.\")\nprint(\"enjoy your pizza!\")","options":["nothing at all","you buy a slice of pizza.","enjoy your pizza!","you buy a slice of pizza. and then enjoy your pizza!"],"answer":2,"why":"`3 >= 5` is False, so the indented line is skipped. But the last line is not indented, so it is not part of the `if`: it runs for everyone. Indent it by 4 spaces and it would only run for people who can pay."},{"t":"mc","kind":"vocab","q":"What do the 4 spaces in front of a line under an `if` tell Python?","options":["Nothing. They only make the code look neat","The line runs 4 times","The line is a comment that Python skips","The line belongs to the if and only runs when the condition is True"],"answer":3,"why":"In Python, indentation is part of the code, not decoration. It groups lines into the block of the `if`. In some other languages spaces don't matter, but in Python they do."},{"t":"mc","kind":"why","q":"Why is `else` written without a condition, like `else:` and not `else score < 55:`?","options":["else means \"every other case\", so it doesn't need its own question","else can only be used with numbers","Conditions after else are allowed, they are just slower","It's a style choice. Both versions work"],"answer":0,"why":"else catches everything the if did not catch, so a condition would add nothing. In fact `else score < 55:` is a SyntaxError. If you need a second question, that's what `elif` is for: the next lesson."},{"t":"code","id":"d3-c-jacket","task":"Ask for the temperature as a whole number. If it is 20 or more, print `wear a t-shirt`. Otherwise print `bring a jacket`.\n\nExample run: you type `14`, and it prints `bring a jacket`.","starter":"temperature = int(input(\"enter the temperature: \"))\n# write your if and else below\n","tests":[{"inputs":["25"],"expect":["t-shirt"],"reject":["jacket"]},{"inputs":["20"],"expect":["t-shirt"],"reject":["jacket"]},{"inputs":["12"],"expect":["jacket"],"reject":["t-shirt"]}],"require":["if","else"],"hints":["Your condition compares `temperature` with 20. Which sign means \"20 or more\"?","It's `>=`, so the line is `if temperature >= 20:`. Don't forget the colon at the end.","Indent the t-shirt print under the if. Then write `else:` at the left edge, and indent the jacket print under it."],"solution":"temperature = int(input(\"enter the temperature: \"))\nif temperature >= 20:\n    print(\"wear a t-shirt\")\nelse:\n    print(\"bring a jacket\")"},{"t":"code","id":"d3-c-secret","task":"Ask the user for the secret word. If they type `banana`, print `the door opens.` Otherwise print `the door stays shut.`\n\nPython compares text exactly, so `Banana` with a capital B counts as a different word, and the door stays shut.","starter":"# ask for the secret word and store it in a variable\n","tests":[{"inputs":["banana"],"expect":["opens"],"reject":["shut"]},{"inputs":["apple"],"expect":["shut"],"reject":["opens"]},{"inputs":["Banana"],"expect":["shut"],"reject":["opens"]}],"require":["if","else","=="],"hints":["First store the answer: `word = input(\"say the secret word: \")`. No int() here, because the answer is text.","Compare text with `==`, and put the text in quotes, like `\"banana\"`.","`if word == \"banana\":` with the opens message indented under it, then `else:` with the shut message."],"solution":"word = input(\"say the secret word: \")\nif word == \"banana\":\n    print(\"the door opens.\")\nelse:\n    print(\"the door stays shut.\")"},{"t":"explain","q":"Explain to your teacher what the colon and the indentation do in an if/else.","points":["the colon at the end of the if line starts the block that belongs to the if","the indented lines only run when the condition is True","the first line back at the left edge is outside the if and runs for everyone","else has no condition and runs when the condition is False, so exactly one block runs","wrong indentation gives an IndentationError, or quietly changes what the program does"],"model":"The if line ends with a colon, and that colon says: the block starts here. The lines under it are indented by 4 spaces, and that's how Python knows they belong to the if. They only run when the condition is True. The first line that goes back to the left edge is not part of the if anymore, so it runs for everyone. The else also ends with a colon and has its own indented block, which runs when the condition is False, so exactly one of the two blocks runs. If I forget to indent, Python gives an IndentationError."}]},{"id":"d3-elif","title":"elif: more than two roads","minutes":25,"blocks":[{"t":"text","md":"An `if` with an `else` gives you two roads. But many questions have more than two answers. A score can be excellent, good, a pass or a fail. A ticket can cost $5, $8 or $12.\n\nFor that you use `elif`, short for **else if**. You can put as many `elif` lines as you need between the `if` and the `else`:\n\n- `if` asks the first question\n- each `elif` asks the next question, but only when every question above it was False\n- `else` (optional) catches whatever is left\n\nEach part, with its indented block, is called a **branch**."},{"t":"text","md":"Here is the most important rule of the whole lesson: Python checks the conditions **from top to bottom**, and runs **only the first branch whose condition is True**. Then it jumps past the whole chain, without checking the rest.\n\nSo even if a later condition would also be True, it never gets a chance. That is why the **order** of your checks matters so much."},{"t":"example","title":"from a score to a grade","code":"score = int(input(\"enter your score (0-100): \"))\nif score >= 90:\n    print(\"excellent\")\nelif score >= 70:\n    print(\"good\")\nelif score >= 55:\n    print(\"pass\")\nelse:\n    print(\"fail\")\nprint(\"done\")","inputs":["85"],"notes":["line 2: 85 >= 90 is False, so Python moves on to the next check.","line 4: 85 >= 70 is True, so it prints good...","...and skips the rest of the chain, even though 85 >= 55 is also True.","line 10: back at the left edge, after the chain, so it always runs."]},{"t":"example","title":"the same checks in the wrong order","code":"score = 95\nif score >= 55:\n    print(\"pass\")\nelif score >= 70:\n    print(\"good\")\nelif score >= 90:\n    print(\"excellent\")","output":"pass","notes":["line 2: 95 >= 55 is True, so this branch wins and prints pass.","lines 4 and 6 are never even checked. A 95 should be excellent, but the broad check grabbed it first.","the fix: with >= checks, start at the highest number and work down."]},{"t":"mc","kind":"predict","q":"A cinema uses this chain. What is printed for a 65-year-old?","code":"age = 65\nif age < 12:\n    print(\"child: $5\")\nelif age < 65:\n    print(\"adult: $12\")\nelse:\n    print(\"senior: $8\")","options":["child: $5","adult: $12","adult: $12 and then senior: $8","senior: $8"],"answer":3,"why":"65 < 12 is False. 65 < 65 is also False, because 65 is not smaller than itself. Nothing matched, so else runs: senior: $8. It can't print two lines, because a chain runs only one branch."},{"t":"text","md":"The `else` at the end is your **catch-all**: it runs when none of the conditions above matched. It's very handy for answers you did not expect, like a typo or a month 13.\n\nThe `else` is optional. But without it, a chain where nothing is True simply prints nothing, and the user is left wondering what happened.\n\nA chain always has exactly one `if` at the top, any number of `elif`s, and at most one `else` at the bottom."},{"t":"example","title":"a drinks menu with a catch-all","code":"choice = input(\"pick a drink (tea, coffee or juice): \")\nif choice == \"tea\":\n    print(\"one tea, that is $2.\")\nelif choice == \"coffee\":\n    print(\"one coffee, that is $3.\")\nelif choice == \"juice\":\n    print(\"one juice, that is $4.\")\nelse:\n    print(\"sorry, we don't have that.\")","inputs":["milkshake"],"notes":["lines 2, 4 and 6: three checks, and milkshake matches none of them.","line 8: else catches it, so the user gets a clear answer instead of silence.","text must match exactly: Tea with a capital T would also land in the else."]},{"t":"mc","kind":"bug","q":"Someone wrote two separate ifs instead of one if/elif chain. What is printed?","code":"score = 95\nif score >= 90:\n    print(\"excellent\")\nif score >= 70:\n    print(\"good\")\nelse:\n    print(\"fail\")","options":["excellent","excellent, then good","excellent, then fail","good"],"answer":1,"why":"Two separate ifs are two separate questions, and both are True for 95. The else belongs only to the second if. With elif instead of the second if, only excellent would print."},{"t":"mc","kind":"vocab","q":"What does `elif` mean?","options":["\"else if\": check this only when all the conditions above were False","\"end if\": it closes the if block","\"else loop if\": repeat the check until it is True","It's another way to write else, so it never has a condition"],"answer":0,"why":"elif is short for else if. It has its own condition, and it is only checked when everything above it was False. It doesn't close or repeat anything."},{"t":"mc","kind":"why","q":"A grade chain uses `>=` checks. Why must `score >= 90` come before `score >= 55`?","options":["Python reads elif lines from the bottom up","Bigger numbers must always be written first in Python","A 95 also passes `score >= 55`, and the first True branch wins","So the program runs faster"],"answer":2,"why":"Python stops at the first True condition. If `score >= 55` came first, every score from 55 up would land there, and excellent could never print. It is about meaning, not speed, and Python always reads top to bottom."},{"t":"tip","md":"**Watch out:** `elif` and `else` must line up exactly under their `if`. And `else` never gets a condition: `else score < 55:` is a SyntaxError. If you need a condition, write `elif`."},{"t":"tip","md":"**On the test:** for a \"what does this print\" question with a chain, write True or False next to each condition, starting at the top. Stop at the **first** True: that branch runs, and nothing else in the chain does. If none is True, the `else` runs, or nothing at all if there is no `else`."},{"t":"code","id":"d3-c-greeting","task":"Ask for the hour of the day as a number from 0 to 23. Print `good morning` before 12, `good afternoon` from 12 until 17, and `good evening` from 18 on.\n\nExample run: you type `14`, and it prints `good afternoon`.","starter":"hour = int(input(\"enter the hour (0-23): \"))\n","tests":[{"inputs":["9"],"expect":["morning"],"reject":["afternoon","evening"]},{"inputs":["12"],"expect":["afternoon"],"reject":["morning","evening"]},{"inputs":["21"],"expect":["evening"],"reject":["morning","afternoon"]}],"require":["elif","else"],"hints":["You need three roads, so the shape is `if` ... `elif` ... `else`.","Start with the smallest hours: `if hour < 12:` for the morning. The next check is only reached by hours from 12 up.","So the afternoon check can simply be `elif hour < 18:`, and `else:` takes everything from 18 on."],"solution":"hour = int(input(\"enter the hour (0-23): \"))\nif hour < 12:\n    print(\"good morning\")\nelif hour < 18:\n    print(\"good afternoon\")\nelse:\n    print(\"good evening\")"},{"t":"code","id":"d3-c-medal","task":"In a game, your points win you a medal: 500 or more is `gold`, 100 to 499 is `silver`, and under 100 is `bronze`. Ask for the points and print the medal.\n\nExample run: you type `100`, and it prints `silver`.","starter":"points = int(input(\"enter your points: \"))\n","tests":[{"inputs":["750"],"expect":["gold"],"reject":["silver","bronze"]},{"inputs":["100"],"expect":["silver"],"reject":["gold","bronze"]},{"inputs":["50"],"expect":["bronze"],"reject":["gold","silver"]}],"require":["elif"],"hints":["Which medal needs the most points? Check that one first.","`if points >= 500:` for gold. The elif below it is only reached by scores under 500.","What's left after gold and silver is bronze, so it doesn't need a condition."],"solution":"points = int(input(\"enter your points: \"))\nif points >= 500:\n    print(\"gold\")\nelif points >= 100:\n    print(\"silver\")\nelse:\n    print(\"bronze\")"},{"t":"explain","q":"Explain why the order of the checks in an if/elif/else chain matters. Use an example.","points":["Python checks the conditions from top to bottom","only the first branch whose condition is True runs; the rest are skipped","a broad check placed too early catches values meant for a later branch","a concrete example, like 95 being called pass when `score >= 55` comes first","else catches everything that no condition matched"],"model":"Python checks an if/elif chain from the top down, and it only runs the first branch that is True. After that it skips the rest of the chain. So if I put a broad check first, like score >= 55, a score of 95 lands there and prints pass, and the excellent line is never reached. That's why with >= checks I start at the highest number and go down. At the end, else catches anything that none of the conditions matched."}]},{"id":"d3-nested","title":"and, or, not, and an if inside an if","minutes":30,"blocks":[{"t":"text","md":"Sometimes one question is not enough. To drive, you must be 18 **and** have a license. You get a discount if you are a student **or** a senior. Python has three words for combining conditions:\n\n- `and`: True only when **both** sides are True\n- `or`: True when **at least one** side is True\n- `not`: flips True to False, and False to True\n\nYou put them between full comparisons: `age >= 18 and has_license == \"yes\"`."},{"t":"tip","md":"**Slides vs Python:** the truth tables in your slides use `&` for and, `|` for or and `~` for not, and write \"not equal\" as `<>`. That is math notation. In your Python code, always write the words `and`, `or`, `not`, and `!=` for not equal."},{"t":"text","md":"Two things to get right.\n\n**Write the full comparison on both sides.** `day == \"saturday\" or \"sunday\"` sounds fine in English, but Python reads `\"sunday\"` on its own as a condition, and any text that isn't empty counts as True. So the whole thing is always True. Write `day == \"saturday\" or day == \"sunday\"`. The same goes for a range: `age >= 13 and age <= 19`.\n\n**Use `%` for even and odd.** `%` gives the remainder after dividing. `7 % 2` is 1 and `8 % 2` is 0. So `number % 2 == 0` means \"divides evenly by 2\", which means even."},{"t":"example","title":"remainders, and, or","code":"number = 12\nprint(number % 2)\nprint(number % 5)\nprint(number % 2 == 0 and number % 5 == 0)\nprint(number % 2 == 0 or number % 5 == 0)","output":"0\n2\nFalse\nTrue","notes":["line 2: 12 divided by 2 is 6 with nothing left over, so the remainder is 0. That means 12 is even.","line 3: 12 divided by 5 is 2, with 2 left over, so % gives 2.","line 4: and needs both sides True. 12 % 5 == 0 is False, so the whole thing is False.","line 5: or needs just one True side. 12 % 2 == 0 is True, so it prints True."]},{"t":"text","md":"You can also put an `if` **inside** another `if`. This is called a **nested if**. The inner `if` is only checked when the outer condition is True, and its lines get 4 more spaces.\n\nUse it when the second question only makes sense after the first answer. A ride first checks your age. Only if you are old enough does it bother to ask for your height."},{"t":"example","title":"a roller coaster checks age, then height","code":"age = int(input(\"enter your age: \"))\nif age >= 12:\n    height = int(input(\"enter your height in cm: \"))\n    if height >= 140:\n        print(\"you can ride the roller coaster!\")\n    else:\n        print(\"sorry, you are not tall enough yet.\")\nelse:\n    print(\"sorry, you are too young for this ride.\")","inputs":["14","132"],"notes":["line 2: 14 >= 12 is True, so we go inside and ask for the height.","line 4: the inner if, indented 4 more spaces. 132 >= 140 is False...","line 6: ...so the inner else runs. It lines up with the inner if.","line 8: this else lines up with the outer if. It's for kids under 12, who are never asked their height."]},{"t":"text","md":"Now a famous rule that puts it all together. A year is a **leap year** (366 days) when:\n\n- it divides by 4, like 2024,\n- **except** years that divide by 100 are not, like 1900,\n- **except** years that divide by 400 are leap years after all, like 2000.\n\nYou can write this as one condition: `(year % 4 == 0 and year % 100 != 0) or year % 400 == 0`. The part in brackets says \"divides by 4 but not by 100\". The `or` part lets years like 2000 in anyway. In exercise E4 you'll write the same rule as an `if`/`elif` chain instead."},{"t":"example","title":"the leap year rule in one condition","code":"year = 1900\nif (year % 4 == 0 and year % 100 != 0) or year % 400 == 0:\n    print(f\"{year} is a leap year.\")\nelse:\n    print(f\"{year} is not a leap year.\")","output":"1900 is not a leap year.","notes":["line 2, the brackets: 1900 % 4 == 0 is True, but 1900 % 100 != 0 is False. True and False gives False.","line 2, after or: 1900 % 400 == 0 is False too. False or False gives False...","line 4: ...so the else runs. Change the year to 2000 or 2024 and the if runs instead."]},{"t":"mc","kind":"predict","q":"What does this print?","code":"money = 8\nhungry = True\nif hungry:\n    if money >= 10:\n        print(\"order a pizza\")\n    else:\n        print(\"make a sandwich\")\nelse:\n    print(\"no food needed\")","options":["order a pizza","no food needed","make a sandwich","make a sandwich, then no food needed"],"answer":2,"why":"`if hungry:` is the same as `if hungry == True:`, and it is True, so we go inside. There, 8 >= 10 is False, so the inner else runs: make a sandwich. The outer else is skipped, because it only runs when hungry is False."},{"t":"mc","kind":"predict","q":"What does this print?","code":"print(7 % 2 == 0 or 7 > 5)","options":["True","False","1","an error, because you can't mix % and or"],"answer":0,"why":"7 % 2 is 1, so `7 % 2 == 0` is False. But `7 > 5` is True, and or needs only one True side, so the result is True. With and instead of or, it would be False."},{"t":"mc","kind":"bug","q":"It's monday, but this prints `it's the weekend!`. Why?","code":"day = \"monday\"\nif day == \"saturday\" or \"sunday\":\n    print(\"it's the weekend!\")","options":["Python only compares the first letter of text","The right side of or is just \"sunday\", and text that isn't empty counts as True","It should use and instead of or","== can't compare text, only numbers"],"answer":1,"why":"Python doesn't repeat `day ==` for you. The right side is only the text \"sunday\", which counts as True, so the or is always True. The fix is `day == \"saturday\" or day == \"sunday\"`. With and, it would never be True, because a day can't be both."},{"t":"mc","kind":"vocab","q":"What is a nested if?","options":["An if with more than two elif lines","Two ifs written one after the other","An if that uses and or or","An if inside the block of another if, only checked when the outer one is True"],"answer":3,"why":"Nested means one inside the other, like boxes in boxes. The inner if is indented under the outer one and is only reached when the outer condition is True. Two ifs one after the other are separate, not nested."},{"t":"code","id":"d3-c-weekend","task":"Ask for a day of the week, typed in lowercase. If it is `saturday` or `sunday`, print `it's the weekend!` Otherwise print `it's a weekday.`\n\nExample run: you type `sunday`, and it prints `it's the weekend!`","starter":"day = input(\"enter a day of the week: \")\n","tests":[{"inputs":["saturday"],"expect":["weekend"],"reject":["weekday"]},{"inputs":["sunday"],"expect":["weekend"],"reject":["weekday"]},{"inputs":["tuesday"],"expect":["weekday"],"reject":["weekend"]}],"require":["or"],"hints":["Two different answers lead to the weekend message. Which word means \"this one, or that one\"?","Each side of the or needs a full comparison, with `day ==` on both sides.","`if day == \"saturday\" or day == \"sunday\":` and an else for every other day."],"solution":"day = input(\"enter a day of the week: \")\nif day == \"saturday\" or day == \"sunday\":\n    print(\"it's the weekend!\")\nelse:\n    print(\"it's a weekday.\")"},{"t":"code","id":"d3-c-movie","task":"A cinema checks two things. First ask if the user has a ticket (yes/no).\n\n- no ticket: print `please buy a ticket first.`\n- a ticket: **only then** ask for their age. 18 or older prints `enjoy the movie!`, younger prints `sorry, this movie is 18+.`\n\nUse a nested if, and don't ask for the age when there's no ticket.","starter":"ticket = input(\"do you have a ticket? (yes/no): \")\n# your nested if goes here\n","tests":[{"inputs":["yes","20"],"expect":["enjoy"],"reject":["18+","buy"]},{"inputs":["yes","15"],"expect":["18+"],"reject":["enjoy","buy"]},{"inputs":["no"],"expect":["buy"],"reject":["enjoy","18+"]}],"require":["if","else"],"hints":["The outer if checks the ticket. The age question belongs inside its block.","Inside the ticket block, ask for the age with int(input(...)), then start a second if, indented 4 more spaces.","The outer `else:` lines up with the outer if and prints the buy-a-ticket message. The inner else lines up with the inner if."],"solution":"ticket = input(\"do you have a ticket? (yes/no): \")\nif ticket == \"yes\":\n    age = int(input(\"enter your age: \"))\n    if age >= 18:\n        print(\"enjoy the movie!\")\n    else:\n        print(\"sorry, this movie is 18+.\")\nelse:\n    print(\"please buy a ticket first.\")"},{"t":"explain","q":"Explain how this condition decides if a year is a leap year: `(year % 4 == 0 and year % 100 != 0) or year % 400 == 0`","points":["% gives the remainder, so `== 0` means the year divides evenly","the part in brackets is True for years that divide by 4 but not by 100, like 2024","the or lets years that divide by 400, like 2000, be leap years anyway","1900 divides by 4 and 100 but not by 400, so the whole condition is False","and needs both sides True; or needs at least one"],"model":"The % sign gives the remainder, so year % 4 == 0 means the year divides evenly by 4. The part in brackets uses and, so both sides must be True: the year divides by 4 but not by 100, like 2024. Then the or gives a second way in: if the year divides by 400, like 2000, it's a leap year anyway. A year like 1900 fails both: it divides by 100 so the brackets are False, and it doesn't divide by 400, so the whole condition is False."}]}]},{"day":4,"title":"Repeating with loops","goal":"By the end of today you can repeat code with for and while loops, use totals, counters, break and continue, and trace a loop by hand.","lessons":[{"id":"d4-for","title":"for loops and range()","minutes":30,"blocks":[{"t":"text","md":"Imagine printing the numbers 1 to 100. You could write 100 `print` lines... or write 2 lines and let a **loop** do the work. A loop repeats a block of code.\n\nA `for` loop means \"for each item in this group, run the block once\". Each run of the block is called a **pass** (or an **iteration**). On every pass, the **loop variable** holds the next item.\n\nThe shape looks like an `if`: the line ends with a colon, and the block under it is indented by 4 spaces."},{"t":"example","title":"your first for loop","code":"for number in range(5):\n    print(\"pass number\", number)\nprint(\"done!\")","output":"pass number 0\npass number 1\npass number 2\npass number 3\npass number 4\ndone!","notes":["line 1: range(5) gives the numbers 0, 1, 2, 3, 4. That's five numbers, starting at 0.","line 1: on each pass, `number` holds the next one.","line 2: indented, so it runs once per pass: five times.","line 3: not indented, so it runs once, after the loop has finished."]},{"t":"text","md":"`range()` can take one, two or three numbers:\n\n- `range(stop)`: from 0 up to stop. `range(4)` gives 0, 1, 2, 3\n- `range(start, stop)`: from start up to stop. `range(1, 4)` gives 1, 2, 3\n- `range(start, stop, step)`: jumps by step. `range(0, 10, 3)` gives 0, 3, 6, 9\n\nThe golden rule: **the stop number is never included**. Read it as \"up to, but not including\". So to get 1 to 10 you write `range(1, 11)`.\n\nA negative step counts down: `range(5, 0, -1)` gives 5, 4, 3, 2, 1."},{"t":"example","title":"the three kinds of range","code":"for n in range(1, 6):\n    print(n)\nprint(\"---\")\nfor n in range(0, 20, 5):\n    print(n)\nprint(\"---\")\nfor n in range(5, 0, -1):\n    print(n)","output":"1\n2\n3\n4\n5\n---\n0\n5\n10\n15\n---\n5\n4\n3\n2\n1","notes":["line 1: start at 1, stop before 6, so it prints 1 to 5.","line 4: start at 0 and jump by 5. 20 is the stop, so it is left out: 0, 5, 10, 15.","line 7: a step of -1 counts down. It stops before 0, so the last number is 1."]},{"t":"tip","md":"**Watch out:** the most common loop mistake is being off by one. `range(1, 10)` stops at **9**. If the task says \"1 to 10\", write `range(1, 11)`.\n\nQuick check: with a step of 1, `range(start, stop)` gives `stop - start` numbers. So `range(3, 8)` gives 5 numbers: 3, 4, 5, 6, 7."},{"t":"mc","kind":"predict","q":"What does this print?","code":"for i in range(2, 10, 3):\n    print(i)","options":["2, 5, 8 (one per line)","2, 5, 8, 11","3, 6, 9","2, 3, 4, 5, 6, 7, 8, 9"],"answer":0,"why":"Start at 2, then jump by 3: 2, 5, 8. The next would be 11, but that's past the stop of 10, so the loop ends. 3, 6, 9 is what you'd get if it started at 3."},{"t":"text","md":"A `for` loop doesn't need `range()`. It can walk through **any group of things**:\n\n- the letters of a string: `for letter in \"pizza\":`\n- the items of a list: `for snack in snacks:`\n\nNow the loop variable holds the actual letter or item, not a number. The loop runs once per letter or item, and stops by itself at the end. You choose the variable's name, so pick one that says what it holds, like `letter` or `snack`."},{"t":"example","title":"looping over a word and a list","code":"word = \"pizza\"\nfor letter in word:\n    print(letter)\nsnacks = [\"apple\", \"chips\", \"yogurt\"]\nfor snack in snacks:\n    print(f\"i packed {snack}\")\nprint(f\"that is {len(snacks)} snacks\")","output":"p\ni\nz\nz\na\ni packed apple\ni packed chips\ni packed yogurt\nthat is 3 snacks","notes":["line 2: on pass 1 `letter` is p, on pass 2 it is i, and so on. 5 letters, 5 passes.","line 5: the same idea for a list: `snack` holds one item per pass.","line 7: not indented, so it runs once, after the second loop."]},{"t":"mc","kind":"what","q":"In `for letter in \"hello\":`, what is in `letter` on the second pass?","options":["1","h","e","he"],"answer":2,"why":"The loop variable holds the item itself, not its position, so it's not 1. Pass 1 gets h, pass 2 gets e. It doesn't collect the letters either, so it's never he."},{"t":"mc","kind":"predict","q":"How many times is `hi` printed?","code":"for i in range(3, 8):\n    print(\"hi\")","options":["8","3","4","5"],"answer":3,"why":"range(3, 8) gives 3, 4, 5, 6, 7: that's 8 - 3 = 5 numbers. The print doesn't use i, but the loop still runs once per number. 4 is the answer you get if you forget that the start, 3, is included."},{"t":"mc","kind":"vocab","q":"What is one **pass** (also called an **iteration**) of a loop?","options":["The first line of the loop","One run through the loop's indented block","Skipping a line inside a loop","The moment the loop ends"],"answer":1,"why":"A loop repeats its block, and each repeat is one pass. range(5) means 5 passes. On every pass the loop variable gets the next value."},{"t":"code","id":"d4-c-table","task":"Ask for a whole number and print its multiplication table from 1 to 10, one line each, like `7 x 1 = 7` up to `7 x 10 = 70`. Use a for loop.","starter":"number = int(input(\"enter a number: \"))\n","tests":[{"inputs":["7"],"expect":["7 x 1 = 7","7 x 5 = 35","7 x 10 = 70"],"reject":["7 x 0","7 x 11"]},{"inputs":["3"],"expect":["3 x 1 = 3","3 x 4 = 12","3 x 10 = 30"],"reject":["3 x 0","3 x 11"]}],"require":["for","range"],"hints":["The thing that changes on every line is the number you multiply by. Let the loop give you that.","You need 1 up to and including 10. The stop number of range is never included, so what must the stop be?","`for times in range(1, 11):` and inside it an f-string like `f\"{number} x {times} = {number * times}\"`."],"solution":"number = int(input(\"enter a number: \"))\nfor times in range(1, 11):\n    print(f\"{number} x {times} = {number * times}\")"},{"t":"code","id":"d4-c-names","task":"Ask for a name and how many times to write it. Print the name that many times, numbered from 1, like this for `ana` and `3`:\n\n- `1. ana`\n- `2. ana`\n- `3. ana`","starter":"name = input(\"enter a name: \")\ntimes = int(input(\"how many times? \"))\n","tests":[{"inputs":["ana","3"],"expect":["1. ana","2. ana","3. ana"],"reject":["0. ana","4. ana"]},{"inputs":["bo","5"],"expect":["1. bo","5. bo"],"reject":["0. bo","6. bo"]}],"require":["for"],"hints":["The how-many answer is a number, so it needs int(). Then let a for loop count for you.","range(times) starts at 0, but your list starts at 1. Give range a start of 1. Where must it stop so that the last number is included?","`range(1, times + 1)`, and print with an f-string like `f\"{number}. {name}\"`."],"solution":"name = input(\"enter a name: \")\ntimes = int(input(\"how many times? \"))\nfor number in range(1, times + 1):\n    print(f\"{number}. {name}\")"},{"t":"explain","q":"Explain what `range(1, 11)` gives, and why you write 11 when you want the numbers 1 to 10.","points":["range gives a series of whole numbers that the loop walks through, one per pass","the first number is where it starts","the stop number is never included","so to include 10 you have to write 11","with a step of 1 it gives stop minus start numbers: 10 here"],"model":"range(1, 11) gives the numbers 1, 2, 3 and so on up to 10, and the for loop takes one of them on every pass. The first number is where it starts. The second number is where it stops, but the stop number itself is never included. So range(1, 10) would only go up to 9. That's why I write 11 when I want 1 to 10. It gives 11 minus 1, so 10 numbers."}]},{"id":"d4-while","title":"while loops","minutes":25,"blocks":[{"t":"text","md":"A `while` loop repeats a block **as long as its condition is True**. It looks like an `if`, with one big difference: after running the block, it goes back up and checks the condition again. And again. It only stops when the condition is False.\n\nUse `for` when you know what to loop over: each letter, the numbers 1 to 10. Use `while` when you don't know in advance how many passes you need: keep asking until the answer is right, keep saving until you have enough money."},{"t":"text","md":"A counting `while` loop needs three parts:\n\n- a **start value** before the loop: `count = 1`\n- a **condition** in the while line: `while count <= 5:`\n- a **change** inside the loop that moves toward the end: `count = count + 1`\n\nIf the change is missing, the condition stays True forever. More about that below."},{"t":"example","title":"counting to 5","code":"count = 1\nwhile count <= 5:\n    print(\"count is\", count)\n    count = count + 1\nprint(\"after the loop, count is\", count)","output":"count is 1\ncount is 2\ncount is 3\ncount is 4\ncount is 5\nafter the loop, count is 6","notes":["line 1: the start value.","line 2: checked before every pass. 1 <= 5 is True, so the block runs.","line 4: the change. Without it, count would stay 1 forever.","line 5: the loop stops when count becomes 6, because 6 <= 5 is False. That's why this line shows 6."]},{"t":"example","title":"saving up for a $100 game","code":"savings = 0\nweeks = 0\nwhile savings < 100:\n    savings = savings + 15\n    weeks = weeks + 1\nprint(f\"after {weeks} weeks you have ${savings}\")","output":"after 7 weeks you have $105","notes":["line 3: we don't know yet how many weeks it takes, so a while loop fits.","lines 4-5: each pass adds $15 and counts one more week.","after 6 weeks you have $90, still under 100, so one more pass. After 7 weeks you have $105, 105 < 100 is False, and the loop stops."]},{"t":"example","title":"asking until the answer is right","code":"answer = input(\"what is 3 + 4? \")\nwhile answer != \"7\":\n    print(\"not quite, try again.\")\n    answer = input(\"what is 3 + 4? \")\nprint(\"correct!\")","inputs":["5","8","7"],"notes":["line 1: ask once before the loop, so `answer` has a value to check.","line 2: keep looping while the answer is not \"7\". It's text, so the 7 is in quotes.","line 4: ask again inside the loop. This is the change that lets the loop end. Here the user types 5, then 8, then 7."]},{"t":"text","md":"If the condition never becomes False, the loop never ends. That's an **infinite loop**: the program seems to freeze, or prints the same thing forever. The usual causes:\n\n- forgetting the change line, like `count = count + 1`\n- changing the variable the wrong way, like `+ 1` in a countdown\n- putting the change line outside the loop, by forgetting to indent it\n\nTo avoid it, ask yourself: \"does every pass move my variable closer to making the condition False?\" If a program does get stuck in VS Code, click in the terminal and press **Ctrl+C** to stop it (on a Mac too: the control key, not cmd)."},{"t":"tip","md":"**Watch out:** don't run code on this page that you think loops forever: the page may freeze and you'd have to reload it. Read it instead. On the test, if you're asked what an endless loop does, say it never stops, and point to the line that is missing or wrong."},{"t":"mc","kind":"bug","q":"What happens when you run this?","code":"count = 1\nwhile count <= 3:\n    print(count)\ncount = count + 1","options":["It prints 1, 2, 3","It prints 1 forever, because the change line is not inside the loop","It prints nothing","It prints 1 once and stops"],"answer":1,"why":"The last line is not indented, so it's not part of the loop. Inside the loop, count stays 1, and 1 <= 3 is True forever. Indent the last line and it prints 1, 2, 3.","norun":true},{"t":"mc","kind":"predict","q":"What does this print?","code":"n = 10\nwhile n > 0:\n    print(n)\n    n = n - 3","options":["10, 7, 4","7, 4, 1","10, 7, 4, 1, -2","10, 7, 4, 1 (one per line)"],"answer":3,"why":"The check happens before each pass. n goes 10, 7, 4, 1, all bigger than 0, so all four are printed. Then n becomes -2, -2 > 0 is False, and the loop stops before printing it."},{"t":"mc","kind":"predict","q":"What does this print?","code":"x = 5\nwhile x < 5:\n    print(\"hi\")\n    x = x + 1\nprint(\"bye\")","options":["bye","hi, then bye","hi five times, then bye","hi forever"],"answer":0,"why":"The condition is checked before the first pass. 5 < 5 is False right away, so the block never runs. A while loop can run zero times."},{"t":"mc","kind":"why","q":"When is a `while` loop a better choice than a `for` loop?","options":["When you go through every letter of a word","When you count from 1 to 10","When you don't know in advance how many passes you need","Always, because while loops are faster"],"answer":2,"why":"while repeats until something happens, like the right answer or enough savings. When you already know the group to walk through, such as letters or the numbers 1 to 10, a for loop is simpler and can't accidentally run forever."},{"t":"code","id":"d4-c-doubling","task":"Ask for a limit. Start at 1 and keep doubling, printing every number that is **smaller** than the limit. Use a while loop.\n\nExample run: a limit of `20` prints 1, 2, 4, 8 and 16, one per line.","starter":"limit = int(input(\"enter a limit: \"))\nnumber = 1\n# your while loop goes here\n","tests":[{"inputs":["20"],"expect":["1","2","4","8","16"],"reject":["32"]},{"inputs":["100"],"expect":["16","32","64"],"reject":["128"]}],"require":["while"],"hints":["Make a variable that starts at 1, before the loop. What condition keeps the loop going while it is still small enough?","`while number < limit:`. Inside, print the number first, then change it.","Doubling is `number = number * 2`. That's also the change that makes the loop end."],"solution":"limit = int(input(\"enter a limit: \"))\nnumber = 1\nwhile number < limit:\n    print(number)\n    number = number * 2"},{"t":"code","id":"d4-c-guess","task":"The secret number is 7. Keep asking the user to guess until they type 7. Then print how many tries it took, like `you got it in 3 tries!`\n\nUse a while loop and a counter.","starter":"# ask for a guess, then keep asking while it is not 7\n","tests":[{"inputs":["7"],"expect":["1"]},{"inputs":["3","9","7"],"expect":["3"]},{"inputs":["1","2","5","7"],"expect":["4"]}],"require":["while"],"hints":["Ask once before the loop, and start a counter at 1, because that first guess is already one try.","The loop keeps going while the guess is not 7: `while guess != 7:`. Inside, ask again and add 1 to the counter.","With int() around input(), compare with 7. Without int(), compare with \"7\" in quotes. Mix them up and the loop never ends. Print the counter after the loop."],"solution":"tries = 1\nguess = int(input(\"guess the secret number: \"))\nwhile guess != 7:\n    print(\"wrong, try again.\")\n    guess = int(input(\"guess the secret number: \"))\n    tries = tries + 1\nprint(f\"you got it in {tries} tries!\")"},{"t":"explain","q":"Explain the three things every counting while loop needs, and what happens if the third one is missing.","points":["a start value before the loop, like count = 1","a condition in the while line, checked before every pass","a change inside the loop that moves the variable toward making the condition False","without the change the condition stays True and the loop never ends: an infinite loop"],"model":"First I need a start value before the loop, like count = 1. Then the while line has a condition, like count <= 5, and Python checks it before every pass. Inside the loop I need a change, like count = count + 1, so the variable moves toward the end. If I forget the change, count stays 1, the condition is always True, and the loop never stops. That's called an infinite loop."}]},{"id":"d4-patterns","title":"Loop patterns: totals, counters, building text, break and continue","minutes":35,"blocks":[{"t":"text","md":"Most loop questions on a test use a few patterns. Learn these and you'll recognise them everywhere.\n\n**Pattern 1, the running total.** You want to add up many numbers. Make a variable that starts at 0 **before** the loop. Each pass adds the next number to it: `total = total + price`. After the loop, it holds the sum.\n\n**Pattern 2, the counter.** You want to know **how many** things match a rule. Start at 0 before the loop, and add 1 inside an `if`: `expensive = expensive + 1`."},{"t":"example","title":"a running total and a counter","code":"prices = [3, 5, 2, 8]\ntotal = 0\nexpensive = 0\nfor price in prices:\n    total = total + price\n    if price >= 5:\n        expensive = expensive + 1\nprint(\"you pay\", total)\nprint(expensive, \"items cost $5 or more\")","output":"you pay 18\n2 items cost $5 or more","notes":["lines 2-3: both start at 0, before the loop. Inside the loop they would be reset on every pass.","line 5: the running total. After each pass it is 3, 8, 10 and finally 18.","lines 6-7: the counter only goes up when the if is True: for 5 and for 8.","lines 8-9: printed once, after the loop, when the work is done."]},{"t":"tip","md":"**Good to know:** in other code you may see `total += price`. It means exactly the same as `total = total + price`. In this course we write the long form, because it shows what really happens."},{"t":"text","md":"**Pattern 3, building text.** Start with an empty string `\"\"` before the loop and add a piece on every pass.\n\nThe order around the `+` matters. `backwards = backwards + letter` adds each letter at the **end**, so you just get a copy of the word. `backwards = letter + backwards` puts each new letter in **front**, so the word comes out reversed. That's how you check for a palindrome: a word that reads the same both ways, like level."},{"t":"example","title":"reversing a word","code":"word = \"star\"\nbackwards = \"\"\nfor letter in word:\n    backwards = letter + backwards\n    print(backwards)\nprint(f\"{word} backwards is {backwards}\")","output":"s\nts\nats\nrats\nstar backwards is rats","notes":["line 2: an empty box for the new word. It must exist before we can add to it.","line 4: the new letter goes in front of what we have so far.","line 5: printed on every pass, so you can watch it grow: s, ts, ats, rats."]},{"t":"text","md":"**Pattern 4, break and continue.** Two words that change how a loop runs:\n\n- `break` stops the whole loop **right away**. Python jumps to the first line after the loop. Use it when you've found what you were looking for.\n- `continue` skips the **rest of this pass** and jumps straight to the next pass. Use it to skip items you don't want.\n\nBoth almost always sit inside an `if`, so they only happen at the right moment."},{"t":"example","title":"break and continue","code":"foods = [\"rice\", \"beans\", \"pizza\", \"salad\"]\nfor food in foods:\n    if food == \"pizza\":\n        print(\"found the pizza!\")\n        break\n    print(\"checked\", food)\nprint(\"---\")\nfor number in range(1, 8):\n    if number % 3 == 0:\n        continue\n    print(number)","output":"checked rice\nchecked beans\nfound the pizza!\n---\n1\n2\n4\n5\n7","notes":["line 5: break ends the loop at pizza, so salad is never checked.","line 6: on the pizza pass this print never happens, because break came first.","line 10: continue skips the print for 3 and 6, and the loop carries on with the next number."]},{"t":"mc","kind":"predict","q":"What does this print?","code":"total = 0\nfor n in range(1, 10):\n    total = total + n\n    if total > 10:\n        break\nprint(total)","options":["10","45","15","5"],"answer":2,"why":"After 1, 2, 3 and 4 the total is 10, and 10 > 10 is False. Adding 5 makes 15, which is > 10, so break stops the loop. 45 would be the total without the break."},{"t":"mc","kind":"bug","q":"This should print the total, 20. What does it print instead?","code":"prices = [4, 6, 10]\nfor price in prices:\n    total = 0\n    total = total + price\nprint(total)","options":["20","10","0","an error, because total is changed twice"],"answer":1,"why":"`total = 0` is inside the loop, so it is reset on every pass. After the last pass it is 0 + 10 = 10. Move `total = 0` above the loop and it prints 20."},{"t":"mc","kind":"predict","q":"What does this print?","code":"word = \"banana\"\ncount = 0\nfor letter in word:\n    if letter == \"a\":\n        count = count + 1\nprint(count)","options":["6","1","2","3"],"answer":3,"why":"The loop looks at all 6 letters, but count only goes up when the letter is a. banana has 3 a's. 6 would be the answer if the count line were not inside the if."},{"t":"mc","kind":"what","q":"What does `continue` do inside a loop?","options":["Skips the rest of this pass and goes on with the next pass","Stops the loop completely","Repeats the current pass once more","Jumps to the code after the loop"],"answer":0,"why":"continue only skips what's left of the current pass; the loop keeps going. Stopping the loop completely and jumping past it is what break does."},{"t":"code","id":"d4-c-total","task":"Ask the user for 4 prices, one at a time, using a for loop (not four input lines). Then print the total.\n\nExample run: `2`, `3`, `5` and `10` print `the total is 20`.","starter":"total = 0\n","tests":[{"inputs":["2","3","5","10"],"expect":["20"]},{"inputs":["7","7","7","7"],"expect":["28"]},{"inputs":["15","25","30","30"],"expect":["100"]}],"require":["for"],"hints":["The input line goes inside the loop, so it is asked once per pass. How do you make a loop run exactly 4 times?","`for number in range(4):`. Before the loop, make a total that starts at 0.","Inside the loop: `price = int(input(...))`, then `total = total + price`. Print the total after the loop, not inside it."],"solution":"total = 0\nfor number in range(4):\n    price = int(input(\"enter a price: \"))\n    total = total + price\nprint(f\"the total is {total}\")"},{"t":"code","id":"d4-c-vowels","task":"Ask for a word in lowercase and count its vowels (a, e, i, o, u). Print the count.\n\nExample run: `banana` prints `banana has 3 vowels`.","starter":"word = input(\"enter a word: \")\n","tests":[{"inputs":["banana"],"expect":["3"]},{"inputs":["sky"],"expect":["0"]},{"inputs":["education"],"expect":["5"]}],"require":["for","if"],"hints":["This is the counter pattern: a variable that starts at 0, and goes up by 1 inside an if.","Loop over the letters of the word. How can you ask \"is this letter one of a, e, i, o, u?\" in one go?","`if letter in \"aeiou\":` is True for vowels. Inside it, `vowels = vowels + 1`. Print after the loop."],"solution":"word = input(\"enter a word: \")\nvowels = 0\nfor letter in word:\n    if letter in \"aeiou\":\n        vowels = vowels + 1\nprint(f\"{word} has {vowels} vowels\")"},{"t":"explain","q":"Explain the difference between `break` and `continue`, with a small example of each.","points":["both are used inside a loop, usually inside an if","break stops the whole loop at once and goes to the line after the loop","continue skips only the rest of the current pass, then the loop goes on","an example of each, like stopping at the first pizza (break) or skipping multiples of 3 (continue)"],"model":"Both break and continue go inside a loop, usually inside an if. break stops the whole loop right away, and Python carries on after the loop. For example, when I search a list for pizza, I can break as soon as I find it. continue only skips the rest of the current pass, and then the loop goes on with the next item. For example, to print 1 to 7 without the multiples of 3, I continue when number % 3 == 0."}]},{"id":"d4-trace","title":"Tracing a loop by hand","minutes":25,"blocks":[{"t":"text","md":"On the written test you can't run the code. You have to **be the computer**. That's called **tracing**: you follow the code one line at a time and write down the value of every variable each time it changes.\n\nThe best tool is a small table: one column per variable, one row per pass. It feels slow at first, but it's how you avoid silly mistakes, and teachers like to see it on paper."},{"t":"text","md":"Let's trace a loop: `total = 0`, then `for n in range(1, 5):` with `total = total + n` inside, and `print(total)` after the loop.\n\n- start: total = 0\n- pass 1: n = 1, total = 0 + 1 = 1\n- pass 2: n = 2, total = 1 + 2 = 3\n- pass 3: n = 3, total = 3 + 3 = 6\n- pass 4: n = 4, total = 6 + 4 = 10\n- range(1, 5) has no more numbers, so the loop ends\n- after the loop: print shows 10"},{"t":"example","title":"let Python show you its trace","code":"total = 0\nfor n in range(1, 5):\n    total = total + n\n    print(f\"pass: n = {n}, total = {total}\")\nprint(\"final total:\", total)","output":"pass: n = 1, total = 1\npass: n = 2, total = 3\npass: n = 3, total = 6\npass: n = 4, total = 10\nfinal total: 10","notes":["line 4: a print inside the loop shows one table row per pass. It's a great trick for checking a trace you did on paper.","line 5: runs once, after the last pass.","compare it to the trace above: every row matches."]},{"t":"tip","md":"**On the test:** a recipe for tracing:\n\n- write down every variable's start value\n- for a `while`, check the condition **before** each pass; for a `for`, take the next item\n- run the indented lines in order and update your table\n- when the condition is False or the items run out, stop\n- only then run the lines after the loop\n\nWatch the indentation: is the `print` inside the loop (it prints every pass) or after it (it prints once)?"},{"t":"text","md":"Tracing a `while` loop works the same way, with one extra step: before each pass, write down the condition and whether it is True.\n\nThe last check is always the one that comes out **False**. The values at that moment are what the variables hold after the loop. That's why a counting loop like `while count <= 5` ends with count at 6, not 5."},{"t":"example","title":"tracing a while loop","code":"x = 1\nsteps = 0\nwhile x < 20:\n    x = x * 3\n    steps = steps + 1\n    print(f\"x = {x}, steps = {steps}\")\nprint(\"done:\", x, steps)","output":"x = 3, steps = 1\nx = 9, steps = 2\nx = 27, steps = 3\ndone: 27 3","notes":["pass 1: 1 < 20 is True, so x becomes 3 and steps becomes 1.","pass 3: 9 < 20 is True, so x becomes 27. Yes, past 20: the check only happens at the top.","then 27 < 20 is False, so the loop stops and the last line prints 27 and 3."]},{"t":"mc","kind":"predict","q":"Trace it. What does this print?","code":"result = 1\nfor i in range(1, 5):\n    result = result * i\nprint(result)","options":["24","10","120","4"],"answer":0,"why":"result goes 1 * 1 = 1, then * 2 = 2, * 3 = 6, * 4 = 24. range(1, 5) stops before 5, so there is no * 5 (that would give 120). 10 is what you'd get by adding instead of multiplying."},{"t":"mc","kind":"predict","q":"Trace it. What does this print?","code":"x = 3\nfor i in range(3):\n    x = x + i\nprint(x)","options":["9","6","3","12"],"answer":1,"why":"range(3) gives 0, 1, 2, so x goes 3, then 3 + 0 = 3, 3 + 1 = 4, 4 + 2 = 6. The trap is thinking i is 1, 2, 3, which gives 9. range starts at 0 unless you give it a start."},{"t":"mc","kind":"predict","q":"Trace it. What does this print?","code":"count = 0\nn = 20\nwhile n > 1:\n    n = n // 2\n    count = count + 1\nprint(n, count)","options":["0 5","2 3","1 4","1 5"],"answer":2,"why":"n goes 20, 10, 5, 2, 1. Remember that // drops the leftover, so 5 // 2 is 2. That's 4 passes. Then 1 > 1 is False, so the loop stops with n = 1 and count = 4."},{"t":"mc","kind":"predict","q":"Trace it. What does this print?","code":"word = \"\"\nfor letter in \"abc\":\n    word = word + letter + letter\nprint(word)","options":["aabbcc","abcabc","abc","ccbbaa"],"answer":0,"why":"Each pass adds the letter twice, at the end: aa, then aabb, then aabbcc. abcabc would need the whole word added twice, and ccbbaa would need the new letters added in front."},{"t":"mc","kind":"predict","q":"Trace it. What does this print?","code":"total = 10\nfor n in [2, 4, 6]:\n    total = total - n\n    print(total)","options":["-2 only","8, 6, 4","10, 8, 4","8, 4, -2 (one per line)"],"answer":3,"why":"The print is inside the loop, so it runs after every pass: 10 - 2 = 8, 8 - 4 = 4, 4 - 6 = -2. If the print were after the loop (not indented), you'd only see -2."},{"t":"code","id":"d4-c-digits","task":"Ask for a whole number and print the sum of its digits. For `1234` that's 1 + 2 + 3 + 4 = 10.\n\nUse a while loop and these two tricks: `number % 10` gives the last digit (1234 % 10 is 4), and `number // 10` removes it (1234 // 10 is 123). Trace it on paper first!","starter":"number = int(input(\"enter a whole number: \"))\ntotal = 0\n","tests":[{"inputs":["1234"],"expect":["10"]},{"inputs":["907"],"expect":["16"]},{"inputs":["5"],"expect":["5"]}],"require":["while","%"],"hints":["This is a running total: start a total at 0. Each pass handles one digit, the last one.","Keep going while there are digits left, so while the number is bigger than 0.","Inside the loop: add `number % 10` to the total, then `number = number // 10`. Print the total after the loop."],"solution":"number = int(input(\"enter a whole number: \"))\ntotal = 0\nwhile number > 0:\n    total = total + number % 10\n    number = number // 10\nprint(f\"the sum of the digits is {total}\")"},{"t":"code","id":"d4-c-factorial","task":"Ask for a whole number n and print n! (say \"n factorial\"): all the whole numbers from 1 to n multiplied together. For `4` that is 1 * 2 * 3 * 4 = 24.","starter":"n = int(input(\"enter a number: \"))\n","tests":[{"inputs":["4"],"expect":["24"]},{"inputs":["6"],"expect":["720"]},{"inputs":["10"],"expect":["3628800"]}],"require":["for"],"hints":["It's like a running total, but you multiply. What must the result start at? (Hint: not 0.)","Start at 1, because anything times 0 is 0. Loop over 1 up to and including n.","`for number in range(1, n + 1):` and inside it `result = result * number`."],"solution":"n = int(input(\"enter a number: \"))\nresult = 1\nfor number in range(1, n + 1):\n    result = result * number\nprint(f\"{n}! = {result}\")"},{"t":"explain","q":"Walk your teacher through how you trace a loop on paper, using a short example.","points":["write down each variable and its start value","go pass by pass: take the next item, or check the condition before each pass","run the indented lines in order and write the new values in a new row","stop when the condition is False or the items run out, then run the lines after the loop","check whether a print is inside the loop or after it"],"model":"I make a small table with one column for each variable, and I write their start values first. Then I go pass by pass. For a for loop I take the next item, and for a while loop I check the condition first. I run the indented lines in order and write the new values in a new row. For example, with total = 0 and range(1, 4), total becomes 1, then 3, then 6. When the items run out or the condition is False, I stop and run the lines after the loop. I also check if the print is inside the loop, because then it prints every pass."}]},{"id":"d4-drill-for","title":"Extra practice: for loops and range()","minutes":35,"blocks":[{"t":"text","md":"This page is extra practice. It starts very easy and gets harder one small step at a time, so don't skip ahead.\n\nBefore you write any `for` loop, answer these three questions:\n\n- **What changes on each line of output?** That's your loop variable.\n- **Where does it start, where does it end, and how big is each jump?** That goes in `range()`.\n- **What stays the same on every line?** That's the fixed text in your `print`."},{"t":"tip","md":"**range() cheat sheet.** The stop number is never included, so the stop goes one step past where you want to end:\n\n- 1 to 10: `range(1, 11)`\n- 0 to 9: `range(10)`\n- 2, 4, 6 ... 20: `range(2, 21, 2)`\n- 5, 10, 15 ... 50: `range(5, 51, 5)`\n- 10 down to 1: `range(10, 0, -1)`"},{"t":"example","title":"reading a for loop out loud","code":"for n in range(1, 4):\n    print(\"number\", n, \"times 10 is\", n * 10)\nprint(\"finished\")","output":"number 1 times 10 is 10\nnumber 2 times 10 is 20\nnumber 3 times 10 is 30\nfinished","notes":["line 1: read it out loud as \"for each n from 1 up to, but not including, 4\". So n is 1, then 2, then 3.","line 2: indented, so it runs once per pass. The words stay the same; only n changes.","line 3: not indented, so it runs once, after the loop is finished."]},{"t":"mc","kind":"predict","q":"What does this print? Each number goes on its own line.","code":"for i in range(4):\n    print(i)","options":["1, 2, 3, 4","0, 1, 2, 3","0, 1, 2, 3, 4","4"],"answer":1,"why":"With one number, range starts at 0 and stops before that number. range(4) gives 4 numbers: 0, 1, 2, 3."},{"t":"mc","kind":"what","q":"Which `range()` gives the numbers 1, 2, 3, 4, 5?","options":["`range(5)`","`range(1, 5)`","`range(1, 6)`","`range(0, 6)`"],"answer":2,"why":"Start at 1. The stop is never included, so to end on 5 the stop must be 6. range(5) gives 0 to 4, range(1, 5) stops at 4, and range(0, 6) starts at 0."},{"t":"mc","kind":"what","q":"Which `range()` gives 10, 8, 6, 4, 2?","options":["`range(2, 10, 2)`","`range(10, 2, -2)`","`range(10, 0, -2)`","`range(10, 0, 2)`"],"answer":2,"why":"Counting down needs a negative step, -2. The stop is never included, so to reach 2 the stop must be below 2, like 0. range(10, 2, -2) stops before 2 and gives only 10, 8, 6, 4. range(10, 0, 2) gives nothing at all, because you can't count up from 10 to 0."},{"t":"mc","kind":"predict","q":"What does this print?","code":"total = 0\nfor n in range(1, 4):\n    total = total + n\n    print(total)","options":["6","1, 3, 6 (one per line)","1, 2, 3 (one per line)","0, 1, 3 (one per line)"],"answer":1,"why":"The print is indented, so it's inside the loop and runs on every pass. Pass 1: total is 0 + 1 = 1. Pass 2: 1 + 2 = 3. Pass 3: 3 + 3 = 6. If the print were not indented, you'd only see 6."},{"t":"mc","kind":"predict","q":"What does this print?","code":"count = 0\nfor letter in \"banana\":\n    if letter == \"a\":\n        count = count + 1\nprint(count)","options":["1","3","6","2"],"answer":1,"why":"The loop looks at all 6 letters, but only the 3 a's make the if True, so count goes up 3 times. 6 is the number of letters, not the number of a's."},{"t":"mc","kind":"bug","q":"This should print 1 to 5. What's wrong?","code":"for i in range(1, 5):\n    print(i)","options":["Nothing, it prints 1 to 5","It prints 1 to 4, because the stop is never included. It should be `range(1, 6)`","It prints 0 to 5","It prints 5 four times"],"answer":1,"why":"The golden rule: the stop number is never included. range(1, 5) gives 1, 2, 3, 4. Use range(1, 6) to end on 5."},{"t":"mc","kind":"predict","q":"What does this print?","code":"for i in range(1, 4):\n    print(\"#\" * i)","options":["#, ##, ### (one per line)","###","# three times","##, ###, #### (one per line)"],"answer":0,"why":"Text times a number repeats the text. i is 1, then 2, then 3, so each line gets one more #."},{"t":"code","id":"d4-x-count","task":"Warm-up: print the numbers 1 to 10, one per line, with a for loop and `range()`.","starter":"# print 1 to 10\n","tests":[{"inputs":[],"expect":["1\n2\n3","9\n10"],"reject":["0\n1","11"]}],"require":["for","range"],"hints":["What changes on each line? Only the number. So the loop variable is the number, and the print just prints it.","You want 1 up to and including 10. The stop is never included, so it has to be one more than 10.","`for n in range(1, 11):` and inside it, indented, `print(n)`."],"solution":"for n in range(1, 11):\n    print(n)"},{"t":"code","id":"d4-x-fives","task":"Print 5, 10, 15 and so on, up to and including 50, one per line. Use a for loop. Tip: `range()` can jump by 5 for you.","starter":"","tests":[{"inputs":[],"expect":["5\n10\n15","45\n50"],"reject":["0\n5","55"]}],"require":["for","range"],"hints":["Where does it start? 5. Where does it end? 50. How big is each jump? 5.","Put those in range(start, stop, step). The stop is never included, so it must be a bit more than 50.","`for n in range(5, 51, 5):` and inside it `print(n)`."],"solution":"for n in range(5, 51, 5):\n    print(n)"},{"t":"code","id":"d4-x-liftoff","task":"Count down from 10 to 1 with a for loop, one number per line. After the loop, print `liftoff!` once.","starter":"","tests":[{"inputs":[],"expect":["10\n9\n8","2\n1\nliftoff!"],"reject":["1\n0","liftoff!\n9"]}],"require":["for","range"],"hints":["Counting down means a negative step: -1.","Start at 10. The stop is never included, so to end on 1 the stop has to be 0.","`for n in range(10, 0, -1):` with `print(n)` inside. Then `print(\"liftoff!\")` with no indent, so it runs once, after the loop."],"solution":"for n in range(10, 0, -1):\n    print(n)\nprint(\"liftoff!\")"},{"t":"code","id":"d4-x-squares-fix","task":"Fix the bug. This code should print the squares of 1 to 5: `1`, `4`, `9`, `16`, `25`, one per line. Run it first to see what it does wrong. There are two mistakes.","starter":"for n in range(1, 5):\n    print(n * 2)\n","tests":[{"inputs":[],"expect":["1\n4\n9\n16\n25"],"reject":["36"]}],"require":["for"],"hints":["Run it. It prints 2, 4, 6, 8. That's two problems: it stops too early, and it doubles instead of squaring.","To include 5, the stop must be 6.","A square is a number times itself: `n * n`. So `for n in range(1, 6):` and `print(n * n)`."],"solution":"for n in range(1, 6):\n    print(n * n)"},{"t":"code","id":"d4-x-sum","task":"Ask for a whole number `n`, then add up all the numbers from 1 to `n` with a for loop. Print the result once, like `the total is 15`.\n\nExample: for `5` it's 1 + 2 + 3 + 4 + 5 = 15.","starter":"n = int(input(\"enter a number: \"))\ntotal = 0\n","tests":[{"inputs":["5"],"expect":["the total is 15"],"reject":["the total is 10"]},{"inputs":["10"],"expect":["the total is 55"],"reject":["the total is 45"]},{"inputs":["100"],"expect":["the total is 5050"]}],"require":["for","range"],"hints":["This is the running total pattern: a total that starts at 0 before the loop and grows on every pass.","The loop has to go from 1 up to and including n: `range(1, n + 1)`.","Inside the loop: `total = total + number`. After the loop, with no indent: `print(\"the total is\", total)`."],"solution":"n = int(input(\"enter a number: \"))\ntotal = 0\nfor number in range(1, n + 1):\n    total = total + number\nprint(\"the total is\", total)"},{"t":"code","id":"d4-x-stairs","task":"Ask how many rows, then print a staircase of `#` signs: 1 on the first row, 2 on the second, and so on.\n\nFor `4` it prints:\n\n- `#`\n- `##`\n- `###`\n- `####`","starter":"rows = int(input(\"how many rows? \"))\n","tests":[{"inputs":["4"],"expect":["#\n##\n###\n####"],"reject":["#####"]},{"inputs":["2"],"expect":["#\n##"],"reject":["###"]}],"require":["for"],"hints":["What changes on each row? The number of # signs: 1, then 2, then 3. So loop over the numbers 1 to rows.","Text times a number repeats it: `\"#\" * 3` is `###`.","`for i in range(1, rows + 1):` and inside it `print(\"#\" * i)`."],"solution":"rows = int(input(\"how many rows? \"))\nfor i in range(1, rows + 1):\n    print(\"#\" * i)"},{"t":"code","id":"d4-x-biggest","task":"Ask for 5 positive numbers, one at a time, using a for loop (not five input lines). After the loop, print the biggest one, like `the biggest is 9`. Don't use `max()`.\n\nExample: `3`, `9`, `2`, `7`, `5` prints `the biggest is 9`.","starter":"","tests":[{"inputs":["3","9","2","7","5"],"expect":["the biggest is 9"],"reject":["the biggest is 3","the biggest is 5"]},{"inputs":["12","4","30","8","1"],"expect":["the biggest is 30"],"reject":["the biggest is 12"]},{"inputs":["5","5","5","5","5"],"expect":["the biggest is 5"]}],"require":["for"],"hints":["Make a variable `biggest = 0` before the loop. It remembers the biggest number seen so far.","`for i in range(5):` runs 5 times. Inside, ask for a number with `int(input(...))`.","Still inside the loop: `if number > biggest:` and under it `biggest = number`. After the loop, with no indent, print it."],"solution":"biggest = 0\nfor i in range(5):\n    number = int(input(\"enter a number: \"))\n    if number > biggest:\n        biggest = number\nprint(\"the biggest is\", biggest)"},{"t":"explain","q":"Explain what `range(2, 11, 2)` gives, and why the stop is 11 and not 10.","points":["it starts at 2","it jumps by 2 each time, because the step is 2","it gives 2, 4, 6, 8, 10","the stop number is never included, so the stop has to be past 10 for 10 to be included"],"model":"range(2, 11, 2) starts at 2 and jumps by 2, so it gives 2, 4, 6, 8 and 10. The stop number is never included. If I wrote 10 as the stop, the loop would stop before 10 and only give 2 to 8. So I use 11 to make sure 10 is included."}]},{"id":"d4-drill-while","title":"Extra practice: while loops","minutes":35,"blocks":[{"t":"text","md":"Almost every while loop has one of two shapes. Spot the shape and you've done half the work.\n\n**Shape 1, counting.** It's a for loop written by hand. It needs three parts:\n\n- a **start** before the loop: `n = 1`\n- a **condition** in the while line: `while n <= 5:`\n- a **change** inside the loop: `n = n + 1`\n\n**Shape 2, keep asking.** You don't know how many passes you'll need. There are two ways to write it:\n\n- ask once **before** the loop, check the answer in the while line, and ask again at the **end** of the loop\n- or write `while True:` and use `break` to jump out when the answer is right. The project menu uses this one."},{"t":"example","title":"the same loop with for and with while","code":"for n in range(1, 4):\n    print(\"for:\", n)\n\nn = 1\nwhile n <= 3:\n    print(\"while:\", n)\n    n = n + 1","output":"for: 1\nfor: 2\nfor: 3\nwhile: 1\nwhile: 2\nwhile: 3","notes":["lines 1-2: range does the start, the stop and the change for you.","line 4: with while, you write the start yourself...","line 5: ...and the condition. `<= 3` includes 3, like a stop of 4 in range...","line 7: ...and the change. Forget it and the loop never ends."]},{"t":"example","title":"keep asking until done","code":"count = 0\nname = input(\"guest name, or done: \")\nwhile name != \"done\":\n    count = count + 1\n    print(\"welcome,\", name)\n    name = input(\"guest name, or done: \")\nprint(count, \"guests came\")","inputs":["ana","leo","done"],"output":"welcome, ana\nwelcome, leo\n2 guests came","notes":["line 2: ask once before the loop, so `name` has something to check.","line 3: keep going while the answer is not \"done\". The check happens before every pass.","line 6: ask again at the end of the loop. This is the change that lets the loop end.","Here the user types ana, leo, then done, so the loop runs twice."]},{"t":"mc","kind":"bug","q":"This should print 1 to 5. What's missing?","code":"n = 1\nwhile n <= 5:\n    print(n)","options":["`n = n + 1`, indented inside the loop","`n = n + 1`, not indented, after the loop","`n = 0` before the loop","Nothing, it works"],"answer":0,"why":"Without a change, n stays 1 and the loop prints 1 forever. The change has to be indented so it happens on every pass. After the loop, it would never be reached.","norun":true},{"t":"mc","kind":"predict","q":"What does this print? Each number goes on its own line.","code":"i = 3\nwhile i > 0:\n    i = i - 1\n    print(i)","options":["3, 2, 1","2, 1, 0","3, 2, 1, 0","2, 1"],"answer":1,"why":"Here the change comes before the print. Pass 1: i goes from 3 to 2, prints 2. Pass 2: prints 1. Pass 3: 1 > 0 is True, i goes to 0, prints 0. Now 0 > 0 is False, so it stops. The order of the lines inside the loop matters."},{"t":"mc","kind":"predict","q":"What does this print?","code":"n = 1\nwhile n < 20:\n    n = n * 3\nprint(n)","options":["9","27","20","3, 9, 27 (one per line)"],"answer":1,"why":"The print is not indented, so it runs once, after the loop. n goes 1, 3, 9, 27. At 9, the check 9 < 20 is still True, so one more pass makes it 27. Then 27 < 20 is False and the loop stops."},{"t":"mc","kind":"bug","q":"What happens when you run this?","code":"n = 5\nwhile n > 0:\n    print(n)\n    n = n + 1","options":["It prints 5, 4, 3, 2, 1","It never stops: n keeps getting bigger, so n > 0 is always True","It prints nothing","It prints 5 once"],"answer":1,"why":"To count down, the change has to be n = n - 1. With + 1, n goes 5, 6, 7 and so on. It's always bigger than 0, so the condition never becomes False.","norun":true},{"t":"mc","kind":"bug","q":"How many times does this print?","code":"x = 0\nwhile x != 7:\n    print(x)\n    x = x + 2","options":["4 times: 0, 2, 4, 6","It never stops","7 times","0 times"],"answer":1,"why":"x goes 0, 2, 4, 6, 8, 10... It jumps right over 7, so x != 7 is always True. `while x < 7:` is safer: it stops as soon as x gets past 7.","norun":true},{"t":"mc","kind":"predict","q":"What does this print?","code":"n = 0\nwhile True:\n    n = n + 1\n    if n == 3:\n        break\n    print(n)\nprint(\"end\")","options":["1, 2, 3, end","1, 2, end","end","1, 2 forever"],"answer":1,"why":"Pass 1: n is 1, not 3, so it prints 1. Pass 2: prints 2. Pass 3: n is 3, so break jumps out of the loop right away, before the print. Then the line after the loop prints end."},{"t":"mc","kind":"why","q":"In a keep-asking loop, why do we call `input()` once before the loop and again inside it?","options":["The first one gives the condition something to check. The one inside lets the answer change, so the loop can end","Python needs two inputs for every loop","The second one is only there to print a message","So the loop runs exactly twice"],"answer":0,"why":"The while line checks the answer before the first pass, so the answer must already exist. Then every pass has to ask again, or the answer never changes and the loop never ends."},{"t":"code","id":"d4-x-while-count","task":"Warm-up: print the numbers 1 to 10, one per line, using a **while** loop (no for).","starter":"n = 1\n","tests":[{"inputs":[],"expect":["1\n2\n3","9\n10"],"reject":["0\n1","11"]}],"require":["while"],"hints":["You already have the start: `n = 1`. Now the condition: keep going while n is 10 or less.","`while n <= 10:` and inside it, `print(n)`.","Don't forget the change, indented inside the loop, after the print: `n = n + 1`."],"solution":"n = 1\nwhile n <= 10:\n    print(n)\n    n = n + 1"},{"t":"code","id":"d4-x-evens-fix","task":"Fix the bug. This should print the even numbers 2, 4, 6, 8, 10, one per line. Run it first and see what's off.","starter":"n = 0\nwhile n < 10:\n    print(n)\n    n = n + 2\n","tests":[{"inputs":[],"expect":["2\n4\n6\n8\n10"],"reject":["0\n2","12"]}],"require":["while"],"hints":["Run it: it prints 0, 2, 4, 6, 8. It starts one step too early and stops one step too early.","Start at 2 instead of 0.","Then make the condition include 10: `while n <= 10:`."],"solution":"n = 2\nwhile n <= 10:\n    print(n)\n    n = n + 2"},{"t":"code","id":"d4-x-range-check","task":"Ask for a number fr
