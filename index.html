st joke prints, the same as before","All three jokes print, one after another","The loop runs forever","An error, because a `for` loop needs a `break`"],"answer":1,"why":"`break` stops the loop after the first joke. Without it the loop goes on and prints every joke in the set, so all three appear. A `for` loop ends by itself after the last item, so it doesn't run forever."},{"type":"mc","kind":"what","q":"Which sentence describes this joke machine honestly?","options":["Each joke has exactly a 1 in 3 chance on every run","It always prints the first joke in the list","The first joke can change between runs, but it isn't a fair random pick","It shows a new joke each time the loop runs inside one program"],"answer":2,"why":"The set's order can change between runs, so the joke can change. But nothing makes each joke equally likely: in 10 test runs one joke came up 5 times, another 4 times and the third once."},{"type":"explain","q":"Walk me through how your joke machine picks one joke. Is it really random?","model":"I stored the jokes in a list called jokes, because the task asks for a list. Then set(jokes) turns the list into a set. Sets have no fixed order, and Python can arrange that order differently each time the program runs, so a different joke can come first. The for loop starts with whichever joke is first in the set, prints it, and break stops the loop right away, so only one joke is shown. It's not truly random, though: nothing makes each joke equally likely, and in my test runs some jokes came up more often than others.","points":["The jokes are stored in a list","set(jokes) makes a set, which has no fixed order","The set's order can change between runs, so the first joke can change","break stops the loop after one joke","It is not truly random: not every joke is equally likely"]}]}]}],"project":{"title":"Healthy Meal Tracker","intro":"Build your Module 1 project one small step at a time. Each step first teaches the one thing you need (a loop, a list, a dictionary, a function), then you add that part to your program. When a step's tests pass, your code carries over to the next step, so at the end the whole project is yours.","reqs":[["A menu that repeats until the user picks quit","p-menu"],["A list of meals; each meal is a dictionary (title, category, ingredients, instructions)","p-dict"],["Add: ask for all 4 parts, store them in a dictionary, add it to the list","p-ingredients"],["View: print every meal with all its details, readably","p-ingredients"],["Remove by title, with a friendly message if it's not found","p-remove"],["Keep running until the user quits","p-menu"],["Comments that explain what your code does","p-final"],["Optional F1 and F2: edit an entry, search by keyword","p-extras"]],"lessons":[{"id":"p-menu","title":"Step 1: the menu loop","minutes":30,"learn":"while True, break, if / elif / else, and why input() gives text","blocks":[{"t":"text","md":"Every menu program has the same skeleton: a loop that **shows the menu**, **asks for a choice**, and **does something** with the choice. Then it goes back to the top and shows the menu again, until the user picks quit.\n\nYou don't know how many times the user will pick something, so this is a `while` loop. The easiest way to write it is `while True:` (repeat forever) with a `break` when the user picks quit. `break` jumps out of the loop straight away."},{"t":"example","title":"a tiny menu with 2 options","code":"while True:\n    print(\"1. say hi\")\n    print(\"2. stop\")\n    choice = input(\"pick 1 or 2: \")\n    if choice == \"1\":\n        print(\"hi!\")\n    elif choice == \"2\":\n        print(\"bye\")\n        break\n    else:\n        print(\"not a choice\")\nprint(\"the loop is over\")","inputs":["1","5","2"],"output":"1. say hi\n2. stop\nhi!\n1. say hi\n2. stop\nnot a choice\n1. say hi\n2. stop\nbye\nthe loop is over","notes":["line 1: `while True:` repeats forever. Only a `break` can stop it.","lines 2-4: every pass shows the menu again and asks again.","line 5: input() gives text, so we compare with \"1\" in quotes.","line 9: `break` jumps out of the loop. Python goes on with line 12, the first line after the loop.","Here the user types 1, then 5, then 2: hi!, then not a choice, then bye."]},{"t":"tip","md":"**Watch out:** `choice == 1` (no quotes) is **never** True, because input() gives the text \"1\", not the number 1. Your menu would say `not a choice` to everything. Always compare with `\"1\"` in quotes."},{"t":"mc","kind":"predict","q":"In the tiny menu above, the user types `1`, then `1`, then `2`. How many times is `hi!` printed?","options":["1","2","3","It never stops"],"answer":1,"why":"Each 1 runs one pass that prints hi!, then the loop goes back to the top. The 2 prints bye and the break ends the loop. So hi! is printed twice."},{"t":"mc","kind":"what","q":"What does `break` do inside a `while True:` loop?","options":["It pauses the loop for a second","It jumps out of the loop. The first line after the loop runs next","It goes back to the top of the loop","It ends the whole program and closes Python"],"answer":1,"why":"break ends the loop it's in, right away. Python carries on with the line after the loop. Going back to the top is what `continue` does."},{"t":"code","id":"p-c-menu","task":"**Your project, step 1: the menu.** Show the menu again and again:\n\n- `1. add a new entry`\n- `2. view all entries`\n- `3. remove an entry`\n- `4. quit`\n\nAsk for the choice. For 1, 2 and 3, print a placeholder like `add: coming soon` (the real parts come in the next steps). For 4, print `goodbye!` and stop the loop. For anything else, print `not a choice, please try again.`","starter":"# healthy meal tracker\n# show the menu again and again until the user picks 4\n","tests":[{"inputs":["1","2","3","4"],"expect":["coming soon","goodbye"]},{"inputs":["9","4"],"expect":["not a choice","goodbye"]},{"inputs":["4"],"expect":["goodbye"],"reject":["coming soon","not a choice"]}],"require":["while"],"hints":["Start with `while True:`. Everything inside it is indented: the 4 print lines for the menu, then `choice = input(\"enter your choice (1-4): \")`.","Then `if choice == \"1\":`, `elif choice == \"2\":`, `elif choice == \"3\":`, `elif choice == \"4\":` and `else:`. Quotes around the numbers!","In the `\"4\"` part: `print(\"goodbye!\")` and on the next line, same indent, `break`."],"solution":"# healthy meal tracker\n# show the menu again and again until the user picks 4\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1-4): \")\n\n    if choice == \"1\":\n        print(\"add: coming soon\")\n    elif choice == \"2\":\n        print(\"view: coming soon\")\n    elif choice == \"3\":\n        print(\"remove: coming soon\")\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n"}]},{"id":"p-list","title":"Step 2: a list to remember the meals","minutes":30,"learn":"lists: [], append(), len() and a for loop over a list","blocks":[{"t":"text","md":"Right now your menu forgets everything. To remember meals, you need a **list**: one variable that holds many values, in order.\n\n- `meals = []` makes an empty list.\n- `meals.append(\"soup\")` adds soup to the end of the list.\n- `len(meals)` tells you how many things are in it.\n- `for meal in meals:` goes through the list, one item per pass (just like the loops on Day 4).\n\nMake the list **once**, at the top, before the menu loop. Everything in the program uses that one list."},{"t":"example","title":"a list that grows","code":"snacks = []\nsnacks.append(\"apple\")\nsnacks.append(\"yogurt\")\nprint(snacks)\nprint(len(snacks), \"snacks\")\nfor snack in snacks:\n    print(\"-\", snack)","output":"['apple', 'yogurt']\n2 snacks\n- apple\n- yogurt","notes":["line 1: an empty list. `[]` means \"nothing in it yet\".","lines 2-3: append adds each item at the end.","line 4: printing the whole list shows the brackets and quotes. Fine for testing, not pretty for users.","lines 6-7: a for loop prints one item per line. Much more readable."]},{"t":"mc","kind":"predict","q":"What does this print?","code":"meals = []\nmeals.append(\"soup\")\nmeals.append(\"salad\")\nprint(meals)","options":["`['soup', 'salad']`","`soup salad`","`['salad', 'soup']`","`[]`"],"answer":0,"why":"append always adds to the end, so soup comes first and salad second. Printing a whole list shows the square brackets and the quotes."},{"t":"mc","kind":"bug","q":"The user adds 3 meals with this code, but it always prints 1. Why?","code":"while True:\n    meals = []\n    title = input(\"title: \")\n    meals.append(title)\n    print(len(meals))","options":["`meals = []` is inside the loop, so the list is emptied again on every pass","append only works once per list","len() always gives 1","input() deletes the list"],"answer":0,"why":"Every pass runs `meals = []` again, which throws the old list away. Move it above the loop so it runs once, and the list keeps growing.","norun":true},{"t":"code","id":"p-c-list","carry":"p-c-menu","task":"**Your project, step 2: remember the meals.** For now, a meal is just its title.\n\n- Before the loop, make an empty list: `meals = []`.\n- Choice 1 asks for a title, adds it to `meals`, and prints `meal added!`.\n- Choice 2 prints each title on its own line. If the list is empty, it prints `no entries yet` instead.\n- Choice 3 stays a placeholder for now.","starter":"# healthy meal tracker\n# step 2: make the empty list meals here, before the loop\n\n# show the menu again and again until the user picks 4\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1-4): \")\n\n    if choice == \"1\":\n        print(\"add: coming soon\")\n    elif choice == \"2\":\n        print(\"view: coming soon\")\n    elif choice == \"3\":\n        print(\"remove: coming soon\")\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n","tests":[{"inputs":["2","4"],"expect":["no entries yet","goodbye"]},{"inputs":["1","oatmeal","1","green salad","2","4"],"expect":["added","oatmeal","green salad","goodbye"],"reject":["no entries yet"]},{"inputs":["1","soup","2","1","pasta","2","4"],"expect":["soup","pasta","goodbye"]}],"require":["append","for"],"hints":["At the top, before `while True:`, write `meals = []`.","For choice 1: `title = input(\"enter the title: \")`, then `meals.append(title)`, then the message.","For choice 2: `if len(meals) == 0:` print `no entries yet`, `else:` loop with `for title in meals:` and print each one."],"solution":"# healthy meal tracker\n\n# the list that holds every meal. it is made once, before the loop\nmeals = []\n\n# show the menu again and again until the user picks 4\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1-4): \")\n\n    if choice == \"1\":\n        title = input(\"enter the title: \")\n        meals.append(title)\n        print(\"meal added!\")\n    elif choice == \"2\":\n        if len(meals) == 0:\n            print(\"no entries yet\")\n        else:\n            for title in meals:\n                print(\"-\", title)\n    elif choice == \"3\":\n        print(\"remove: coming soon\")\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n"}]},{"id":"p-dict","title":"Step 3: each meal is a dictionary","minutes":30,"learn":"dictionaries: keys and values, meal[\"title\"], a list of dictionaries","blocks":[{"t":"text","md":"A meal has several parts: a title, a category, ingredients and instructions. One text can't hold all that. A **dictionary** can: it stores values under **names**, called keys.\n\n`meal = {\"title\": \"oatmeal\", \"category\": \"breakfast\"}`\n\n- the part before each colon is the **key**: `\"title\"`\n- the part after it is the **value**: `\"oatmeal\"`\n- to get a value, use the key in square brackets: `meal[\"title\"]` gives `oatmeal`\n\nYour list will now hold dictionaries: one dictionary per meal. In `for meal in meals:`, each `meal` is one whole dictionary."},{"t":"example","title":"a list of dictionaries","code":"meals = []\nmeal = {\"title\": \"oatmeal\", \"category\": \"breakfast\"}\nmeals.append(meal)\nmeals.append({\"title\": \"soup\", \"category\": \"lunch\"})\nfor meal in meals:\n    print(meal[\"title\"], \"-\", meal[\"category\"])","output":"oatmeal - breakfast\nsoup - lunch","notes":["line 2: one meal, as a dictionary with two keys.","line 3: the whole dictionary goes into the list as one item.","line 5: on each pass, `meal` is one dictionary...","line 6: ...so `meal[\"title\"]` and `meal[\"category\"]` get its parts."]},{"t":"mc","kind":"predict","q":"What does this print?","code":"meal = {\"title\": \"toast\", \"category\": \"breakfast\"}\nprint(meal[\"category\"])","options":["breakfast","category","toast","an error"],"answer":0,"why":"The key \"category\" looks up its value, which is breakfast. The key itself is never printed; it's only the name you look things up by."},{"t":"mc","kind":"bug","q":"This crashes with `KeyError: 'Title'`. Why?","code":"meal = {\"title\": \"toast\", \"category\": \"breakfast\"}\nprint(meal[\"Title\"])","options":["Keys care about capitals: the key is \"title\", not \"Title\"","You can't print a dictionary value","The dictionary needs 4 keys","Titles must be numbers"],"answer":0,"why":"A KeyError means \"there's no key with that name\". \"Title\" with a capital T is a different key from \"title\". Spell the key exactly the way you made it."},{"t":"mc","kind":"why","q":"Why is each meal a dictionary instead of a list like `[\"toast\", \"breakfast\"]`?","options":["With a dictionary you get parts by name, like `meal[\"category\"]`, instead of remembering positions like `meal[1]`","Lists can't hold text","Dictionaries are faster to type","The for loop only works with dictionaries"],"answer":0,"why":"meal[\"category\"] says what it is. meal[1] makes you remember that position 1 is the category. With 4 parts per meal, names are much easier to read, for you and your teacher."},{"t":"tip","md":"**Good to know:** the brief lists the categories: breakfast, lunch, dinner, dessert and snack. Put them in the question, like `input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")`, so the user knows what to type."},{"t":"code","id":"p-c-dict","carry":"p-c-list","task":"**Your project, step 3: each meal becomes a dictionary.**\n\n- Choice 1 asks for the title, then the category. It builds a dictionary with the keys `title` and `category`, adds it to `meals`, and prints `meal added!`.\n- Choice 2 prints each meal's title and category on one line, like `oatmeal - breakfast`. Keep the `no entries yet` message.","starter":"# healthy meal tracker\n\n# the list that holds every meal. it is made once, before the loop\nmeals = []\n\n# show the menu again and again until the user picks 4\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1-4): \")\n\n    if choice == \"1\":\n        title = input(\"enter the title: \")\n        meals.append(title)\n        print(\"meal added!\")\n    elif choice == \"2\":\n        if len(meals) == 0:\n            print(\"no entries yet\")\n        else:\n            for title in meals:\n                print(\"-\", title)\n    elif choice == \"3\":\n        print(\"remove: coming soon\")\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n","tests":[{"inputs":["1","oatmeal","breakfast","1","soup","lunch","2","4"],"expect":["oatmeal","breakfast","soup","lunch","goodbye"]},{"inputs":["2","4"],"expect":["no entries yet","goodbye"]}],"require":["append","{"],"hints":["In choice 1, add a second question: `category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")`.","Build the dictionary from the two answers: `meal = {\"title\": title, \"category\": category}`, then `meals.append(meal)`.","In choice 2, loop with `for meal in meals:` and print `meal[\"title\"], \"-\", meal[\"category\"]`."],"solution":"# healthy meal tracker\n\n# the list that holds every meal. each meal is a dictionary\nmeals = []\n\n# show the menu again and again until the user picks 4\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1-4): \")\n\n    if choice == \"1\":\n        title = input(\"enter the title: \")\n        category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")\n        meal = {\"title\": title, \"category\": category}\n        meals.append(meal)\n        print(\"meal added!\")\n    elif choice == \"2\":\n        if len(meals) == 0:\n            print(\"no entries yet\")\n        else:\n            for meal in meals:\n                print(meal[\"title\"], \"-\", meal[\"category\"])\n    elif choice == \"3\":\n        print(\"remove: coming soon\")\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n"}]},{"id":"p-ingredients","title":"Step 4: ingredients and instructions","minutes":35,"learn":"a keep-asking loop that fills a list, a list inside a dictionary, and a loop inside a loop","blocks":[{"t":"text","md":"A meal can have any number of ingredients, so you can't write a fixed number of input lines. Use the **keep-asking loop** from Day 4:\n\n- start with an empty list: `ingredients = []`\n- `while True:` ask for one ingredient\n- if it's `done`, `break`\n- otherwise `append` it to the list\n\nThe whole list then goes into the dictionary, under the key `\"ingredients\"`. A list inside a dictionary is completely fine.\n\nTo print the ingredients, you need a **loop inside a loop**: the outer loop goes through the meals, and for each meal an inner loop goes through its ingredients."},{"t":"example","title":"filling a list until done","code":"ingredients = []\nwhile True:\n    ingredient = input(\"ingredient (or done): \")\n    if ingredient == \"done\":\n        break\n    ingredients.append(ingredient)\nprint(ingredients)","inputs":["banana","oats","done"],"output":"['banana', 'oats']","notes":["line 1: the empty list, made before the loop.","lines 4-5: check for done first. break jumps out before done can be added.","line 6: only real ingredients reach this line.","Here the user types banana, oats, then done."]},{"t":"example","title":"printing one meal so it's readable","code":"meal = {\"title\": \"smoothie\", \"category\": \"breakfast\", \"ingredients\": [\"banana\", \"oats\", \"milk\"], \"instructions\": \"blend everything.\"}\nprint(\"title:\", meal[\"title\"])\nprint(\"category:\", meal[\"category\"])\nprint(\"ingredients:\")\nfor ingredient in meal[\"ingredients\"]:\n    print(\"  -\", ingredient)\nprint(\"instructions:\", meal[\"instructions\"])","output":"title: smoothie\ncategory: breakfast\ningredients:\n  - banana\n  - oats\n  - milk\ninstructions: blend everything.","notes":["line 1: the key \"ingredients\" holds a whole list.","line 5: `meal[\"ingredients\"]` is that list, so a for loop can go through it.","line 6: one ingredient per line. That's the \"readable formatting\" the brief asks for."]},{"t":"mc","kind":"predict","q":"With the first example's code, the user types `eggs`, `cheese`, then `done`. What is in `ingredients` after the loop?","options":["`['eggs', 'cheese']`","`['eggs', 'cheese', 'done']`","`[]`","`['done']`"],"answer":0,"why":"When done is typed, break runs before the append line, so done is never added. Only eggs and cheese made it to the append."},{"t":"mc","kind":"why","q":"In your project, the ingredient loop sits **inside** the menu loop. When the user types `done`, which loop does `break` stop?","options":["Only the ingredient loop, the one it's in. The menu keeps going","Both loops, so the program ends","Only the menu loop","Neither: break only works with for"],"answer":0,"why":"break only leaves the loop it's directly inside. The ingredient loop ends, the instructions question comes next, and afterwards the menu shows up again as normal."},{"t":"mc","kind":"bug","q":"Someone moved the append above the if. What goes wrong?","code":"while True:\n    ingredient = input(\"ingredient (or done): \")\n    ingredients.append(ingredient)\n    if ingredient == \"done\":\n        break","options":["\"done\" gets saved as an ingredient","Nothing, it works the same","It never stops","The first ingredient is skipped"],"answer":0,"why":"Now every answer is added before the check, including done. The order matters: check for done first, then append.","norun":true},{"t":"code","id":"p-c-details","carry":"p-c-dict","task":"**Your project, step 4: ingredients and instructions.** Choice 1 now asks, in this order:\n\n- the title\n- the category\n- the ingredients, one at a time, until the user types `done`\n- the instructions\n\nSave all four in the dictionary, with the keys `title`, `category`, `ingredients` (a list) and `instructions`.\n\nChoice 2 prints every detail of every meal, readably, with each ingredient on its own line. Keep the `no entries yet` message.","starter":"# healthy meal tracker\n\n# the list that holds every meal. each meal is a dictionary\nmeals = []\n\n# show the menu again and again until the user picks 4\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1-4): \")\n\n    if choice == \"1\":\n        title = input(\"enter the title: \")\n        category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")\n        meal = {\"title\": title, \"category\": category}\n        meals.append(meal)\n        print(\"meal added!\")\n    elif choice == \"2\":\n        if len(meals) == 0:\n            print(\"no entries yet\")\n        else:\n            for meal in meals:\n                print(meal[\"title\"], \"-\", meal[\"category\"])\n    elif choice == \"3\":\n        print(\"remove: coming soon\")\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n","tests":[{"inputs":["1","smoothie","breakfast","banana","oats","almond milk","done","blend until smooth.","2","4"],"expect":["smoothie","breakfast","banana","oats","almond milk","blend until smooth.","goodbye"],"reject":["- done","'done'","\ndone\n"]},{"inputs":["1","toast","snack","bread","done","toast it.","1","salad","lunch","lettuce","tomato","done","mix it.","2","4"],"expect":["toast","bread","toast it.","salad","lettuce","tomato","mix it.","goodbye"],"reject":["- done","'done'","\ndone\n"]},{"inputs":["2","4"],"expect":["no entries yet","goodbye"]}],"require":["append"],"hints":["After the category question: `ingredients = []`, then `while True:`, ask for one ingredient, `if ingredient == \"done\": break`, otherwise append it.","After that loop, ask for the instructions. Then build the dictionary with all 4 keys: `{\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}`.","In choice 2, inside `for meal in meals:`, print the title, category and instructions, and put a second loop for the ingredients: `for ingredient in meal[\"ingredients\"]:`."],"solution":"# healthy meal tracker\n\n# the list that holds every meal. each meal is a dictionary\nmeals = []\n\n# show the menu again and again until the user picks 4\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1-4): \")\n\n    if choice == \"1\":\n        title = input(\"enter the title: \")\n        category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")\n\n        # keep asking for ingredients until the user types done\n        ingredients = []\n        while True:\n            ingredient = input(\"enter an ingredient (type done to finish): \")\n            if ingredient == \"done\":\n                break\n            ingredients.append(ingredient)\n\n        instructions = input(\"enter the instructions: \")\n        meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}\n        meals.append(meal)\n        print(\"meal added!\")\n    elif choice == \"2\":\n        if len(meals) == 0:\n            print(\"no entries yet\")\n        else:\n            for meal in meals:\n                print(\"title:\", meal[\"title\"])\n                print(\"category:\", meal[\"category\"])\n                print(\"ingredients:\")\n                for ingredient in meal[\"ingredients\"]:\n                    print(\"  -\", ingredient)\n                print(\"instructions:\", meal[\"instructions\"])\n                print()\n    elif choice == \"3\":\n        print(\"remove: coming soon\")\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n"}]},{"id":"p-functions","title":"Step 5: a function for each option","minutes":30,"learn":"def, calling a function, and why functions go above the loop","blocks":[{"t":"text","md":"Your menu loop is getting long and hard to read. The brief's hint says: **a function for each menu option**.\n\nA **function** is a block of code with a name. You make it once with `def`, and run it whenever you want by writing its name with brackets.\n\n- `def add_entry():` **defines** the function. Nothing runs yet.\n- `add_entry()` **calls** it: now its code runs.\n\nTwo rules for your project:\n\n- Put the functions **above** the menu loop. Python reads from the top, so a function must be defined before the line that calls it runs.\n- Keep `meals = []` at the very top, outside every function. The functions can still `append` to it and loop through it."},{"t":"example","title":"define once, call twice","code":"def say_hello():\n    print(\"hello!\")\n    print(\"nice to see you\")\n\nprint(\"before\")\nsay_hello()\nsay_hello()\nprint(\"after\")","output":"before\nhello!\nnice to see you\nhello!\nnice to see you\nafter","notes":["lines 1-3: the def only stores the function. Nothing is printed yet.","line 5: the first line that actually runs.","lines 6-7: each call runs the whole function once.","That's why the loop gets short: `add_entry()` replaces 15 lines."]},{"t":"mc","kind":"predict","q":"What does this print?","code":"def greet():\n    print(\"hi\")\n\nprint(\"start\")","options":["start","hi, then start","start, then hi","an error"],"answer":0,"why":"def only defines greet. It's never called (there's no `greet()` line), so hi is never printed."},{"t":"mc","kind":"bug","q":"What happens when you run this?","code":"show_menu()\n\ndef show_menu():\n    print(\"1. add\")","options":["It prints 1. add","NameError: Python reads from the top, and show_menu isn't defined yet on line 1","It prints nothing","SyntaxError"],"answer":1,"why":"Line 1 runs first, but the def comes later, so Python doesn't know the name yet. Put every def above the code that calls it."},{"t":"mc","kind":"why","q":"Why does `meals = []` go at the top of the file and not inside `add_entry()`?","options":["Inside add_entry, every call would make a new empty list, and the meals would be lost","Lists aren't allowed inside functions","So it runs faster","Python requires every list to be at the top"],"answer":0,"why":"If add_entry made the list, every call would start from an empty list, and view_entries couldn't see it either. One list at the top is shared by all the functions."},{"t":"code","id":"p-c-functions","carry":"p-c-details","task":"**Your project, step 5: functions.** Move the code of each option into its own function, above the menu loop:\n\n- `add_entry()`: everything choice 1 did\n- `view_entries()`: everything choice 2 did\n\nThen the loop just calls them: choice 1 runs `add_entry()` and choice 2 runs `view_entries()`. The program should work exactly like before.","starter":"# healthy meal tracker\n\n# the list that holds every meal. each meal is a dictionary\nmeals = []\n\n# show the menu again and again until the user picks 4\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1-4): \")\n\n    if choice == \"1\":\n        title = input(\"enter the title: \")\n        category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")\n\n        # keep asking for ingredients until the user types done\n        ingredients = []\n        while True:\n            ingredient = input(\"enter an ingredient (type done to finish): \")\n            if ingredient == \"done\":\n                break\n            ingredients.append(ingredient)\n\n        instructions = input(\"enter the instructions: \")\n        meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}\n        meals.append(meal)\n        print(\"meal added!\")\n    elif choice == \"2\":\n        if len(meals) == 0:\n            print(\"no entries yet\")\n        else:\n            for meal in meals:\n                print(\"title:\", meal[\"title\"])\n                print(\"category:\", meal[\"category\"])\n                print(\"ingredients:\")\n                for ingredient in meal[\"ingredients\"]:\n                    print(\"  -\", ingredient)\n                print(\"instructions:\", meal[\"instructions\"])\n                print()\n    elif choice == \"3\":\n        print(\"remove: coming soon\")\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n","tests":[{"inputs":["1","smoothie","breakfast","banana","oats","done","blend it.","2","4"],"expect":["smoothie","breakfast","banana","oats","blend it.","goodbye"],"reject":["- done","'done'"]},{"inputs":["2","4"],"expect":["no entries yet","goodbye"]}],"require":["def add_entry","def view_entries"],"hints":["Above `while True:`, write `def add_entry():` and move the choice-1 code under it. Fix the indent: the code is now 4 spaces in from def.","Do the same with `def view_entries():` for the choice-2 code.","In the loop: `if choice == \"1\":` then `add_entry()`, and `elif choice == \"2\":` then `view_entries()`."],"solution":"# healthy meal tracker\n\n# the list that holds every meal. each meal is a dictionary\nmeals = []\n\n# asks for the 4 parts of a meal and adds it to the list\ndef add_entry():\n    title = input(\"enter the title: \")\n    category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")\n\n    # keep asking for ingredients until the user types done\n    ingredients = []\n    while True:\n        ingredient = input(\"enter an ingredient (type done to finish): \")\n        if ingredient == \"done\":\n            break\n        ingredients.append(ingredient)\n\n    instructions = input(\"enter the instructions: \")\n    meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}\n    meals.append(meal)\n    print(\"meal added!\")\n\n# prints every meal with all its details\ndef view_entries():\n    if len(meals) == 0:\n        print(\"no entries yet\")\n    else:\n        for meal in meals:\n            print(\"title:\", meal[\"title\"])\n            print(\"category:\", meal[\"category\"])\n            print(\"ingredients:\")\n            for ingredient in meal[\"ingredients\"]:\n                print(\"  -\", ingredient)\n            print(\"instructions:\", meal[\"instructions\"])\n            print()\n\n# show the menu again and again until the user picks 4\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1-4): \")\n\n    if choice == \"1\":\n        add_entry()\n    elif choice == \"2\":\n        view_entries()\n    elif choice == \"3\":\n        print(\"remove: coming soon\")\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n"}]},{"id":"p-remove","title":"Step 6: remove a meal","minutes":30,"learn":"searching a list with a loop, a found flag, remove(), and a friendly message","blocks":[{"t":"text","md":"To remove a meal by its title, go through the list and look at each meal's title. If it matches, remove that meal and stop looking.\n\nThe tricky part is the **not found** message. You only know a title isn't there after you've checked **every** meal, so the message must come **after** the loop. To remember whether you found it, use a **found flag**:\n\n- before the loop: `found = False`\n- when it matches: `found = True`\n- after the loop: `if found:` say it was removed, `else:` say it wasn't found\n\n`meals.remove(meal)` takes that one dictionary out of the list."},{"t":"example","title":"a found flag","code":"fruits = [\"apple\", \"kiwi\", \"mango\"]\nwanted = \"kiwi\"\nfound = False\nfor fruit in fruits:\n    if fruit == wanted:\n        found = True\n        break\nif found:\n    print(wanted, \"is in the list\")\nelse:\n    print(\"sorry,\", wanted, \"was not found\")","output":"kiwi is in the list","notes":["line 3: start by assuming it's not there.","line 6: the moment it matches, flip the flag to True.","line 7: no need to keep looking.","lines 8-11: after the loop, the flag tells you what happened. Change wanted to \"pear\" and run it again."]},{"t":"mc","kind":"predict","q":"This puts the message inside the loop. What does it print?","code":"meals = [{\"title\": \"soup\"}, {\"title\": \"salad\"}]\ntitle = \"salad\"\nfor meal in meals:\n    if meal[\"title\"] == title:\n        print(\"removed\")\n    else:\n        print(\"not found\")","options":["not found, then removed (one per line)","removed","not found","removed, then not found (one per line)"],"answer":0,"why":"On pass 1 the meal is soup, which doesn't match, so the else prints not found. On pass 2 salad matches. The user sees both, which is confusing. That's why the not-found message goes after the loop, with a flag."},{"t":"mc","kind":"why","q":"Why is there a `break` right after `meals.remove(meal)`?","options":["You've found it, so there's nothing more to look for. It also stops the loop from going on through a list you just changed","remove() doesn't work without break","It ends the whole program","It deletes all the meals"],"answer":0,"why":"Once the meal is removed, the job is done. Changing a list while a for loop is still walking through it can make the loop skip items, so it's safest to stop right away."},{"t":"code","id":"p-c-remove","carry":"p-c-functions","task":"**Your project, step 6: remove a meal.** Write `remove_entry()` above the loop, and call it for choice 3.\n\n- It asks for the title of the meal to remove.\n- If a meal has that title, remove it from `meals` and print a message with the word `removed`.\n- If no meal has that title, print a friendly message with the words `not found`, like `sorry, pizza was not found.`","starter":"# healthy meal tracker\n\n# the list that holds every meal. each meal is a dictionary\nmeals = []\n\n# asks for the 4 parts of a meal and adds it to the list\ndef add_entry():\n    title = input(\"enter the title: \")\n    category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")\n\n    # keep asking for ingredients until the user types done\n    ingredients = []\n    while True:\n        ingredient = input(\"enter an ingredient (type done to finish): \")\n        if ingredient == \"done\":\n            break\n        ingredients.append(ingredient)\n\n    instructions = input(\"enter the instructions: \")\n    meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}\n    meals.append(meal)\n    print(\"meal added!\")\n\n# prints every meal with all its details\ndef view_entries():\n    if len(meals) == 0:\n        print(\"no entries yet\")\n    else:\n        for meal in meals:\n            print(\"title:\", meal[\"title\"])\n            print(\"category:\", meal[\"category\"])\n            print(\"ingredients:\")\n            for ingredient in meal[\"ingredients\"]:\n                print(\"  -\", ingredient)\n            print(\"instructions:\", meal[\"instructions\"])\n            print()\n\n# show the menu again and again until the user picks 4\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1-4): \")\n\n    if choice == \"1\":\n        add_entry()\n    elif choice == \"2\":\n        view_entries()\n    elif choice == \"3\":\n        print(\"remove: coming soon\")\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n","tests":[{"inputs":["1","oatmeal","breakfast","oats","done","cook it.","3","oatmeal","2","4"],"expect":["removed","no entries yet","goodbye"],"reject":["not found"]},{"inputs":["1","soup","lunch","water","done","heat it.","3","pizza","2","4"],"expect":["not found","soup","goodbye"],"reject":["removed"]},{"inputs":["3","pizza","4"],"expect":["not found","goodbye"]},{"inputs":["1","toast","snack","bread","done","toast it.","1","salad","lunch","lettuce","done","mix it.","3","salad","2","4"],"expect":["removed","toast","goodbye"],"reject":["not found"]}],"require":["def remove_entry","remove("],"hints":["`def remove_entry():` then `title = input(\"enter the title of the meal to remove: \")` and `found = False`.","Loop with `for meal in meals:`. If `meal[\"title\"] == title`: `meals.remove(meal)`, `found = True`, `break`.","After the loop (no longer indented under the for): `if found:` print the removed message, `else:` the not found message. Then call `remove_entry()` for choice 3."],"solution":"# healthy meal tracker\n\n# the list that holds every meal. each meal is a dictionary\nmeals = []\n\n# asks for the 4 parts of a meal and adds it to the list\ndef add_entry():\n    title = input(\"enter the title: \")\n    category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")\n\n    # keep asking for ingredients until the user types done\n    ingredients = []\n    while True:\n        ingredient = input(\"enter an ingredient (type done to finish): \")\n        if ingredient == \"done\":\n            break\n        ingredients.append(ingredient)\n\n    instructions = input(\"enter the instructions: \")\n    meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}\n    meals.append(meal)\n    print(\"meal added!\")\n\n# prints every meal with all its details\ndef view_entries():\n    if len(meals) == 0:\n        print(\"no entries yet\")\n    else:\n        for meal in meals:\n            print(\"title:\", meal[\"title\"])\n            print(\"category:\", meal[\"category\"])\n            print(\"ingredients:\")\n            for ingredient in meal[\"ingredients\"]:\n                print(\"  -\", ingredient)\n            print(\"instructions:\", meal[\"instructions\"])\n            print()\n\n# asks for a title and removes that meal, or says it was not found\ndef remove_entry():\n    title = input(\"enter the title of the meal to remove: \")\n    found = False\n    for meal in meals:\n        if meal[\"title\"] == title:\n            meals.remove(meal)\n            found = True\n            break\n    if found:\n        print(title, \"was removed.\")\n    else:\n        print(\"sorry,\", title, \"was not found.\")\n\n# show the menu again and again until the user picks 4\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1-4): \")\n\n    if choice == \"1\":\n        add_entry()\n    elif choice == \"2\":\n        view_entries()\n    elif choice == \"3\":\n        remove_entry()\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n"}]},{"id":"p-final","title":"Step 7: comments and the final check","minutes":25,"learn":"comments that explain your code (requirement 7), and testing the whole program","blocks":[{"t":"text","md":"Requirement 7 says your code has to be **commented**: explain what you're doing. A comment starts with `#`, and Python skips it.\n\nGood places for a comment:\n\n- at the very top: what the program is\n- above `meals = []`: what the list holds\n- above each function: what it does\n- inside the tricky parts: the ingredient loop, the found flag\n\nA good comment says **what and why** in your own words, not just the Python word. `# loop` tells your teacher nothing. `# keep asking for ingredients until the user types done` shows you understand it."},{"t":"mc","kind":"what","q":"Which comment is the most useful above the ingredient loop?","options":["`# loop`","`# keep asking for ingredients until the user types done, and save each one in the list`","`# this is a while True`","`# code`"],"answer":1,"why":"It says what the code does and why, in plain words. The others only name things your teacher can already see."},{"t":"tip","md":"**Before you hand it in:** run it in VS Code and try every path once:\n\n- view while the list is still empty\n- add two meals, then view them\n- remove one of them, then view again\n- remove a title that doesn't exist\n- type 7 in the menu\n- quit\n\nIf all of that works, you've covered requirements 1 to 6."},{"t":"code","id":"p-c-final","carry":"p-c-remove","comments":6,"task":"**Your project, step 7: finish it.** Add comments (requirement 7), at least 6:\n\n- one at the top saying what the program is\n- one above `meals = []`\n- one above each function\n- one inside the ingredient loop or at the found flag\n\nThen press **Check my code**: the test runs a whole session (view, add two meals, view, remove one, remove one that doesn't exist, a wrong choice, quit). When it passes, copy it into VS Code as your project file.","starter":"# healthy meal tracker\n\n# the list that holds every meal. each meal is a dictionary\nmeals = []\n\n# asks for the 4 parts of a meal and adds it to the list\ndef add_entry():\n    title = input(\"enter the title: \")\n    category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")\n\n    # keep asking for ingredients until the user types done\n    ingredients = []\n    while True:\n        ingredient = input(\"enter an ingredient (type done to finish): \")\n        if ingredient == \"done\":\n            break\n        ingredients.append(ingredient)\n\n    instructions = input(\"enter the instructions: \")\n    meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}\n    meals.append(meal)\n    print(\"meal added!\")\n\n# prints every meal with all its details\ndef view_entries():\n    if len(meals) == 0:\n        print(\"no entries yet\")\n    else:\n        for meal in meals:\n            print(\"title:\", meal[\"title\"])\n            print(\"category:\", meal[\"category\"])\n            print(\"ingredients:\")\n            for ingredient in meal[\"ingredients\"]:\n                print(\"  -\", ingredient)\n            print(\"instructions:\", meal[\"instructions\"])\n            print()\n\n# asks for a title and removes that meal, or says it was not found\ndef remove_entry():\n    title = input(\"enter the title of the meal to remove: \")\n    found = False\n    for meal in meals:\n        if meal[\"title\"] == title:\n            meals.remove(meal)\n            found = True\n            break\n    if found:\n        print(title, \"was removed.\")\n    else:\n        print(\"sorry,\", title, \"was not found.\")\n\n# show the menu again and again until the user picks 4\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1-4): \")\n\n    if choice == \"1\":\n        add_entry()\n    elif choice == \"2\":\n        view_entries()\n    elif choice == \"3\":\n        remove_entry()\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n","tests":[{"inputs":["2","1","smoothie","breakfast","banana","oats","done","blend it.","1","egg wrap","lunch","eggs","spinach","done","fry and wrap.","2","3","egg wrap","3","pizza","7","4"],"expect":["no entries yet","smoothie","banana","blend it.","egg wrap","spinach","fry and wrap.","removed","not found","not a choice","goodbye"]}],"require":["def add_entry","def view_entries","def remove_entry"],"hints":["Comments start with `#`. Put each one on its own line above the part it explains.","Explain in your own words, like `# asks for the 4 parts of a meal and adds it to the list`.","If the test fails, read which word is missing. Each word is one message from an earlier step, like `not found` or `goodbye`."],"solution":"# healthy meal tracker\n# a program to add, view and remove healthy meals from the terminal\n\n# the list that holds every meal. each meal is a dictionary with\n# a title, a category, a list of ingredients and the instructions\nmeals = []\n\n# asks for the 4 parts of a meal, puts them in a dictionary and adds it to the list\ndef add_entry():\n    title = input(\"enter the title: \")\n    category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")\n\n    # keep asking for ingredients until the user types done\n    ingredients = []\n    while True:\n        ingredient = input(\"enter an ingredient (type done to finish): \")\n        if ingredient == \"done\":\n            break\n        ingredients.append(ingredient)\n\n    instructions = input(\"enter the instructions: \")\n    meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}\n    meals.append(meal)\n    print(\"meal added!\")\n\n# prints every meal with all its details, or a message if there are none\ndef view_entries():\n    if len(meals) == 0:\n        print(\"no entries yet\")\n    else:\n        for meal in meals:\n            print(\"title:\", meal[\"title\"])\n            print(\"category:\", meal[\"category\"])\n            print(\"ingredients:\")\n            # a loop inside the loop: one line per ingredient\n            for ingredient in meal[\"ingredients\"]:\n                print(\"  -\", ingredient)\n            print(\"instructions:\", meal[\"instructions\"])\n            print()\n\n# asks for a title and removes that meal, or says it was not found\ndef remove_entry():\n    title = input(\"enter the title of the meal to remove: \")\n    # found remembers if we saw the title while looping\n    found = False\n    for meal in meals:\n        if meal[\"title\"] == title:\n            meals.remove(meal)\n            found = True\n            break\n    # only after checking every meal do we know it was not there\n    if found:\n        print(title, \"was removed.\")\n    else:\n        print(\"sorry,\", title, \"was not found.\")\n\n# show the menu again and again until the user picks 4\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1-4): \")\n\n    # run the function that matches the choice\n    if choice == \"1\":\n        add_entry()\n    elif choice == \"2\":\n        view_entries()\n    elif choice == \"3\":\n        remove_entry()\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n"},{"t":"explain","q":"Walk your teacher through your Healthy Meal Tracker: what happens from the moment it starts until the user quits?","points":["meals is an empty list made at the top; each meal is a dictionary with title, category, ingredients and instructions","the menu is in a while True loop that shows the options and asks for a choice until the user picks quit, then break","add_entry asks for the 4 parts, collects ingredients in a list until done, and appends the dictionary to meals","view_entries loops through the meals, and an inner loop prints each ingredient; an empty list shows a message","remove_entry loops to find the title, removes it, and uses a found flag to show a friendly not found message"],"model":"When the program starts, it makes an empty list called meals. Each meal I add is a dictionary with a title, a category, a list of ingredients and the instructions. Then a while True loop shows the menu and asks for a choice, again and again. Choice 1 calls add_entry, which asks for the title and category, then keeps asking for ingredients until I type done, then asks for the instructions, and appends the dictionary to the list. Choice 2 calls view_entries, which loops through the meals and prints every detail, with a second loop for the ingredients. If the list is empty it says so. Choice 3 calls remove_entry: it loops through the meals looking for the title, removes it, and uses a found flag so it can show a friendly message if the title isn't there. Choice 4 prints goodbye and break ends the loop."}]},{"id":"p-extras","title":"Step 8 (optional): edit and search","minutes":40,"learn":"functions that return a value, None, and searching text with in","blocks":[{"t":"text","md":"The brief has two optional extras: **F1, edit an entry** and **F2, search by keyword**. You don't need them to pass, but each one is just one more function plus one more menu option.\n\nWith 6 options, quit moves to the end: `4. edit an entry`, `5. search entries by keyword`, `6. quit`.\n\n**F1, edit.** First find the meal, then change it. Finding is a job of its own, so give it a function that **returns** the meal: `find_meal(title)`. `return` hands a value back to whoever called the function. If the loop finishes without finding anything, the function returns `None`, Python's word for \"nothing\"."},{"t":"example","title":"find_meal gives back the meal, or None","code":"meals = [{\"title\": \"soup\", \"category\": \"lunch\"}, {\"title\": \"toast\", \"category\": \"breakfast\"}]\n\ndef find_meal(title):\n    for meal in meals:\n        if meal[\"title\"] == title:\n            return meal\n    return None\n\nfound = find_meal(\"toast\")\nprint(found)\nprint(find_meal(\"pizza\"))\nfound[\"category\"] = \"snack\"\nprint(meals[1])","output":"{'title': 'toast', 'category': 'breakfast'}\nNone\n{'title': 'toast', 'category': 'snack'}","notes":["line 6: return ends the function at once and hands the meal back.","line 7: only reached if no title matched.","line 12: changing the returned dictionary changes the meal inside the list. That's how editing works."]},{"t":"mc","kind":"why","q":"Why does `find_meal` have `return None` after the loop, not inside it?","options":["Only after checking every meal do you know it isn't there","Python needs a return on the last line of every function","So the loop runs faster","None deletes the meal"],"answer":0,"why":"It's the same idea as the found flag. Inside the loop, a meal that doesn't match only tells you about that one meal. After the loop, you know none matched."},{"t":"code","id":"p-c-edit","carry":"p-c-final","task":"**F1: edit an entry.** Change the menu to 6 options (`4. edit an entry`, `5. search entries by keyword`, `6. quit`). For now, 5 prints a placeholder.\n\nWrite `find_meal(title)` and `edit_entry()`, and call edit_entry for choice 4:\n\n- edit_entry asks for the title of the meal to edit.\n- If find_meal gives `None`, print a message with the words `not found`.\n- Otherwise ask for the new title, the new category, the new ingredients until `done`, and the new instructions. Store them in that meal's dictionary and print `meal updated!`.","starter":"# healthy meal tracker\n# a program to add, view and remove healthy meals from the terminal\n\n# the list that holds every meal. each meal is a dictionary with\n# a title, a category, a list of ingredients and the instructions\nmeals = []\n\n# asks for the 4 parts of a meal, puts them in a dictionary and adds it to the list\ndef add_entry():\n    title = input(\"enter the title: \")\n    category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")\n\n    # keep asking for ingredients until the user types done\n    ingredients = []\n    while True:\n        ingredient = input(\"enter an ingredient (type done to finish): \")\n        if ingredient == \"done\":\n            break\n        ingredients.append(ingredient)\n\n    instructions = input(\"enter the instructions: \")\n    meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}\n    meals.append(meal)\n    print(\"meal added!\")\n\n# prints every meal with all its details, or a message if there are none\ndef view_entries():\n    if len(meals) == 0:\n        print(\"no entries yet\")\n    else:\n        for meal in meals:\n            print(\"title:\", meal[\"title\"])\n            print(\"category:\", meal[\"category\"])\n            print(\"ingredients:\")\n            # a loop inside the loop: one line per ingredient\n            for ingredient in meal[\"ingredients\"]:\n                print(\"  -\", ingredient)\n            print(\"instructions:\", meal[\"instructions\"])\n            print()\n\n# asks for a title and removes that meal, or says it was not found\ndef remove_entry():\n    title = input(\"enter the title of the meal to remove: \")\n    # found remembers if we saw the title while looping\n    found = False\n    for meal in meals:\n        if meal[\"title\"] == title:\n            meals.remove(meal)\n            found = True\n            break\n    # only after checking every meal do we know it was not there\n    if found:\n        print(title, \"was removed.\")\n    else:\n        print(\"sorry,\", title, \"was not found.\")\n\n# show the menu again and again until the user picks 4\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. quit\")\n    choice = input(\"enter your choice (1-4): \")\n\n    # run the function that matches the choice\n    if choice == \"1\":\n        add_entry()\n    elif choice == \"2\":\n        view_entries()\n    elif choice == \"3\":\n        remove_entry()\n    elif choice == \"4\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n","tests":[{"inputs":["1","oatmeal","breakfast","oats","done","cook it.","4","oatmeal","overnight oats","breakfast","oats","yogurt","done","leave it in the fridge.","2","6"],"expect":["updated","overnight oats","yogurt","leave it in the fridge.","goodbye"],"reject":["cook it.","'done'","- done"]},{"inputs":["4","pizza","6"],"expect":["not found","goodbye"]},{"inputs":["1","soup","lunch","water","done","heat it.","4","soup","soup","dinner","water","carrots","done","heat it slowly.","2","6"],"expect":["dinner","carrots","heat it slowly.","goodbye"],"reject":["- done"]}],"require":["def find_meal","def edit_entry","return"],"hints":["`def find_meal(title):` loops through meals and does `return meal` when the title matches. After the loop: `return None`.","In edit_entry: `meal = find_meal(title)`. Then `if meal == None:` print the not found message, `else:` ask the new values.","Store each new value in the same dictionary, like `meal[\"title\"] = input(\"new title: \")`. Build the new ingredients list with the same done loop as add_entry."],"solution":"# healthy meal tracker\n# a program to add, view and remove healthy meals from the terminal\n\n# the list that holds every meal. each meal is a dictionary with\n# a title, a category, a list of ingredients and the instructions\nmeals = []\n\n# asks for the 4 parts of a meal, puts them in a dictionary and adds it to the list\ndef add_entry():\n    title = input(\"enter the title: \")\n    category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")\n\n    # keep asking for ingredients until the user types done\n    ingredients = []\n    while True:\n        ingredient = input(\"enter an ingredient (type done to finish): \")\n        if ingredient == \"done\":\n            break\n        ingredients.append(ingredient)\n\n    instructions = input(\"enter the instructions: \")\n    meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}\n    meals.append(meal)\n    print(\"meal added!\")\n\n# prints every meal with all its details, or a message if there are none\ndef view_entries():\n    if len(meals) == 0:\n        print(\"no entries yet\")\n    else:\n        for meal in meals:\n            print(\"title:\", meal[\"title\"])\n            print(\"category:\", meal[\"category\"])\n            print(\"ingredients:\")\n            # a loop inside the loop: one line per ingredient\n            for ingredient in meal[\"ingredients\"]:\n                print(\"  -\", ingredient)\n            print(\"instructions:\", meal[\"instructions\"])\n            print()\n\n# asks for a title and removes that meal, or says it was not found\ndef remove_entry():\n    title = input(\"enter the title of the meal to remove: \")\n    # found remembers if we saw the title while looping\n    found = False\n    for meal in meals:\n        if meal[\"title\"] == title:\n            meals.remove(meal)\n            found = True\n            break\n    # only after checking every meal do we know it was not there\n    if found:\n        print(title, \"was removed.\")\n    else:\n        print(\"sorry,\", title, \"was not found.\")\n\n# looks for a meal by its title: gives back the meal, or None if it isn't there\ndef find_meal(title):\n    for meal in meals:\n        if meal[\"title\"] == title:\n            return meal\n    return None\n\n# lets the user change every part of one meal\ndef edit_entry():\n    title = input(\"enter the title of the meal to edit: \")\n    meal = find_meal(title)\n    if meal == None:\n        print(\"sorry,\", title, \"was not found.\")\n    else:\n        # ask for the new values and store them in the same dictionary\n        meal[\"title\"] = input(\"new title: \")\n        meal[\"category\"] = input(\"new category: \")\n        ingredients = []\n        while True:\n            ingredient = input(\"enter an ingredient (type done to finish): \")\n            if ingredient == \"done\":\n                break\n            ingredients.append(ingredient)\n        meal[\"ingredients\"] = ingredients\n        meal[\"instructions\"] = input(\"new instructions: \")\n        print(\"meal updated!\")\n\n# show the menu again and again until the user picks 6\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. edit an entry\")\n    print(\"5. search entries by keyword\")\n    print(\"6. quit\")\n    choice = input(\"enter your choice (1-6): \")\n\n    # run the function that matches the choice\n    if choice == \"1\":\n        add_entry()\n    elif choice == \"2\":\n        view_entries()\n    elif choice == \"3\":\n        remove_entry()\n    elif choice == \"4\":\n        edit_entry()\n    elif choice == \"5\":\n        print(\"search: coming soon\")\n    elif choice == \"6\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n"},{"t":"text","md":"**F2, search.** Ask for a keyword, then show every meal that matches. A meal matches if the keyword is in its title, **or** in one of its ingredients.\n\n`in` works on text: `\"egg\" in \"egg wrap\"` is True, because egg appears inside the text. Loop through the ingredients and check each one the same way. Count the matches, so that after the loop you can say `no matches found.` when there were none."},{"t":"mc","kind":"predict","q":"What does this print?","code":"print(\"egg\" in \"egg wrap\")\nprint(\"egg\" in \"boiled eggs\")\nprint(\"Egg\" in \"egg wrap\")","options":["True, True, False","True, False, False","True, True, True","False, True, False"],"answer":0,"why":"in finds egg anywhere inside the text, so boiled eggs counts too. But capitals matter: Egg with a capital E is not in egg wrap."},{"t":"code","id":"p-c-search","carry":"p-c-edit","task":"**F2: search by keyword.** Write `search_entries()` and call it for choice 5.\n\n- It asks for a keyword.\n- It prints the title of every meal whose title contains the keyword, or that has an ingredient containing the keyword.\n- If nothing matches, it prints `no matches found.`\n\nExample: searching `almond` finds a smoothie that has almond milk.","starter":"# healthy meal tracker\n# a program to add, view and remove healthy meals from the terminal\n\n# the list that holds every meal. each meal is a dictionary with\n# a title, a category, a list of ingredients and the instructions\nmeals = []\n\n# asks for the 4 parts of a meal, puts them in a dictionary and adds it to the list\ndef add_entry():\n    title = input(\"enter the title: \")\n    category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")\n\n    # keep asking for ingredients until the user types done\n    ingredients = []\n    while True:\n        ingredient = input(\"enter an ingredient (type done to finish): \")\n        if ingredient == \"done\":\n            break\n        ingredients.append(ingredient)\n\n    instructions = input(\"enter the instructions: \")\n    meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}\n    meals.append(meal)\n    print(\"meal added!\")\n\n# prints every meal with all its details, or a message if there are none\ndef view_entries():\n    if len(meals) == 0:\n        print(\"no entries yet\")\n    else:\n        for meal in meals:\n            print(\"title:\", meal[\"title\"])\n            print(\"category:\", meal[\"category\"])\n            print(\"ingredients:\")\n            # a loop inside the loop: one line per ingredient\n            for ingredient in meal[\"ingredients\"]:\n                print(\"  -\", ingredient)\n            print(\"instructions:\", meal[\"instructions\"])\n            print()\n\n# asks for a title and removes that meal, or says it was not found\ndef remove_entry():\n    title = input(\"enter the title of the meal to remove: \")\n    # found remembers if we saw the title while looping\n    found = False\n    for meal in meals:\n        if meal[\"title\"] == title:\n            meals.remove(meal)\n            found = True\n            break\n    # only after checking every meal do we know it was not there\n    if found:\n        print(title, \"was removed.\")\n    else:\n        print(\"sorry,\", title, \"was not found.\")\n\n# looks for a meal by its title: gives back the meal, or None if it isn't there\ndef find_meal(title):\n    for meal in meals:\n        if meal[\"title\"] == title:\n            return meal\n    return None\n\n# lets the user change every part of one meal\ndef edit_entry():\n    title = input(\"enter the title of the meal to edit: \")\n    meal = find_meal(title)\n    if meal == None:\n        print(\"sorry,\", title, \"was not found.\")\n    else:\n        # ask for the new values and store them in the same dictionary\n        meal[\"title\"] = input(\"new title: \")\n        meal[\"category\"] = input(\"new category: \")\n        ingredients = []\n        while True:\n            ingredient = input(\"enter an ingredient (type done to finish): \")\n            if ingredient == \"done\":\n                break\n            ingredients.append(ingredient)\n        meal[\"ingredients\"] = ingredients\n        meal[\"instructions\"] = input(\"new instructions: \")\n        print(\"meal updated!\")\n\n# show the menu again and again until the user picks 6\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. edit an entry\")\n    print(\"5. search entries by keyword\")\n    print(\"6. quit\")\n    choice = input(\"enter your choice (1-6): \")\n\n    # run the function that matches the choice\n    if choice == \"1\":\n        add_entry()\n    elif choice == \"2\":\n        view_entries()\n    elif choice == \"3\":\n        remove_entry()\n    elif choice == \"4\":\n        edit_entry()\n    elif choice == \"5\":\n        print(\"search: coming soon\")\n    elif choice == \"6\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n","tests":[{"inputs":["1","egg wrap","lunch","eggs","spinach","done","wrap it.","1","green smoothie","snack","banana","almond milk","done","blend it.","5","almond","6"],"expect":["green smoothie","goodbye"],"reject":["no matches"]},{"inputs":["1","egg wrap","lunch","eggs","spinach","done","wrap it.","1","green smoothie","snack","banana","almond milk","done","blend it.","5","pizza","6"],"expect":["no matches","goodbye"]},{"inputs":["1","egg wrap","lunch","eggs","spinach","done","wrap it.","1","apple oatmeal","breakfast","oats","apple","done","cook it.","5","egg","6"],"expect":["egg wrap","goodbye"],"reject":["apple oatmeal","no matches"]}],"require":["def search_entries"," in "],"hints":["`keyword = input(\"enter a keyword: \")` and `matches = 0`. Then `for meal in meals:`.","Inside: `match = keyword in meal[\"title\"]`, then loop through `meal[\"ingredients\"]` and set `match = True` if `keyword in ingredient`.","`if match:` print the title and add 1 to matches. After the loop: `if matches == 0:` print `no matches found.`"],"solution":"# healthy meal tracker\n# a program to add, view and remove healthy meals from the terminal\n\n# the list that holds every meal. each meal is a dictionary with\n# a title, a category, a list of ingredients and the instructions\nmeals = []\n\n# asks for the 4 parts of a meal, puts them in a dictionary and adds it to the list\ndef add_entry():\n    title = input(\"enter the title: \")\n    category = input(\"enter the category (breakfast, lunch, dinner, dessert, snack): \")\n\n    # keep asking for ingredients until the user types done\n    ingredients = []\n    while True:\n        ingredient = input(\"enter an ingredient (type done to finish): \")\n        if ingredient == \"done\":\n            break\n        ingredients.append(ingredient)\n\n    instructions = input(\"enter the instructions: \")\n    meal = {\"title\": title, \"category\": category, \"ingredients\": ingredients, \"instructions\": instructions}\n    meals.append(meal)\n    print(\"meal added!\")\n\n# prints every meal with all its details, or a message if there are none\ndef view_entries():\n    if len(meals) == 0:\n        print(\"no entries yet\")\n    else:\n        for meal in meals:\n            print(\"title:\", meal[\"title\"])\n            print(\"category:\", meal[\"category\"])\n            print(\"ingredients:\")\n            # a loop inside the loop: one line per ingredient\n            for ingredient in meal[\"ingredients\"]:\n                print(\"  -\", ingredient)\n            print(\"instructions:\", meal[\"instructions\"])\n            print()\n\n# asks for a title and removes that meal, or says it was not found\ndef remove_entry():\n    title = input(\"enter the title of the meal to remove: \")\n    # found remembers if we saw the title while looping\n    found = False\n    for meal in meals:\n        if meal[\"title\"] == title:\n            meals.remove(meal)\n            found = True\n            break\n    # only after checking every meal do we know it was not there\n    if found:\n        print(title, \"was removed.\")\n    else:\n        print(\"sorry,\", title, \"was not found.\")\n\n# looks for a meal by its title: gives back the meal, or None if it isn't there\ndef find_meal(title):\n    for meal in meals:\n        if meal[\"title\"] == title:\n            return meal\n    return None\n\n# lets the user change every part of one meal\ndef edit_entry():\n    title = input(\"enter the title of the meal to edit: \")\n    meal = find_meal(title)\n    if meal == None:\n        print(\"sorry,\", title, \"was not found.\")\n    else:\n        # ask for the new values and store them in the same dictionary\n        meal[\"title\"] = input(\"new title: \")\n        meal[\"category\"] = input(\"new category: \")\n        ingredients = []\n        while True:\n            ingredient = input(\"enter an ingredient (type done to finish): \")\n            if ingredient == \"done\":\n                break\n            ingredients.append(ingredient)\n        meal[\"ingredients\"] = ingredients\n        meal[\"instructions\"] = input(\"new instructions: \")\n        print(\"meal updated!\")\n\n# shows every meal whose title or ingredients contain the keyword\ndef search_entries():\n    keyword = input(\"enter a keyword: \")\n    matches = 0\n    for meal in meals:\n        # check the title first, then each ingredient\n        match = keyword in meal[\"title\"]\n        for ingredient in meal[\"ingredients\"]:\n            if keyword in ingredient:\n                match = True\n        if match:\n            print(\"-\", meal[\"title\"])\n            matches = matches + 1\n    if matches == 0:\n        print(\"no matches found.\")\n\n# show the menu again and again until the user picks 6\nwhile True:\n    print(\"--- healthy meal tracker ---\")\n    print(\"1. add a new entry\")\n    print(\"2. view all entries\")\n    print(\"3. remove an entry\")\n    print(\"4. edit an entry\")\n    print(\"5. search entries by keyword\")\n    print(\"6. quit\")\n    choice = input(\"enter your choice (1-6): \")\n\n    # run the function that matches the choice\n    if choice == \"1\":\n        add_entry()\n    elif choice == \"2\":\n        view_entries()\n    elif choice == \"3\":\n        remove_entry()\n    elif choice == \"4\":\n        edit_entry()\n    elif choice == \"5\":\n        search_entries()\n    elif choice == \"6\":\n        print(\"goodbye!\")\n        break\n    else:\n        print(\"not a choice, please try again.\")\n"}]}]}};

      if (!list.length) return;
